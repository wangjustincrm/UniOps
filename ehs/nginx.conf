# Safety frontend — nginx static serving with SPA fallback.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app's service worker and manifest: always asked for afresh, so an
    # update — or the withdrawal described in sw.js — reaches every phone on
    # its next open. Explicit types: an older mime.types may not know
    # .webmanifest, and a worker served with the wrong type is refused.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        default_type application/javascript;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA routing — every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
