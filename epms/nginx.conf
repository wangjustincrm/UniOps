# EPMS frontend — nginx static serving with SPA fallback.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vite emits the pdf.js worker as a .mjs asset, but nginx's default
    # mime.types has no .mjs mapping — it would be served as
    # application/octet-stream and the browser refuses to execute it as a
    # module worker (PDF preview fails). Regex location wins over the
    # /assets/ prefix, so keep the same cache headers here.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing — every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
