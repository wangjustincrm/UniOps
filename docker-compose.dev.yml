# UniOps — Local Development Stack
# DEV ONLY: not used in production (production uses distributed servers)
# Usage: docker compose -f docker-compose.dev.yml up
#
# Production deployment: see DEPLOYMENT.md

name: uniops-dev

x-python-base: &python-base
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
    JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    JWT_ALGORITHM: HS256
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: epms
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_DB: epms

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: uniops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: epms
      # Single source of truth: same var the backend services authenticate with
      # (${DB_PASSWORD} in .env). Keeps the local DB role password aligned with
      # every DATABASE_URL/POSTGRES_PASSWORD below.
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: epms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epms -d epms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uniops_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend Services ─────────────────────────────────────────────────────────

  epms-api:
    <<: *python-base
    build:
      context: .
      dockerfile: epms-api/Dockerfile
    container_name: uniops_epms_api
    ports:
      - "8000:8000"
    volumes:
      - ./epms-api:/app
      - ./packages/authz:/packages/authz
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      POSTGRES_HOST: postgres
      # epms-api computes its connection string from POSTGRES_* as a @property
      # and IGNORES DATABASE_URL (app/core/config.py:52). This block overrides
      # x-python-base wholesale -- YAML `<<:` does not deep-merge -- so every
      # POSTGRES_* the app reads must be repeated here. Omitting the password
      # silently fell back to the "epms_dev" default: every DB call failed auth
      # while /health (which touches no DB) still reported healthy.
      POSTGRES_PORT: "5432"
      POSTGRES_USER: epms
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: epms
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # Dev's local Redis container has no requirepass; blank keeps that
      # unauthenticated behavior. Override in your shell env to test password
      # handling locally.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      DEBUG: "true"
      ENVIRONMENT: development
      APP_NAME: EPMS API
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      APPROVAL_ENGINE_URL: http://approval-api:8003/approval/v1
      FILE_SERVER_URL: http://file-api:8005/files/v1
      BUDGET_API_URL: http://budget-api:8007
      FINANCE_API_URL: http://finance-api:8004
      IDENTITY_API_URL: http://identity-api:8009
      MDM_API_URL: http://mdm-api:8002
      MDM_API_TIMEOUT_SECONDS: "30"
      # NC65 read-only connection for the NC Purchase Sync page — same NC65_*
      # root-.env values finance-api uses. Missing = feature hidden.
      NC_HOST: ${NC65_HOST:-}
      NC_PORT: ${NC65_PORT:-1521}
      NC_SERVICE: ${NC65_SERVICE:-}
      NC_USER: ${NC65_USER:-}
      NC_PASSWORD: ${NC65_PASSWORD:-}
      # OFF in dev: with real NC65_* values in the root .env every developer
      # machine would otherwise pull NC purchase orders on the same schedule
      # as production. The Admin button still works.
      NC_SYNC_SCHEDULER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  approval-api:
    <<: *python-base
    build:
      context: ./approval-api
      dockerfile: Dockerfile
    container_name: uniops_approval_api
    ports:
      - "8003:8003"
    volumes:
      - ./approval-api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      POSTGRES_HOST: postgres
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      SERVICE_NAME: approval-engine
      PORT: "8003"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mdm-api:
    <<: *python-base
    build:
      context: .
      dockerfile: mdm-api/Dockerfile
    container_name: uniops_mdm_api
    ports:
      - "8002:8002"
    volumes:
      - ./mdm-api:/app
      - ./packages/authz:/packages/authz
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      POSTGRES_HOST: postgres
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SERVICE_NAME: mdm-stub
      PORT: "8002"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
      ERP_BASE_URL: http://10.10.95.66
      ERP_TIMEOUT_SECONDS: "60"
      # NC65 read-only connection for the BOM raw mirror sync (values live in the
      # gitignored root .env as NC65_*; missing values = feature hidden).
      NC_HOST: ${NC65_HOST:-}
      NC_PORT: ${NC65_PORT:-1521}
      NC_SERVICE: ${NC65_SERVICE:-}
      NC_USER: ${NC65_USER:-}
      NC_PASSWORD: ${NC65_PASSWORD:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  identity-api:
    <<: *python-base
    build:
      context: ./identity-api
      dockerfile: Dockerfile
    container_name: uniops_identity_api
    ports:
      - "8009:8009"
    volumes:
      - ./identity-api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Dev's local Redis container has no requirepass; blank keeps that
      # unauthenticated behavior.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SERVICE_NAME: identity-api
      PORT: "8009"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8009 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8009/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  finance-api:
    <<: *python-base
    build:
      context: .
      dockerfile: finance-api/Dockerfile
    container_name: uniops_finance_api
    ports:
      - "8004:8004"
    volumes:
      - ./finance-api:/app
      - ./packages/authz:/packages/authz
      # QBO credentials (gitignored, outside the repo). Mounted read-WRITE so the
      # containerized finance-api can read them AND persist the rotated refresh
      # token back (QBO rotates it every ~24-26h). QBO_CONN_ENV below points the
      # client at this in-container path.
      - ${QBO_CONN_ENV_HOST:-/dev/null}:/run/qbo_conn.env
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      POSTGRES_HOST: postgres
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SERVICE_NAME: finance-core
      PORT: "8004"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
      EPMS_API_URL: http://epms-api:8000/api/v1
      BUDGET_API_URL: http://budget-api:8007
      # Where the client reads QBO creds inside the container (see the volume above).
      QBO_CONN_ENV: /run/qbo_conn.env
      # NC65 read-only connection for the NC Sync button (values live in the
      # gitignored root .env as NC65_*; missing values = feature hidden).
      NC_HOST: ${NC65_HOST:-}
      NC_PORT: ${NC65_PORT:-1521}
      NC_SERVICE: ${NC65_SERVICE:-}
      NC_USER: ${NC65_USER:-}
      NC_PASSWORD: ${NC65_PASSWORD:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8004/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  file-api:
    <<: *python-base
    build:
      context: ./file-api
      dockerfile: Dockerfile
    container_name: uniops_file_api
    ports:
      - "8005:8005"
    volumes:
      - ./file-api:/app
      - ./file-storage:/file-storage
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      POSTGRES_HOST: postgres
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      SERVICE_NAME: file-server
      PORT: "8005"
      STORAGE_ROOT: /file-storage
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload
    healthcheck:
      # Router is mounted under /files/v1 (app/main.py) — health lives there, not at /health.
      test: ["CMD", "curl", "-f", "http://localhost:8005/files/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  expense-api:
    <<: *python-base
    build:
      context: ./expense-api
      dockerfile: Dockerfile
    container_name: uniops_expense_api
    ports:
      - "8006:8006"
    volumes:
      - ./expense-api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # NOTE: expense-api has no REDIS_* Settings fields and no redis client
      # anywhere in the service — inert until/unless expense-api adds Redis
      # usage. Kept for parity with the other two services.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      SERVICE_NAME: expense-api
      PORT: "8006"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
      DEBUG: "true"
      APPROVAL_ENGINE_URL: http://approval-api:8003/approval/v1
      FILE_SERVER_URL: http://file-api:8005/files/v1
      EPMS_API_URL: http://epms-api:8000/api/v1
      BUDGET_API_URL: http://budget-api:8007
      FINANCE_API_URL: http://finance-api:8004
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8006 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  budget-api:
    <<: *python-base
    build:
      context: .
      dockerfile: budget-api/Dockerfile
    container_name: uniops_budget_api
    ports:
      - "8007:8007"
    volumes:
      - ./budget-api:/app
      - ./packages/authz:/packages/authz
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      POSTGRES_HOST: postgres
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      APP_NAME: Budget API
      APP_VERSION: 0.1.0
      DEBUG: "true"
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
      APPROVAL_API_URL: http://approval-api:8003/approval/v1
      EPMS_API_URL: http://epms-api:8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8007 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8007/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mrp-api:
    <<: *python-base
    build:
      context: .
      dockerfile: mrp-api/Dockerfile
    container_name: uniops_mrp_api
    ports:
      - "8011:8011"
    volumes:
      - ./mrp-api:/app
      - ./packages/authz:/packages/authz
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      POSTGRES_HOST: postgres
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      APP_NAME: UniOps MRP API
      APP_VERSION: 0.1.0
      DEBUG: "true"
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
      APPROVAL_API_URL: http://approval-api:8003/approval/v1
      EPMS_API_URL: http://epms-api:8000
      # Server-to-server mdm-api URL (container DNS name), NOT the
      # localhost:8002 the frontends' VITE_MDM_API_URL points browsers at
      # (see the mrp/portal/epms/oa service blocks below) — that host is
      # unreachable from inside this container. Without this, forecast_io
      # falls back to app/core/config.py's http://localhost:8002 default,
      # which is nothing inside the mrp-api container, and every Excel
      # import 503s with a misleading "could not reach mdm-api" error even
      # though mdm-api itself is healthy.
      MDM_API_URL: http://mdm-api:8002
      # Server-to-server identity-api URL (mrp06 follow-up — resolves the
      # caller's display name at write time for the forecast change log; see
      # app/services/identity_client.py). Same container-DNS reasoning as
      # MDM_API_URL above: without this it falls back to
      # app/core/config.py's localhost:8009 default, unreachable from inside
      # this container, and the name lookup silently degrades to null on
      # every save (never breaks the save itself, just never shows a name).
      IDENTITY_API_URL: http://identity-api:8009
      # WMS(Flux) Oracle read-only connection (values live in the gitignored
      # root .env as WMS_*; missing values = feature hidden). See wms_conn.env.
      WMS_HOST: ${WMS_HOST:-}
      WMS_PORT: ${WMS_PORT:-1521}
      WMS_SERVICE: ${WMS_SERVICE:-}
      WMS_USER: ${WMS_USER:-}
      WMS_PASSWORD: ${WMS_PASSWORD:-}
      # The WMS sync scheduler is OFF in dev: with real WMS_* values in the
      # root .env, every dev container would otherwise pull the whole live
      # warehouse every few minutes alongside production. Flip to "true"
      # (or press Sync now in Portal Admin) when working on the sync itself.
      WMS_SYNC_SCHEDULER_ENABLED: "false"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8011 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8011/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  vms-api:
    <<: *python-base
    build:
      context: ./vms-api
      dockerfile: Dockerfile
    container_name: uniops_vms_api
    ports:
      - "8008:8008"     # 8007 is taken by budget-api — VMS uses 8008
    volumes:
      - ./vms-api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      POSTGRES_HOST: postgres
      # config.py builds DATABASE_URL from POSTGRES_* (the DATABASE_URL env var is
      # ignored — it's a computed @property). Without this the password defaults to
      # `epms_dev` and the prod DB rejects it with InvalidPasswordError. Matches
      # budget/finance/mdm which set the same.
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      APP_NAME: VMS API
      APP_VERSION: 0.1.0
      DEBUG: "true"
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
      EPMS_API_URL: http://epms-api:8000/api/v1
      APPROVAL_ENGINE_URL: http://approval-api:8003/approval/v1
      FILE_SERVER_URL: http://file-api:8005/files/v1
    depends_on:
      postgres:
        condition: service_healthy
      epms-api:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8008 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8008/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  booking-api:
    <<: *python-base
    build:
      context: .
      dockerfile: booking-api/Dockerfile
    container_name: uniops_booking_api
    ports:
      - "8010:8010"
    volumes:
      - ./booking-api:/app
      - ./packages/authz:/packages/authz
    environment:
      DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@postgres:5432/epms
      POSTGRES_HOST: postgres
      # config.py builds DATABASE_URL from POSTGRES_* (the DATABASE_URL env var is
      # ignored — it's a computed @property). Without this the password defaults to
      # `epms_dev` and the prod DB rejects it with InvalidPasswordError.
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      APP_NAME: Booking API
      APP_VERSION: 0.1.0
      DEBUG: "true"
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:5176","http://localhost:5177","http://localhost:5178","http://localhost:5179"]'
      EPMS_API_URL: http://epms-api:8000/api/v1
      FILE_SERVER_URL: http://file-api:8005/files/v1
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
      epms-api:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Frontend Applications ─────────────────────────────────────────────────────

  epms-frontend:
    image: node:20-alpine
    container_name: uniops_epms_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./epms:/app
      - epms_node_modules:/app/node_modules
      # Shared workspace package (see vms-frontend) — mount so the container can
      # resolve @uniops/shell; --install-links copies it into /app/node_modules.
      - ./packages/shell:/packages/shell
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_FILE_SERVER_URL: http://localhost:8005
      VITE_OA_URL: http://localhost:5175
      VITE_PORTAL_URL: http://localhost:5174
      VITE_BUDGET_API_URL: http://localhost:8007
      VITE_MDM_API_URL: http://localhost:8002
      VITE_FINANCE_API_URL: http://localhost:8004
      # expense-api (OA). epms calls it cross-service for invoice attachments and
      # for OCR (lib/api.ts EXPENSE_BASE, incl. the pickup-slip OCR endpoint).
      # Was missing here and only worked by accident, via EXPENSE_BASE's own
      # localhost:8006 fallback — declared explicitly now, matching
      # docker-compose.prod.yml's epms-web (VITE_EXPENSE_API_URL: ${OA_API_URL}).
      VITE_EXPENSE_API_URL: http://localhost:8006
    command: sh -c "npm install --install-links && npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

