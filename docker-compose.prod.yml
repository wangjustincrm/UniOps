# UniOps — production compose for the APPLICATION SERVER.
#
# One application server runs ALL frontends + ALL backends below. External:
#   • DB server   (${DB_HOST})    — PostgreSQL + Redis
#   • File server                 — file-api (NOT in this compose)
# Backends reach each other by service name on this compose's network; they reach
# Postgres/Redis/file-api over the internal network via the .env values.
#
# Build host (registry access):
#   cp .env.prod.example .env && export TAG=$(git rev-parse --short HEAD)
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml push
# Application server (same .env + TAG):
#   docker compose -f docker-compose.prod.yml pull
#   ./migrate-prod.sh                         # ordered alembic — finance-api FIRST
#   docker compose -f docker-compose.prod.yml up -d
#
# Rollback = set TAG to a previous git SHA, pull, up -d. (Re-run migrate only if
# the new release added migrations.)

# Shared DB / auth env. NOTE: Compose does NOT deep-merge an anchor's
# `environment:` with a service's own — so each service merges this map with the
# YAML `<<` key *inside* its `environment:` block, then adds its extras.
x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://epms:${DB_PASSWORD}@${DB_HOST}:5432/epms
  POSTGRES_HOST: ${DB_HOST}
  POSTGRES_PORT: "5432"
  POSTGRES_USER: epms
  POSTGRES_PASSWORD: ${DB_PASSWORD}   # required: budget/finance/mdm/vms-api compute DATABASE_URL from POSTGRES_* and ignore the env DATABASE_URL
  POSTGRES_DB: epms
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ALGORITHM: HS256

x-api-common: &api-common
  restart: unless-stopped

services:
  # ── Backend APIs (file-api lives on the File server, not here) ────────────────

  epms-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-epms-api:${TAG:-latest}
    build: { context: ., dockerfile: epms-api/Dockerfile }
    environment:
      <<: *db-env
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # Optional. Empty (default) = unauthenticated, matching Redis's current
      # requirepass-less state. Only set once `requirepass` is configured on
      # the Redis instance (see identity-api/app/core/config.py REDIS_URL).
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DEBUG: "false"
      ENVIRONMENT: production
      APP_NAME: EPMS API
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Public module frontend URLs — the system-wide task notifier builds email
      # deep-links per module from these (EPMS/OA/Finance/VMS/Booking/Portal).
      EPMS_URL: ${EPMS_URL}
      OA_URL: ${OA_URL}
      VMS_URL: ${VMS_URL}
      SAFETY_URL: ${EHS_URL}
      FINANCE_URL: ${FINANCE_URL}
      BOOKING_URL: ${BOOKING_URL}
      PORTAL_URL: ${PORTAL_URL}
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      APPROVAL_ENGINE_URL: http://approval-api:8003/approval/v1
      FILE_SERVER_URL: ${FILE_SERVER_INTERNAL_URL}
      BUDGET_API_URL: http://budget-api:8007
      FINANCE_API_URL: http://finance-api:8004
      IDENTITY_API_URL: http://identity-api:8009
      MDM_API_URL: http://mdm-api:8002
      MDM_API_TIMEOUT_SECONDS: "30"
      # NC65 read-only connection for the NC Purchase Sync page — reuses the same
      # NC65_* .env values finance-api already uses (connectivity is proven by
      # Finance's NC sync). Missing values = feature hidden. Cutover is set in the
      # UI (company_config), not here.
      NC_HOST: ${NC65_HOST:-}
      NC_PORT: ${NC65_PORT:-1521}
      NC_SERVICE: ${NC65_SERVICE:-}
      NC_USER: ${NC65_USER:-}
      NC_PASSWORD: ${NC65_PASSWORD:-}
      # Legacy PMS (SharePoint) import — enables the admin "PMS Data Import" page.
      # Secrets come from the (gitignored) .env on the app server; tenant/site
      # fall back to config.py defaults when unset.
      SP_USER: ${SP_USER}
      SP_PASSWORD: ${SP_PASSWORD}
      SP_TENANT: ${SP_TENANT:-canadaroyalmilk.ca}
      SP_SITE: ${SP_SITE:-https://canadaroyalmilk.sharepoint.com/sites/pr2}
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # PMS import staging + durable state (sync watermark, run history). Without
    # this a redeploy recreates the container and wipes both.
    volumes:
      - pms_import_data:/app/scripts/import_pms/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  approval-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-approval-api:${TAG:-latest}
    build: { context: ./approval-api }
    environment:
      <<: *db-env
      SERVICE_NAME: approval-engine
      PORT: "8003"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports: ["8003:8003"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mdm-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-mdm-api:${TAG:-latest}
    build: { context: ., dockerfile: mdm-api/Dockerfile }
    environment:
      <<: *db-env
      SERVICE_NAME: mdm-stub
      PORT: "8002"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ERP_BASE_URL: ${ERP_BASE_URL}
      ERP_TIMEOUT_SECONDS: "60"
      # NC65 read-only connection for the BOM raw mirror sync (values live in the
      # gitignored .env as NC65_*; missing values = feature hidden).
      NC_HOST: ${NC65_HOST:-}
      NC_PORT: ${NC65_PORT:-1521}
      NC_SERVICE: ${NC65_SERVICE:-}
      NC_USER: ${NC65_USER:-}
      NC_PASSWORD: ${NC65_PASSWORD:-}
    ports: ["8002:8002"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  identity-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-identity-api:${TAG:-latest}
    build: { context: ./identity-api }
    environment:
      <<: *db-env
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: "6379"
      # Optional. Empty (default) = unauthenticated, matching Redis's current
      # requirepass-less state. See app/core/config.py REDIS_URL.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SERVICE_NAME: identity-api
      PORT: "8009"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Approval Engine — identity re-syncs in-flight approvals here after a
      # PRIMARY role change (department-scoped approve tasks are pinned to a
      # specific person, so they would otherwise stay with the previous
      # holder). Missing/wrong value = silent "failed:" in the response.
      APPROVAL_ENGINE_URL: http://approval-api:8003/approval/v1
    ports: ["8009:8009"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8009
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8009/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  finance-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-finance-api:${TAG:-latest}
    build: { context: ., dockerfile: finance-api/Dockerfile }
    environment:
      <<: *db-env
      SERVICE_NAME: finance-core
      PORT: "8004"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      EPMS_API_URL: http://epms-api:8000/api/v1
      BUDGET_API_URL: http://budget-api:8007
      # NC65 read-only connection for the NC Sync button (values live in the
      # gitignored .env as NC65_*; missing values = feature hidden).
      NC_HOST: ${NC65_HOST:-}
      NC_PORT: ${NC65_PORT:-1521}
      NC_SERVICE: ${NC65_SERVICE:-}
      NC_USER: ${NC65_USER:-}
      NC_PASSWORD: ${NC65_PASSWORD:-}
      # Where the client reads QBO creds inside the container (see the volume below).
      QBO_CONN_ENV: /run/qbo_conn.env
    ports: ["8004:8004"]
    # QBO credentials for the QuickBooks Sync button. Place qbo_conn.env on the app
    # server and set QBO_CONN_ENV_HOST in the (gitignored) .env to its path;
    # mounted read-WRITE so the rotated refresh token (every ~24-26h) persists back.
    # Unset host var → /dev/null → feature reports "not configured" (graceful).
    volumes:
      - ${QBO_CONN_ENV_HOST:-/dev/null}:/run/qbo_conn.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8004/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  expense-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-expense-api:${TAG:-latest}
    build: { context: ./expense-api }
    environment:
      <<: *db-env
      REDIS_HOST: ${REDIS_HOST}
      # NOTE: expense-api's Settings (app/core/config.py) currently has no
      # REDIS_* fields at all and no redis client anywhere in the service —
      # this var (like the existing REDIS_HOST above) is inert until/unless
      # expense-api actually adds Redis usage. Kept for parity with the other
      # two services that do use Redis.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SERVICE_NAME: expense-api
      PORT: "8006"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DEBUG: "false"
      APPROVAL_ENGINE_URL: http://approval-api:8003/approval/v1
      FILE_SERVER_URL: ${FILE_SERVER_INTERNAL_URL}
      EPMS_API_URL: http://epms-api:8000/api/v1
      BUDGET_API_URL: http://budget-api:8007
      FINANCE_API_URL: http://finance-api:8004
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8006:8006"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8006
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8006/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  budget-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-budget-api:${TAG:-latest}
    build: { context: ., dockerfile: budget-api/Dockerfile }
    environment:
      <<: *db-env
      APP_NAME: Budget API
      APP_VERSION: 0.1.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DEBUG: "false"
      ENVIRONMENT: production
      API_V1_PREFIX: /api/v1
      APPROVAL_API_URL: http://approval-api:8003/approval/v1
      EPMS_API_URL: http://epms-api:8000
    ports: ["8007:8007"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8007
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8007/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ehs-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-ehs-api:${TAG:-latest}
    build: { context: ., dockerfile: ehs-api/Dockerfile }
    environment:
      <<: *db-env
      APP_NAME: UniOps Safety API
      APP_VERSION: 0.1.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DEBUG: "false"
      ENVIRONMENT: production
      API_V1_PREFIX: /api/v1
      # Server-to-server URLs use container DNS names, never the browser-facing
      # build vars — see docker-compose.dev.yml's mrp-api block for what goes
      # wrong when those are confused.
      EPMS_API_URL: http://epms-api:8000/api/v1
      MDM_API_URL: http://mdm-api:8002/mdm/v1
      APPROVAL_ENGINE_URL: http://approval-api:8003/approval/v1
      FILE_SERVER_URL: ${FILE_SERVER_URL}
      SAFETY_WEB_URL: ${EHS_URL}
      # The sweep that chases statutory deadlines and overdue corrective
      # actions. The interval lives in ehs_config and is re-read every tick;
      # setting it to 0 there disables the sweep without a redeploy.
      SCHEDULER_ENABLED: "true"
    ports: ["8012:8012"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8012
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8012/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mrp-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-mrp-api:${TAG:-latest}
    build: { context: ., dockerfile: mrp-api/Dockerfile }
    environment:
      <<: *db-env
      APP_NAME: UniOps MRP API
      APP_VERSION: 0.1.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DEBUG: "false"
      ENVIRONMENT: production
      API_V1_PREFIX: /api/v1
      APPROVAL_API_URL: http://approval-api:8003/approval/v1
      EPMS_API_URL: http://epms-api:8000
      # Server-to-server mdm-api URL (container DNS name) — see
      # docker-compose.dev.yml's mrp-api block for why this must NOT be the
      # browser-facing ${MDM_API_URL} build var.
      MDM_API_URL: http://mdm-api:8002
      # Server-to-server identity-api URL (mrp06 follow-up — see
      # docker-compose.dev.yml's mrp-api block for the same reasoning).
      IDENTITY_API_URL: http://identity-api:8009
      # WMS(Flux) Oracle read-only connection (values live in the gitignored
      # .env as WMS_*; missing values = feature hidden).
      WMS_HOST: ${WMS_HOST:-}
      WMS_PORT: ${WMS_PORT:-1521}
      WMS_SERVICE: ${WMS_SERVICE:-}
      WMS_USER: ${WMS_USER:-}
      WMS_PASSWORD: ${WMS_PASSWORD:-}
    ports: ["8011:8011"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8011
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8011/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  vms-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-vms-api:${TAG:-latest}
    build: { context: ./vms-api }
    environment:
      <<: *db-env
      APP_NAME: VMS API
      APP_VERSION: 0.1.0
      DEBUG: "false"
      ENVIRONMENT: production
      API_V1_PREFIX: /api/v1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      EPMS_API_URL: http://epms-api:8000/api/v1
      APPROVAL_ENGINE_URL: http://approval-api:8003/approval/v1
      FILE_SERVER_URL: ${FILE_SERVER_INTERNAL_URL}
    ports: ["8008:8008"]
    depends_on:
      epms-api:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8008
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8008/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  booking-api:
    <<: *api-common
    image: ${REGISTRY}/uniops-booking-api:${TAG:-latest}
    build: { context: ., dockerfile: booking-api/Dockerfile }
    environment:
      <<: *db-env
      APP_NAME: Booking API
      APP_VERSION: 0.1.0
      DEBUG: "false"
      ENVIRONMENT: production
      API_V1_PREFIX: /api/v1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      EPMS_API_URL: http://epms-api:8000/api/v1
      FILE_SERVER_URL: ${FILE_SERVER_INTERNAL_URL}
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_SECONDS: "300"
    ports: ["8010:8010"]
    depends_on:
      epms-api:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontends (multi-stage build → nginx static) ──────────────────────────────

  epms-web:
    <<: *api-common
    image: ${REGISTRY}/uniops-epms-web:${TAG:-latest}
    build:
      context: .
      dockerfile: epms/Dockerfile
      args:
        VITE_API_URL: ${EPMS_VITE_API_URL}
        VITE_FILE_SERVER_URL: ${FILE_SERVER_URL}
        VITE_OA_URL: ${OA_URL}
        VITE_PORTAL_URL: ${PORTAL_URL}
        VITE_BUDGET_API_URL: ${BUDGET_API_URL}
        VITE_MDM_API_URL: ${MDM_API_URL}
        VITE_EXPENSE_API_URL: ${OA_API_URL}
        VITE_FINANCE_API_URL: ${FINANCE_API_URL}
        VITE_FINANCE_URL: ${FINANCE_URL}
        # VMS 深链:Task Inbox 里的 vms_* 任务(访客签出 / PPE 备货 / 培训与
        # PPE 合规确认)锚在 VMS 单据上,EPMS 里没有对应页面,必须整页跳 VMS。
        VITE_VMS_URL: ${VMS_URL}
    ports: ["5173:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  portal-web:
    <<: *api-common
    image: ${REGISTRY}/uniops-portal-web:${TAG:-latest}
    build:
      context: .
      dockerfile: portal/Dockerfile
      args:
        VITE_EPMS_URL: ${EPMS_URL}
        VITE_OA_URL: ${OA_URL}
        VITE_VMS_URL: ${VMS_URL}
        VITE_FINANCE_URL: ${FINANCE_URL}
        VITE_BOOKING_URL: ${BOOKING_URL}
        VITE_MRP_URL: ${MRP_URL}
        VITE_EHS_URL: ${EHS_URL}
        VITE_EPMS_API_URL: ${EPMS_API_URL}
        VITE_OA_API_URL: ${OA_API_URL}
        VITE_VMS_API_URL: ${VMS_API_URL}
        VITE_BUDGET_API_URL: ${BUDGET_API_URL}
        VITE_MDM_API_URL: ${MDM_API_URL}
        VITE_FINANCE_API_URL: ${FINANCE_API_URL}
        # Admin -> WMS Sync talks to mrp-api directly (status, interval, manual
        # run). ${MRP_API_URL} already exists in .env.prod.example for mrp-web.
        VITE_MRP_API_URL: ${MRP_API_URL}
    ports: ["5174:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  oa-web:
    <<: *api-common
    image: ${REGISTRY}/uniops-oa-web:${TAG:-latest}
    build:
      context: .
      dockerfile: oa/Dockerfile
      args:
        VITE_API_URL: ${OA_API_URL}
        VITE_PORTAL_URL: ${PORTAL_URL}
        VITE_EPMS_URL: ${EPMS_URL}
        VITE_EPMS_API_URL: ${EPMS_API_URL}
        VITE_BUDGET_API_URL: ${BUDGET_API_URL}
        VITE_FINANCE_API_URL: ${FINANCE_API_URL}
        VITE_MDM_API_URL: ${MDM_API_URL}
    ports: ["5175:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vms-web:
    <<: *api-common
    image: ${REGISTRY}/uniops-vms-web:${TAG:-latest}
    build:
      context: .
      dockerfile: vms/Dockerfile
      args:
        VITE_API_URL: ${VMS_API_URL}
        VITE_EPMS_API_URL: ${EPMS_API_URL}
        VITE_PORTAL_URL: ${PORTAL_URL}
    ports: ["5176:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  booking-web:
    <<: *api-common
    image: ${REGISTRY}/uniops-booking-web:${TAG:-latest}
    build:
      context: .
      dockerfile: booking/Dockerfile
      args:
        VITE_API_URL: ${BOOKING_API_URL}
        VITE_EPMS_API_URL: ${EPMS_API_URL}
        VITE_PORTAL_URL: ${PORTAL_URL}
        VITE_FILE_API_URL: ${FILE_SERVER_URL}
    ports: ["5178:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  finance-web:
    <<: *api-common
    image: ${REGISTRY}/uniops-finance-web:${TAG:-latest}
    build:
      context: .
      dockerfile: finance/Dockerfile
      args:
        VITE_PORTAL_URL: ${PORTAL_URL}
        VITE_FINANCE_API_URL: ${FINANCE_API_URL}
        VITE_BUDGET_API_URL: ${BUDGET_API_URL}
        VITE_EPMS_API_URL: ${EPMS_API_URL}
        VITE_OA_API_URL: ${OA_API_URL}
        VITE_MDM_API_URL: ${MDM_API_URL}
        VITE_EPMS_URL: ${EPMS_URL}
        VITE_OA_URL: ${OA_URL}
        VITE_VMS_URL: ${VMS_URL}
        VITE_VMS_API_URL: ${VMS_API_URL}
    ports: ["5177:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ehs-web:
    <<: *api-common
    image: ${REGISTRY}/uniops-safety-web:${TAG:-latest}
    build:
      context: .
      dockerfile: ehs/Dockerfile
      args:
        VITE_API_URL: ${EHS_API_URL}
        VITE_PORTAL_URL: ${PORTAL_URL}
        VITE_EPMS_API_URL: ${EPMS_API_URL}
        VITE_MDM_API_URL: ${MDM_API_URL}
        VITE_FILE_API_URL: ${FILE_SERVER_URL}
    ports: ["5180:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mrp-web:
    <<: *api-common
    image: ${REGISTRY}/uniops-mrp-web:${TAG:-latest}
    build:
      context: .
      dockerfile: mrp/Dockerfile
      args:
        VITE_API_URL: ${MRP_API_URL}
        VITE_PORTAL_URL: ${PORTAL_URL}
        VITE_EPMS_API_URL: ${EPMS_API_URL}
        VITE_MDM_API_URL: ${MDM_API_URL}
    ports: ["5179:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Edge reverse proxy — DOMAIN mode only (opt-in via `--profile edge`) ───────
  # Terminates TLS with ./certs/{fullchain,privkey}.pem and routes
  # <module>.canadaroyalmilk.com / <api>-api.canadaroyalmilk.com to the containers
  # (see Caddyfile). Used with the DOMAIN image set (TAG=<sha>, https URLs baked).
  # For the LAN image set (TAG=<sha>-lan, http://10.10.50.65:<port> baked), DON'T
  # start this — browsers hit the published ports directly. The profile keeps it
  # out of a plain `up -d`; run `--profile edge up -d` only for domain mode.
  edge:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - ./legal:/srv/legal:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  pms_import_data:
