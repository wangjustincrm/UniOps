# Purchase Agreements — three kinds, and each one exists because a different
# shape of spend does not fit a PR-per-purchase.
#
# Derived: AgreementCreate's required fields. Agreements have no doc_preflight
# submit gates; their rules are enforced by a model_validator on
# AgreementCreate (422) and by crud.agreement.update (409), which is why a
# recurring agreement with no cycle is rejected at create rather than at submit.
topic: agreement_types
label: Purchase Agreement types
doc_type: agreement
field: agreement_type

what_it_is: >
  A standing arrangement with a vendor, so that recurring or open-ended spend
  does not need a fresh purchase requisition every time. Invoices are claimed
  against the agreement instead.

question_hints:
  - what types of purchase agreement are there
  - what is a house account
  - what is the difference between recurring and milestone
  - how do I set up a standing arrangement with a vendor

values:
  - value: house_account
    label: House Account
    covers: >
      An open account with a vendor that individual purchases are charged
      against as they happen.
    when: >
      When you buy from the same vendor repeatedly in small, unplanned amounts
      and raising a PR each time would be pure overhead.
    notes:
      - >-
        No PR or PO is raised. Each purchase is recorded as an agreement
        receipt, and the vendor's invoices are matched straight to the
        agreement, with no purchase order in between.
      - >-
        Each purchase is backed by an agreement receipt (a delivery note or
        slip) recorded on the agreement. When the vendor's invoice is matched to
        the agreement, the receipts it covers are attached to it on the
        invoice's 3-Way Match tab — or, if there are none, it is settled
        without receipt evidence with a reason. A payment application cannot be
        raised until one of the two is done.
      - >-
        Matching an invoice to a house account with nothing attached gives the
        agreement's owner an "Attach Invoice Receipts" task (no owner: a
        manager of the agreement's department; neither: the AP pool). AP, the
        invoice's uploader and the agreement's owner can all attach receipts.

  - value: recurring
    label: Recurring
    covers: A fixed, repeating charge — rent, a service contract, a subscription.
    when: >
      When the same amount falls due on a cycle. The cycle generates the
      expected invoice schedule, and arriving invoices are claimed against it.
    notes:
      - You must pick a cycle — weekly, monthly, quarterly, yearly, or special
        monthly — and the day the invoice is expected. An agreement created
        without both is rejected outright, because a recurring agreement with
        no schedule produces no periods and nothing can ever be claimed
        against it.
      - >-
        Special monthly is for charges that fall in only some months of the
        year — you tick the months that actually bill.
      - For a weekly cycle the expected day is a weekday, 1 to 7, Monday first.
      - >-
        An arriving invoice is claimed against the period whose expected date
        is nearest the invoice date. One period can hold several invoices — a
        vendor billing two fees in the same month puts both in that month,
        rather than pushing the second into a later period. When the agreement
        has an expected amount and a tolerance, the check is on the period's
        running total, so an extra bill on a fixed monthly fee goes to review.
      - >-
        Service confirmation covers the whole period. If another invoice joins
        a period after it was confirmed, the confirmation is cleared and has to
        be given again.
      - >-
        An invoice in the wrong period can be moved from the invoice page
        (Change period) until a payment application is raised on it — by AP
        or by the agreement's owner.

  - value: milestone
    label: Milestone
    covers: A staged arrangement where payment follows defined deliverables.
    when: >
      When the work has phases and each phase bills on completion rather than
      on a calendar.
    notes:
      - Milestones can only be attached to this type; supplying them on any
        other kind is rejected.

# ── Rules people ask about ───────────────────────────────────────────────────
rules:
  - id: agreement_numbering
    asked_as:
      - how are agreement numbers generated
    answer: >
      AGR-YYYYMM-NNNN: the year and month it was created (UTC), then a 4-digit
      sequence that restarts each month.
    enforced_in: "epms-api app/crud/agreement.py _next_number"
  - id: active_is_not_in_force
    asked_as:
      - which agreements are still valid
      - has this agreement expired
    answer: >
      Status Active means the agreement was approved; it does not mean it is
      still in force. Nothing moves an agreement to Expired when its Valid To
      date passes, so whether it is in force is read from Valid From / Valid To
      (plus its grace days for invoices — see grace_window).
    enforced_in: "epms-api app/crud/agreement.py (no write of expired/closed anywhere)"
  - id: grace_window
    asked_as:
      - can an invoice still be matched to an expired agreement
      - can I raise a PA on an agreement after Valid To
      - 过期的协议还能匹配发票吗
    answer: >
      Yes, for a while. New invoices can be matched, and payment applications
      raised, until Valid To plus the agreement's Grace Days (30 unless set
      otherwise on the agreement), because a period's invoice always arrives
      after the period ends. After that, both are refused. Valid From is not
      checked, so invoices dated before it can still be matched to a back-dated
      agreement. Drafts and agreements still in approval admit nothing.
    enforced_in: "epms-api app/crud/agreement.py _admissible_predicate / is_admissible (used by invoice matching and app/api/v1/pa.py); models/agreement.py grace_days server_default 30"
  - id: nte_is_warning_only
    asked_as:
      - can we still pay once the Not to Exceed is reached
      - what happens when an agreement goes over its NTE
      - 超过协议金额上限还能付款吗
    answer: >
      Yes. Not to Exceed is a warning only: going over it never blocks
      matching, approval or payment, and adds no approval step. Agreement Detail
      shows how much has been consumed (the tax-inclusive total of the invoices
      matched to it) against the ceiling, and warns when it is exceeded. An
      agreement with no NTE has no ceiling at all.
    enforced_in: "epms-api app/crud/agreement.py (\"NTE ceiling being warn-only by explicit user decision\"); app/api/v1/pa.py agreement route has no NTE check; epms AgreementCreatePage.tsx \"Not to Exceed is a warning only\""
  - id: who_attaches_house_account_receipts
    asked_as:
      - who can attach receipts to an agreement invoice
      - why can the agreement owner not see the receipts on the invoice
      - 谁可以给协议发票挂收货凭证
    answer: >
      AP, the person who uploaded the invoice, whoever holds the invoice's
      Match Invoice or Attach Invoice Receipts task, and the agreement's owner.
      When an invoice is matched to a house account agreement without any
      receipt attached, an "Attach Invoice Receipts" task goes to the
      agreement's owner (no owner: a manager of the agreement's department;
      neither: the AP pool). It closes on its own once receipts are attached or
      the invoice is settled without receipt evidence, and it moves with the
      agreement if the owner changes.
    enforced_in: "epms-api app/api/v1/invoices.py _require_invoice_receipt_access; app/crud/attach_receipts_task.py; PRD EPMS AGR-032"
