# What each part of UniOps is for.
#
# The top level of the guide. Where the document-kind files answer "what are
# the types and what do I fill in", this answers the question underneath it:
# what is this module, what lives in it, and is it the one I want.
#
# ── Why this layer is prose and the layer below it is derived ────────────────
# Everything in the document-kind files that a running system can adjudicate is
# derived from the enforcing code (see doc_type_guide.py). That is not available
# here, and not because of laziness: what a module is FOR is not a fact any code
# states, and the modules that are not EPMS live in their own services, which
# epms-api cannot import. Scope, unlike a field rule, also drifts slowly — a
# module's purpose changes when the business changes, not when a validator does.
#
# `documents` is the exception and IS checked: every entry must name a kind the
# guide can actually go deeper on, and test_module_guide.py fails if one names a
# kind that does not exist or if a kind exists that no module claims. So the
# offer to "ask me more about X" is never an offer the assistant cannot keep.
#
# The module list itself mirrors Portal's navigation
# (portal/src/components/layout/navConfig.tsx), because that is the list of
# modules as a person sees them rather than as the services are split up.
topic: modules
label: UniOps modules

question_hints:
  - what modules are there
  - what can I do in UniOps
  - what is this system for
  - where do I go to do X
  - what is the difference between OA and Procurement

modules:
  - key: procurement
    label: Procurement (EPMS)
    covers: >
      Buying things from outside suppliers, end to end: the request, the
      approval, the order to the vendor, receiving what arrives, the vendor's
      invoice, and the payment.
    who: >
      Everyone who needs to buy something, plus the people who approve it,
      receive it, and pay it.
    typical:
      - Raise a purchase requisition and track its approval
      - Receive goods, or confirm a service was completed
      - Match a vendor invoice against the order and the receipt
      - Raise a payment application once it is all lined up
      - Record a vendor credit so it is deducted from the next payment to that vendor
    documents: [pr, po, gr, invoice, pa, agreement]
    notes:
      - >-
        A vendor credit (money the vendor owes back — a credit note, or an
        overpayment or duplicate payment they acknowledge) is not an invoice.
        It lives under Vendor Credits, waits in Pending Review until someone
        with the vendor-credit permission approves it, and is then deducted
        automatically, oldest first, from the next payment to that vendor in
        the same currency. A credit-note PDF is uploaded through Upload Invoice,
        which recognises the negative total and switches to Credit Note.
      - >-
        When the vendor will not issue a credit note — typically they email
        "use invoice #…REV -2,216.15 on your next payment" — use Vendor Credits
        → Record Manual Credit. Enter the reference number they quoted (it is
        what the remittance shows them), the amount, and in Basis who at the
        vendor confirmed it and when; attach their email, saved from Outlook as
        .msg or .eml, or printed to PDF. The basis and the attached email are
        both required: the email is the only document behind the credit, and a
        manual credit cannot be approved until it is attached.
      - >-
        A document an approver returns (requisition, order, payment
        application, agreement, and so on) goes back to whoever raised it to
        change and resubmit. Resubmitting does not start the approval over: it
        goes straight back to the approver who returned it, and the approvals
        given before that stand. The same holds for every kind of document in
        UniOps.

  - key: oa
    label: OA — Office Automation
    covers: >
      Spending your own money and claiming it back, and travel. Separate from
      Procurement because there is no vendor, no purchase order and no
      receiving: you paid, and the company reimburses you.
    who: Anyone claiming an expense or booking business travel, and their approvers.
    typical:
      - Claim an expense, with receipts
      - Claim mileage
      - Raise a travel request and claim against it
    notes:
      - >-
        The dividing line people get wrong — if the company is being invoiced
        by a vendor, that is Procurement. If you paid and want it back, that
        is OA.
      - >-
        A receipt scanned on a claim line (Scan) is kept as that line's receipt
        and attached to the claim automatically when it is saved — it does not
        need uploading again. General and travel expense claims need at least
        one attachment before they can be submitted — except a travel expense
        claim whose lines are all date-range lines, which may go without one.
        The comment typed when submitting appears in the claim's Approval
        Timeline.
      - >-
        Long trips need not be claimed one day at a time. On a Travel Expense
        line, switch Single day to Date range and give the From and To dates
        (inside the trip dates): Days claimed starts at the number of days in
        the range and can be lowered but not raised; enter the Daily rate,
        and the line amount is days × rate. For meals and incidentals the
        daily rate may not exceed the limit set in Expense Config. An invoice
        is optional on a date-range line, but if one is attached its amount
        must be entered and the line total may not exceed it — one hotel
        invoice can cover the whole stay. The trip's Country decides tax: in
        Canada each line has a Tax picker (GST, the province's HST, PST, QST
        or No tax; it starts on Ontario HST), anywhere else adds no tax.
        Travel expense claims are in CAD only — convert foreign-currency
        receipts to CAD yourself before entering them.
      - >-
        A claim an approver returns can be changed and sent back by the person
        who raised it: open the claim, Edit, Save Changes, then Submit. It goes
        straight back to the approver who returned it — the approvals given
        before that stand and are not asked for again.
      - >-
        A submitted claim that is stuck with an approver can be chased from the
        claim itself: Approval Status → Send reminder under the pending step
        emails whoever holds that step (their delegate if they are away) and
        says who it reached. It is refused, with the reason shown, when nobody
        can be reached or a reminder for that step went out recently.
      - >-
        When the last approver approves a claim (general expense, mileage,
        travel expense or a custom form), a PDF of the claim is added to its
        Attachments as <claim number>.pdf. It carries the approval record —
        who submitted and who approved each step, when, and their comments.
        Once a claim is approved or paid, Regenerate PDF on the Attachments
        card rebuilds it (for claims approved before this existed, or if the
        first attempt failed) and replaces the old file rather than adding a
        second. A Travel Application has its own form, regenerated from the
        Travel Application card.

  - key: vms
    label: VMS — Visitor Management
    covers: Visitors coming on site, and the approvals and health checks around it.
    who: Whoever is hosting a visitor, plus the approvers for the areas being visited.
    typical:
      - Register a visitor and the areas they need access to
      - Get the visit approved before they arrive
      - Print a badge on the day
    notes:
      - >-
        The access area decides the route: Office / Lobby is confirmed at
        once; Warehouse and non-GMP production need the Department Manager;
        GMP, Laboratory and Entire Plant also need the Quality Manager, and
        every visitor needs a passing health declaration before the badge
        prints.
      - >-
        A visit an approver returns for edit comes back to its Host or the
        person who booked it: open the visit, use Edit visit, then Submit for
        approval. The Host can also cancel a visit someone else booked for
        them. A resubmitted visit goes straight back to the approver who
        returned it; earlier approvals stand.

  - key: finance
    label: Finance
    covers: >
      The accounting side: the ledger, accounts payable and receivable, bank
      and payment execution, and the exchange with NC and QuickBooks.
    who: Finance staff. Bank reconciliation is also open to whoever holds the Bank Reconciliation permission in Access Control — Payment Officers by default. AI Financial Analysis (unit costs and cost anomalies) needs its own AI Financial Analysis permission — Finance Manager and Finance Director by default — and is not visible with ordinary Finance access. Most people never open it.
    typical:
      - Execute approved payments and issue remittance advice
      - Reconcile accounts payable against what EPMS says is owed
      - Find an invoice keyed into NC more than once, before the extra copy is approved or paid
      - Post and review journal vouchers
      - Find a voucher across several months, or by the item, project or party it was booked against
      - See who prepared, checked and posted a voucher in NC, and whether it was cancelled
      - Reconcile a bank statement against the ledger and sign the period off (a USD or CNY account reconciles in its own currency, not in CAD)
      - Find why a material's or product's cost looks wrong in a month — a negative or swinging unit cost, value left on zero stock — and where that value went (AI Financial Analysis → Cost Anomalies)
      - Rebuild one material's cost month by month from NC's own ledger, with provisional receipts paired to their settlement and each issue adjustment traced to the product it landed on (AI Financial Analysis → Material Cost Trace)
      - See each product's gross margin month by month, invoice by invoice, and why a month went negative or swung — a document that put stock back at a wrong value, conversion cost spread by quantity, or a negative-cost input upstream (AI Financial Analysis → Gross Margin)
      - Walk a finished good's cost level by level down to purchased materials and find the deepest abnormal node, and see what a unit of it is made of all the way down — milk, ingredients, packaging, payroll, overhead, utilities, accounting adjustments (AI Financial Analysis → Cost Chain; the composition is an analytical figure that adds up to NC's own cost)
      - Cost each production batch on its own — a figure NC does not have, since NC costs a product per month — and see how far NC's booking for a batch is from what it actually cost, followed batch by batch upstream (AI Financial Analysis → Batch Cost)
      - Get a suggested standard cost for a product — usage from actual consumption against the BOM, settled prices, conversion per unit — and see what 2026 would have looked like under it (AI Financial Analysis → Standard Cost; a suggestion only, nothing is written to NC, and the conversion basis is Finance's decision)
    notes:
      - >-
        Approved expense claims waiting to be paid show on Finance → Payments
        as a banner per currency (how many, and the total), since that page
        otherwise lists only payments already made. The banner links to
        Payment Batches, whose due list can be narrowed to Expense Claim (or
        PA / Direct PA) with a count on each; clicking a claim number opens the
        claim. Travel Applications are not listed there and cannot be paid —
        they carry no money.
      - >-
        Bank reconciliation counts unposted vouchers (ones NC has not tallied
        yet) on the ledger side by default — "Include unposted vouchers" at the
        top of the period is ticked. The choice is saved on that period, so the
        difference, auto-match and the sign-off report all follow it, and the
        report says so. Unposted ledger lines are tagged "Unposted". Untick it
        to reconcile against posted vouchers only; that is refused while a
        cleared group still holds an unposted line (unmatch it first). A period
        signed off before this change stays on posted vouchers only. Vouchers NC
        has discarded or deleted are never counted.
      - >-
        A vendor's invoice number must be unique (vendor name + invoice
        number), and NC itself does not check it. Finance → AP Duplicate
        Invoices is that check: it runs after every hourly AP sync and gives AP
        a task when the same vendor and number appear on a second payable,
        whatever the amounts. The same number from a different vendor is not a
        duplicate, and a bill reversed by an equal credit is not counted as a
        copy.
      - >-
        AI Financial Analysis reads NC's inventory-accounting and product-cost
        data (2026 onwards) and only analyses it — it never changes NC and
        sends no notifications or tasks; people open it to look. Unit costs
        and product cost are NC's own figures. A month NC has not closed yet
        is marked "Not closed in NC" and its figures can still change. Usage
        means material consumption, not production picking: picking only moves
        stock from the warehouse to the line and is shown as a transfer.
        Milk components bought at a provisional price and settled later are
        the typical cause of a cost jump: if the stock was already consumed,
        NC pushes the settlement variance onto whatever consumes the material
        in the month of settlement. Material Cost Trace opens with a Summary that
        states the cause first — which month went wrong, what drove it (a
        settlement variance, a month-end tail adjustment, a negative-cost input,
        cost carried in, a small run), what the months would have cost without
        it, and, for a product that inherited the problem, the upstream
        material and month where it started — with the figures and NC document
        numbers as evidence underneath.

  - key: budget
    label: Budget
    covers: >
      What each department and cost centre is allowed to spend, and what is
      committed and spent against it so far.
    who: Budget owners, department managers, and Finance.
    typical:
      - Check what is left on an account before raising a request
      - See what a purchase requisition will do to the remaining balance
      - Ask how a figure on the Plan vs Actual grid was arrived at
    reports:
      - budget_plan_vs_actual
    notes:
      - >-
        You meet this without opening it — the budget widget on the Create PR
        form is this module, and an over-budget request is stopped or needs
        justification because of it.
      - >-
        The Plan vs Actual grid stacks two figures in every cell — plan and NC
        posted (optionally including vouchers NC has not tallied yet). Ask about
        either and the rule behind it can be read out, including which cost
        centre a posting is charged to and why.

  - key: mrp
    label: MRP — Material Requirements Planning
    covers: >
      Production planning: what to make, when, and what materials that needs.
      Forecast, master production schedule, bills of material and the resulting
      purchasing suggestions.
    who: Planning and production. Read access is separately permissioned.
    typical:
      - Look at the production plan currently in force
      - Ask why the plan says what it says for a given week
      - See what a product is made of
    notes:
      - Only the plan currently in force is readable. A superseded run is not,
        which is deliberate — summing across runs double-counts.

  # Sales (design docs/superpowers/specs/2026-10-23-order-bridge-design.md).
  # Every phase that changes what a user can do updates this entry in the same
  # change. Status names and rules are not copied here; if they are needed they
  # are derived from sales-api's status module.
  - key: sales
    label: Sales
    covers: >
      Customer orders from the online store and from retail partners, from the
      moment an order arrives through the warehouse shipment to the invoice,
      plus stock transfers between warehouses. It is replacing the order
      bridge that runs in Zoho today.
    who: >
      The sales operations team. Each part — orders, files, transfers,
      invoices, configuration — has its own permission; reading needs one too.
    typical:
      - Look up an order from the Shopify store or a retailer and see its lines in EA, its Ship to and Bill to (with where each came from: Shopify, the retailer's 850 with its GLN and DC, or entered by hand), where it came from and what happened to it
      - Work the orders that need review (Orders → view "Needs review") — held because an item, unit, case pack, partner, DC route or a ship-to postal code from another province needs a decision — and Re-check them after fixing the cause
      - Enter a manual order (sample, phone order, staff purchase) as a draft and submit it — Orders → New manual order (the customer is a partner whose channel is Manual; the Ship to address is required — name, phone, address, city, province, and a postal code in that province; a PO box needs a confirmation; each line's unit is chosen from that item's own units); the drafts are the Orders view "Manual drafts"
      - Maintain the partners, items with their units, retailer part numbers and DC routing, also by CSV
      - Set up the SFTP and Shopify connections, test them, and see the files received and each run's report
      - See an order's 940s to the warehouse — whether the file was sent, and separately whether the warehouse acknowledged it (997) — and use Send 940 now, or Replace 940 for a live one
      - See which orders the next cycle would send a 940 for (Orders → Next 940s)
      - Move stock between warehouses (Transfers): create a draft with its lines in EA, set it Ready to send, and follow the 943 and the warehouse's 944; resend a failed one or cancel it before it is sent
      - Keep the warehouses' names and addresses that the transfer file uses (Configuration → Warehouses)
      - Confirm what was delivered (Invoicing → Delivery confirmation, one by one or all shown at once) — nothing is invoiced before that
      - Check, correct and send an invoice (Invoicing → Invoices) — its prices beside the PO's (a changed price needs a reason), the delivery date and the retailer's delivery number — or release one that is on hold; record a retailer return or a cancellation after shipment on the order
      - See what the warehouse shipped for an order (its 945) — every pallet with its lots, expiry and quantities, the checks that flagged something, and whether the shipment was written to Shopify; retry a failed Shopify write
      - Choose the warehouse's SFTP connection and how long to wait for its 997 (Configuration → Connections, Warehouse EDI)
      - Set how often each connection is read — every N minutes, paused, or only in certain hours and days (Toronto time) — see its last and next run, and pause, resume or run one now (Configuration → Connections: the icons on its row, or the connection's Schedule)
      - Pause every scheduled job at once, set how often the system job runs, see each job's last and next run and which are overdue, and run the system job now (Operations → Health, Scheduler)
      - During the shadow run, compare each 940 Zoho sent with the 940 Sales would send for the same order (Operations → Shadow compare), and mark a known difference as expected with a reason
      - See at a glance how many orders are active, on hold, waiting for the warehouse or for invoicing, and what needs a person (Home) — each count opens its list
      - Check the module's health — settings, connections (and test one), the scheduler, failed files, ACKs, sends, old tasks, the send switches and the go-live gate (Operations → Health)
      - Choose who is told about each event and how — a Task Inbox task, an email or both, to users and outside addresses — and send a test (Configuration → Notifications); see every task and email sent (Operations → Notification history)
      - Open a Sales task from the Task Inbox (Portal or EPMS): it opens the order, transfer, file or connection it is about
    notes:
      - >-
        Sales is being built in phases. Orders are read from Shopify and from
        retailer 850s. Sales can build and send the warehouse 940, read the
        warehouse's 997 and 945 (shipment), fulfil and archive the order in
        Shopify, and invoice retailers, but writing to the warehouse's and
        TrueCommerce's servers, to Shopify, and sending email are switched off
        until the release that turns them on; until then the 940s, Shopify
        fulfillments and invoices still come from Zoho — so for a shipment or an
        invoice, look in Zoho.
      - >-
        An order is known by its Order ref: the partner's abbreviation, a
        hyphen and the source order number (LCL-4887314746, SHP-9471; a manual
        order uses its internal number). It is set when the order arrives and
        never changes, even if the abbreviation changes later. The internal
        number is still shown as Internal no. and used in the 940 and on the
        invoice number. Every partner needs an abbreviation; one without it
        gets a task, and its new orders wait in review. Partners are shown by
        name with the code beside it, and lists can be searched by either.
      - >-
        Each connection has its own schedule; its job reads the connection and
        takes what it stored straight through (orders, acknowledgements,
        shipments, receipts). A separate system job sends the 940s and 943s,
        times out acknowledgements and moves invoices on. Pausing the
        scheduler on the Health page stops every job; Run now still works.
        In dev and test stacks the scheduler does not run at all.
      - >-
        Who is told about a Sales problem follows Configuration → Notifications.
        With no rule for an event, its task goes to the operator and no email
        is sent. A problem that needs someone to act always has its task; the
        rule can add an email (to users and outside addresses, once per
        problem). Emails leave only where external email is switched on;
        elsewhere they are recorded as not sent. A channel can be switched to
        LIVE only once the go-live events (authentication failures, 940
        failure / rejection / timeout, cancellation after the 940, paid order
        archived) each have recipients and a test notification was sent.
      - >-
        While the shadow run is on (Configuration → Connections, Shadow run),
        Zoho is the live system: Sales reads the partners' folders but leaves
        every file where it is, the orders open when it was switched on and
        every order received since are marked as Zoho's and never get a 940
        from Sales (also after the shadow run ends), Sales makes and
        sends no 940, acknowledgements are stored but not applied, and only
        problems with reading files or connections raise tasks. Files Zoho sent
        are copied into a reference folder on the server; Operations → Shadow
        compare lists, per Zoho 940, Match, Differs, Expected difference, No
        Sales order (no order with that number or PO), Sales only (Sales would
        have sent a 940 that has no Zoho file) or Unreadable, and shows both
        files side by side. Control numbers, dates and times, and each
        system's own order number are not compared.
      - >-
        Transfers: a draft becomes a 943 to the warehouse when it is set Ready
        to send (the next run). The warehouse's acknowledgement moves it to
        Waiting for 944, a rejection to Failed with a task (it is never resent
        by itself; Resend or Cancel). The 944 says what arrived: every pallet is
        kept and the pallets of a line and lot are added up; the transfer is
        Received, Partially Received, or Discrepancy (something over-received or
        not on the transfer — a task lists the lines). A second, different 944
        changes nothing and puts the transfer On Hold with a task. A transfer
        can be cancelled before its 943 is sent, or after it was rejected.
        During the shadow run no 943 is sent; a 944 is kept and compared with
        Zoho's 943, never applied.
      - >-
        Invoicing: a shipped retailer order appears under Delivery confirmation
        once its requested delivery date is reached (Walmart: its
        do-not-deliver-after date); it stays there, without reminders, until
        someone confirms what was delivered — the confirmed date becomes the
        invoice date and the invoice states the delivered quantity, in cases at
        the price on the retailer's order. An invoice is sent only when someone
        presses Send (an 810 to TrueCommerce, or an email with the invoice, PO
        and packing-list PDFs to the retailer's invoice address with the
        internal copy). It goes on hold with a task when a quantity is not a
        whole number of cases, a shipped item matched no order line, or a
        return or cancellation after shipment was recorded; Release continues
        after the decision. A cancellation at source after the 940 puts the
        order On Hold with a task saying whether anything already shipped.
      - >-
        A 945 (the warehouse's shipment) closes the order's fulfilment: the order
        is Shipped and each line shows what shipped, every pallet and lot kept.
        Less than ordered raises a task (no second 940 is sent). A second,
        different 945 for the same order changes nothing and puts the order On
        Hold with a task; a 945 that matches no order is kept and raises a task.
        The warehouse may add one letter to the order number (1000123a) — it
        still matches. Checks such as more shipped than ordered, an item not on
        the 940, an expired or short-dated lot, a different ship-to or an odd
        ship date are listed on the shipment; an item not on the 940 also needs
        a decision. For a Shopify order the fulfillment is created in Shopify
        with the tracking number (the customer is told), or the tracking is
        added to the fulfillment Zoho made, and then the order is archived
        there; each is tried once — a failure raises a task with a Retry on the
        order. During the shadow run a 945 or 997 is never applied and nothing
        is written to Shopify: it is kept, matched to the Zoho 940 it answers,
        and Operations → Shadow compare shows what Sales would have recorded.
      - >-
        A 940 shows two statuses: the file (Ready To Send, Sent, Failed when the
        upload failed, Suppressed when sending is switched off, Cancelled when it
        did not pass its checks — the order then shows 940 Failed and the reason)
        and the warehouse's 997 (Waiting, Accepted, Rejected, Timeout when none
        came in time). Sent is not accepted. A rejected, failed or timed-out 940 is never
        resent by itself: each raises a task, and Send 940 now sends a new one.
        A live 940 is changed only by Replace 940 (after a confirmation); a change
        to the order after its 940 updates the order and raises a task instead.
      - >-
        Passwords and tokens are never entered in Sales: a connection only
        names the server setting that holds them.
      - >-
        A Shopify line's unit comes from its variant title: a title containing
        one of the item's unit names, or a Shopify title listed after that unit
        in the Item Master (e.g. 2PACK=2 [2-Can, 2-Pack]), is that unit; any
        other title ("Bib", "Can", "Default Title") is EA. A title that looks
        like a pack no unit matches ("Box of 12", "3 x Can") waits in Review,
        so a new pack size never ships as one each.
      - >-
        A Shopify line finds its item by SKU, then by the product's barcode in
        Shopify against the item's GTIN, then UPC (leading zeros and the
        12/13/14-digit forms do not matter). The item code is not used. A line
        that matches nothing, or whose barcode Shopify could not return, waits
        in Review — fix the item or the barcode, then Re-check.
      - >-
        New records are made the same way on every page: the New button at the
        end of the list's toolbar opens a form on the side (for example New
        manual order on Orders, New transfer on Transfers); after saving, the
        new record opens. Editing a draft opens the same form in the record's
        panel, and an action that needs a reason (cancel a transfer, release an
        invoice) asks for it in a small confirmation window. A field that looks
        up a record (an item, a customer, a warehouse) lists the first ones as
        soon as it opens; typing narrows the list (an item also by its
        description), and the chosen one shows with its description.
      - >-
        Every Sales list works the same way: the arrow on a column header
        searches, sorts or hides that column; "Search" opens a panel to filter
        on any field (several values of one field = any of them; several fields
        = all of them); the chips above the table show the active sorting and
        filters and remove them; the eye at the left shows or hides columns.
        "Group ascending / descending" on a column (status, partner, kind…)
        groups the rows under headers with the number of rows in each group;
        a header folds its rows away; up to three levels. The view menu left of
        the toolbar has the list's system views (e.g. Orders: All, Needs review,
        Payment hold, Pending, Archive suppressed, Historical) and your own: change
        the list, then Save as new; a dot means unsaved changes (Save, Save as new,
        Reset); ⋯ renames, deletes or makes a view your default. Columns can be
        dragged to a new place, or moved with the arrows in the eye menu.

  - key: booking
    label: Meeting Rooms
    covers: Booking meeting rooms.
    who: Anyone.
    typical:
      - Find a free room and book it
      - Cancel a booking you made

  - key: admin
    label: Admin
    covers: >
      How the system itself is configured: who the users are, what roles they
      hold, what each role may do, how approvals are routed, and who covers for
      whom while they are away.
    who: System administrators.
    typical:
      - Add a user, or change what a role is allowed to do
      - Change how a document type is routed for approval
      - Set up approval cover for someone on leave
      - Correct data through Data Maintenance
      - Choose which tasks send an email, and whether immediately or in a daily digest
    notes:
      - Permissions are configured here rather than written into the code, so
        what you can see and do is a setting, not a fixed property of your job
        title.
      - >-
        Whether a new task emails the person it is assigned to is also a
        setting, per kind of task (Admin → Notification Settings → Task
        Notifications): off, sent the moment the task is created, or listed in
        a once-a-day digest of that person's open tasks. It covers tasks from
        every module, applies to tasks created after it is changed, and someone
        who turned notifications off in their own profile is not emailed.
