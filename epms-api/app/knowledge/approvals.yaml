# How an approval is actually given — the part of every process the chain
# itself does not say. Served with every explain_process answer.
#
# Written because "能在 Teams 里或者回复邮件来审批吗？" was once answered "there is
# no data about how PAs are approved" (ISS-0009) while every other try said
# correctly that it cannot. Pinned by tests/test_assistant_iss_round2.py:
# app/services/teams.py builds cards whose only action is Action.OpenUrl, and
# nothing in the services reads replies to notification emails.
rules:
  - id: approve_only_in_the_system
    asked_as:
      - can I approve in Teams
      - can I approve by replying to the email
      - 能在 Teams 里或者回复邮件来审批吗
    answer: >
      No. Approving, returning and rejecting are done only in UniOps itself —
      from the task in the Task Inbox or on the document's page. Email and
      Teams messages only tell you that something is waiting: the Teams card's
      one button opens the document in EPMS, and replying to a notification
      email does nothing.
    enforced_in: "epms-api app/services/teams.py (Action.OpenUrl only); no mail-reply handler in any service"
