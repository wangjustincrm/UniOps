# Payment Applications — four kinds, and the distinction that matters is
# whether the vendor is being paid before delivery or after it.
#
# Derived: PaCreate's required fields. PA has no doc_preflight submit gates —
# its rules live in api/v1/pa.py, which rejects a settlement or balance PA with
# no prepayment_pa_id (422) and a second prepayment on the same PO (409).
topic: pa_types
label: Payment Application types
doc_type: pa
field: pa_type

what_it_is: >
  The request to actually pay a vendor. It gathers the purchase orders, the
  invoices and the receipts that justify the payment, goes through approval,
  and on approval becomes a remittance.

# ISS-0066: this used to say the type is "driven by the purchase order: a PO
# marked prepayment required needs a prepayment PA first", and the Assistant
# concluded a vendor cannot be prepaid because its old PRs had the flag off.
# create_pa never reads is_prepaid; the vendor's cap decides (rule
# prepayment_cap).
how_types_are_set: >
  Chosen by the person creating the PA. The form offers Prepayment and
  Settlement only for a single PO marked Prepaid; otherwise it offers Regular.
  Whether a prepayment is allowed at all is decided by the vendor's Max
  Prepayment % (or, when the vendor has none, the system cap in Prepayment
  Config) — never by the Prepaid flag on past PRs or POs.

question_hints:
  - what types of payment application are there
  - what is the difference between a prepayment and a settlement
  - how do I pay a vendor up front
  - what is a balance PA

values:
  - value: regular
    label: Regular
    covers: The ordinary case — goods or work received, invoice in hand, pay it.
    when: >
      The default. Use it whenever the vendor is paid after delivery against an
      invoice you have already matched.
    notes:
      - >-
        On a PO it needs receipt evidence (a goods receipt, or a received
        quantity on one of the PO's lines) unless a user with the "Override
        Receipt on PA" permission overrides that check and gives a reason. On an
        agreement there is no receipt check or override; the agreement's
        invoice checks apply instead (receipts attached or settled without
        evidence for a house account, the period's service confirmed for a
        recurring agreement).
      - >-
        A PA raised against purchase orders can pay several invoices from the
        same vendor, but only if they fall due within 7 days of each other;
        invoices due further apart need separate payment applications. A PA
        raised against an agreement has no such limit.
      - >-
        The PA's line items follow its invoices when those invoices were matched
        line by line: each matched invoice line becomes a PA line on the PO line
        it was matched to, and non-PO fees on the invoice (freight, for example)
        become lines of their own. You only pick PO lines yourself when an
        invoice was matched against the PO total alone.
      - >-
        Courier charges (UPS, FedEx, Purolator…) are not paid this way. Buyers
        register each tracking number on EPMS → Freight → Shipments with the
        cost center that bears it; the supply-chain person uploads the carrier's
        invoice on EPMS → Invoices → Upload Invoice like any invoice (the form
        recognises the carrier by the vendor), it is
        matched by tracking number on its invoice page, and a Freight PA is
        raised from EPMS → Payment Applications → New Freight PA (or Create PA
        on the matched invoice) — no PO, no agreement, split by cost center and
        charged to budget account CRM0150102. A Freight PA is a regular PA
        approved by OPM → GM → Finance Manager → Finance BP (configurable as
        "Freight PA" in Portal → Admin → Approval Workflows); only its title and
        notes can be edited, its amounts come from the invoices.

  - value: prepayment
    label: Prepayment
    covers: A deposit or full payment made before the vendor delivers.
    when: >
      When the purchase order is marked as requiring prepayment. This is the
      first of a pair — the money goes out now and is reconciled later.
    notes:
      - Only one prepayment PA can be open against a purchase order at a time.
        Settle or cancel the existing one before raising another.
      - Records what percentage of the order is being prepaid and when the
        settlement is expected.

  - value: settlement
    label: Settlement
    covers: The reconciliation of a prepayment once the real invoice arrives.
    when: >
      After a prepayment, when you know the actual amount. It must reference
      the prepayment PA it is settling — without that link it is rejected.
    notes:
      - If the invoice exactly matches what was prepaid, nothing is owed and it
        reconciles immediately — no approval, no payment, no bank movement.
      - If the prepayment was too large, a finance confirmation task gates the
        reconciliation rather than it going through silently.

  - value: balance
    label: Balance
    covers: The remaining amount owed after a part-prepayment.
    when: >
      When a deposit covered only part of the order and the rest falls due. Like
      a settlement it must reference the original prepayment PA.

# ── Rules people ask about ───────────────────────────────────────────────────
# "被拒绝的付款申请是什么状态？" searched status = rejected, found nothing and
# answered that there were no rejected PAs — nine existed (ISS-0008).

# The rules people ask about live in rules/pa.yaml (app/services/rule_registry.py).
