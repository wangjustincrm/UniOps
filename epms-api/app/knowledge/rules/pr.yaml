area: pr
label: Purchase requests
covers: >
  Raising, editing, recalling, withdrawing and copying a purchase request; its lines, department, decomposition factors, list filters, PDF; the budget check on a PR.
rules:
  - id: type_1_not_selectable
    asked_as:
      - what procurement types are there
      - 系统里有哪几种采购类型
      - why can't I pick type 1
    answer: >
      There are six procurement types. Type 1 (Raw Materials / Packaging) cannot
      be chosen when creating a PR in EPMS — its tile is disabled — because raw
      material and packaging purchasing runs in NC and those orders arrive in
      EPMS mirrored from it. The other five are chosen on the Create PR form.
    enforced_in: "epms/src/components/pr/procurementTypes.ts (pinned by procurementTypes.test.ts); said under every query answer grouped by procurement type: app/ontology/epms.yaml type.when_listed -> app/api/v1/assistant_chat.py _with_listing_notes (ISS-0008)"
    provenance: pinned
    test:
      - "epms/src/components/pr/procurementTypes.test.ts"
      - "tests/test_assistant_iss_batch6.py::test_a_list_of_procurement_types_always_says_type_1_is_not_selectable"
  - id: pr_numbering
    asked_as:
      - how are PR numbers generated
      - 请购单编号是怎么生成的
    answer: >
      PR-YYYYMMDD-NNNN: the date it was created, then a 4-digit sequence that
      restarts each day — PR-20261015-0003 is the third PR of 15 Oct 2026.
      The date is the plant's date at creation (Portal → Admin → Company Settings → Time Zone), so a document created late in the evening carries that evening's date.
    enforced_in: "epms-api app/crud/pr.py _next_number"
    provenance: pinned
    test:
      - "tests/test_assistant_iss_round2.py::test_numbers_have_the_formats_the_guide_states"
  # ── Over-budget (ISS-0025). `topic: over_budget` rules are also handed to
  # explain_process for a PR, so the answer is the same whichever route the
  # question takes (guide_view.process_steps).
  - id: budget_check_applies_to_types_2_to_6
    also_in: [budget]
    topic: over_budget
    asked_as:
      - do consumables need a budget check
      - 杂项耗材要做预算检查吗
      - which PRs are checked against the budget
    answer: >
      Every PR of types 2 to 6 must carry a cost center and a budget account
      before it can be submitted, and every such PR is checked against that
      account's budget. Type 1 (raw materials / packaging, mirrored from NC)
      carries no budget. The over-budget mode only decides what happens to a
      PR found over budget; it never switches the check off.
    enforced_in: "epms-api app/services/doc_preflight.py budget_account_required (type != 1); app/crud/pr.py compute_budget_check"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_budget_gate_applies_to_every_type_but_1"
  - id: over_budget_checked_on_save
    also_in: [budget]
    topic: over_budget
    asked_as:
      - is the budget checked again when I submit
      - my draft was saved before the budget changed — is it re-checked
      - 草稿保存后预算变了会重新检查吗
    answer: >
      Over budget is decided each time the PR is saved — when it is created and
      on every edit — from the account's Available balance at that moment.
      Submitting does not re-check it. Submitting from the edit page saves
      first, so it uses the current balance; submitting an old draft straight
      from its detail page uses the result from its last save. When an edit
      brings a PR back within budget, its justification is cleared.
    enforced_in: "epms-api app/crud/pr.py create / update (_compute_over_budget); no call on the submit path"
    provenance: pinned
    test:
      - "tests/test_assistant_iss_batch1.py::test_over_budget_is_decided_on_save_not_on_submit"
  - id: budget_not_reserved
    also_in: [budget]
    topic: over_budget
    asked_as:
      - do two PRs compete for the same budget
      - does a submitted PR reserve the budget
      - 两张请购单会抢同一笔预算吗
    answer: >
      No budget is reserved. Available is the balance the Budget service reports
      for the cost center and budget account; other PRs and POs still in
      progress are not deducted from it. Two PRs can each pass the check
      against the same balance. If the Budget service cannot be reached, the PR
      is treated as within budget.
    enforced_in: "epms-api app/crud/pr.py compute_budget_check (available from budget_client.get_balance; fail-open when None)"
    provenance: pinned
    test:
      - "tests/test_assistant_iss_batch1.py::test_budget_unreachable_is_treated_as_within_budget"
  # ISS-0025: "超预算模式改了以后，审批中的请购单会受影响吗？" was answered
  # "不会" twice. PRD OBG-010: in-flight PRs only ever get lighter.
  - id: over_budget_mode_change_in_flight
    also_in: [budget]
    topic: over_budget
    asked_as:
      - 超预算模式改了以后，审批中的请购单会受影响吗？
      - 改成 Allow 以后审批中的请购单还要走超预算审批步骤吗？
      - does changing the over-budget mode affect PRs already in approval
    answer: >
      Yes, but only ever to make it lighter. The mode is recorded on a PR when
      it is submitted. Changed later in Budget Config: a looser mode (to
      Allow, or Finance Manager + GM/OPM to Finance Manager only) skips the
      over-budget steps an in-flight PR has not yet passed — saving Budget
      Config re-aligns every such PR at once, the step is recorded as
      Auto-skipped and the PR moves on to its next approver; a stricter mode
      never adds steps to a PR already submitted; Hard block does not cancel
      over-budget steps already waiting (those PRs keep their approvals), it
      only refuses new submissions and resubmissions. PRs submitted after the
      change get the new mode in full.
    enforced_in: "approval-api app/crud/engine.py _ob_step_waived (looser mode waives pending ob steps; hard_block never), ob_mode_applied frozen at submit; epms-api app/api/v1/config.py _resync_over_budget (every Budget Config save) -> approval_client.resync_over_budget"
    provenance: pinned
    test:
      - "approval-api/tests/test_over_budget_mode_frozen.py::test_loosening_to_allow_moves_the_fm_task_on"
      - "approval-api/tests/test_over_budget_mode_frozen.py::test_tightening_never_adds_steps_to_a_submitted_pr"
      - "approval-api/tests/test_over_budget_mode_frozen.py::test_hard_block_does_not_waive_in_flight_steps"
      - "approval-api/tests/test_over_budget_mode_frozen.py::test_fm_gm_opm_to_fm_only_waives_the_pending_gm_step_on_approve"
  # ISS-0029 point 3 / ISS-0055 point 2: the Owner was left out of "what must
  # a project PR have", called optional, and "your department only".
  - id: service_project_owner
    also_in: [gr]
    asked_as:
      - Service/Project Owner 可以不填吗？可以选其他部门的人吗？
      - 项目类请购单提交前必须填哪些内容？
      - is the service owner required
    answer: >
      Service (type 4) and Project-Related (type 6) PRs carry a
      Service/Project Owner, the person who confirms the work was done. It is
      required on the PR form and can never be empty: it defaults to the
      requester, and when nobody else is chosen the requester is the owner.
      Any active user may be chosen, from any department — the picker
      searches everyone, and the server refuses only an unknown or inactive
      user. The owner gets the receipt confirmation tasks and reminders; the
      requester can still confirm too. Other types have no owner.
    enforced_in: "epms/src/pages/pr/PrCreatePage.tsx (Service/Project Owner, required *, defaults to you, userService.directory with no department filter); epms-api app/api/v1/pr.py _check_owner (active user only); app/crud/pr_owner.py (owner_id honoured for types 4/6, NULL = the requester); app/api/v1/gr.py create_gr (owner OR requester)"
    provenance: pinned
    test:
      - "tests/test_assistant_asst2_d.py::test_the_owner_is_any_active_user_and_never_empty"
      - "tests/test_gr_create_authz.py::test_pr_owner_can_create_service_gr_without_warehouse_permission"
      - "tests/test_gr_create_authz.py::test_naming_an_owner_does_not_strip_the_requester"

  # ── Added 2026-10-21 (issue review batch 3) ───────────────────────────────
  - id: who_can_edit_a_pr
    # Round 2 (ISS-0050): "已经提交的请购单想修改怎么办？" twice added "the
    # approver it is waiting on can edit it" — read off "the approver can
    # return it, after which it can be edited". Code answers it.
    said_when:
      - '(?:谁|哪些人|什么人|什么角色|\bwho\b).{0,15}(?:编辑|修改|改|\bedit|\bchange).{0,12}(?:请购单|请购|\bPRs?\b)'
      - '(?:已经?提交|提交了|提交后|提交以后|审批中|送审|\bsubmitted\b|in\s+review).{0,15}(?:请购单|请购|\bPRs?\b).{0,15}(?:修改|编辑|改|\bedit|\bchange)'
      - '(?:请购单|请购|\bPRs?\b).{0,12}(?:已经?提交|提交了|提交后|审批中|\bsubmitted\b|in\s+review).{0,15}(?:修改|编辑|改|\bedit|\bchange)'
      - '(?:\bedit|\bchange)\w*\s+(?:a\s+|my\s+|the\s+)?(?:submitted|in-review)\s+(?:PR|purchase\s+request)'
    says:
      en: >
        Only the requester who raised the PR, or a System Admin, can edit it,
        and only while it is draft or returned; approvers cannot edit it. A
        submitted or in-review PR cannot be edited as it stands: the requester
        can press Recall to Edit on the PR page, which takes it back to draft
        (when it is submitted again, approval starts from the first step); or
        the approver it is waiting on can return it to the requester, who then
        edits and resubmits it.
      zh: >
        只有提交这张请购单的申请人或系统管理员可以编辑，而且只能在草稿（Draft）或已退回
        （Returned）状态下编辑；审批人不能编辑。已提交或审批中的请购单不能直接修改：申请人可以在
        请购单页面点 Recall to Edit 撤回，单据回到草稿后再修改（重新提交时从第一步开始审批）；
        或者由当前审批人把它退回给申请人，申请人修改后重新提交。
    asked_as:
      - 谁可以编辑我的请购单？什么状态下可以编辑？
      - who can edit my PR and when
      - 已经提交的请购单想修改怎么办？
    answer: >
      Only the requester who raised a PR, or a System Admin, can edit it, and
      only while it is draft or returned. A submitted PR cannot be edited as
      it stands: while it is submitted or in review the requester can press
      Recall to Edit on the PR page, which takes it back to draft (a recalled
      PR starts again from the first step when it is resubmitted — unlike a
      returned one, which resumes at the step that returned it); or the
      approver it is waiting on can return it to the requester, who then
      edits and resubmits it. Approvers cannot edit a PR.
    enforced_in: "epms-api app/api/v1/pr.py update_pr (status draft/returned; created_by or system_admin); approval-api engine recall (RECALLABLE_STATUSES)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_only_the_requester_edits_a_draft_or_returned_pr"
      - "approval-api/tests/test_engine_recall.py::test_recall_by_submitter_succeeds"
  - id: withdraw_a_pr
    asked_as:
      - PR 的撤销（Withdraw）按钮在任何状态都能用吗？
      - in_review 状态的请购单能撤销吗？
      - can I withdraw a PR
    answer: >
      Withdraw cancels a PR for good. It works while the PR is draft,
      returned or submitted, for the requester, the approver it is waiting
      on, or a System Admin. Once the PR is in review (a step has already
      been approved) it cannot be withdrawn and the PR page no longer offers
      it; to stop it, use Recall to Edit, or ask the approver to return or
      reject it. Edit, Recall to
      Edit and Withdraw are shown only to the requester and a System Admin;
      when one of these actions is refused, the page shows the reason.
    enforced_in: "approval-api app/crud/engine.py _DOC_META['pr']['valid_cancel']; epms/src/pages/pr/PrDetailPage.tsx (Withdraw shown for draft/returned/submitted only, isRequesterOrAdmin, actionError)"
    provenance: pinned
    test:
      - "approval-api/tests/test_engine_rules.py::test_cancel_statuses_are_the_engines"
      - "tests/test_rule_registry.py::test_the_pr_page_offers_withdraw_where_the_engine_allows"
  - id: pr_line_prices
    asked_as:
      - 行项目的单价可以填 0 或负数吗？
      - can a unit price be zero or negative
    answer: >
      Yes. A line's unit price is required but may be zero or negative — for
      a discount, rebate or credit line. The quantity must be more than zero.
      A PR whose lines add up to exactly zero cannot be submitted from the
      form ("At least one line must have a price"); a negative total can.
    enforced_in: "epms-api app/schemas/pr.py PrLineItemIn (qty gt=0, unit_price unconstrained); epms/src/pages/pr/PrCreatePage.tsx / PrEditPage.tsx (estimatedAmount === 0)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_pr_line_prices_may_be_zero_or_negative"
  - id: changing_the_pr_department
    asked_as:
      - 请购单上改了部门会发生什么？
      - what happens if I change the department on a PR
    answer: >
      The department on a PR decides who approves it at the Department
      Manager, Director and GM/OPM steps — and the same for the purchase
      orders and payment applications raised from it. So changing it changes
      who will approve. On the PR form, changing the department also clears
      the cost centre, the budget account (L1 and L2) and the decomposition
      factors, because they belong to the old department; pick them again
      before saving.
    enforced_in: "approval-api app/crud/engine.py _routing_department_id; epms/src/pages/pr/PrCreatePage.tsx and PrEditPage.tsx department onChange"
    provenance: pinned
    test:
      - "approval-api/tests/test_engine_dept_manager_routing.py::test_pr_department_id_drives_dept_manager_routing"
      - "tests/test_rule_registry.py::test_changing_the_department_clears_the_budget_fields"
  - id: decomposition_factors
    asked_as:
      - 什么是分解因子？什么时候必须填？
      - what are decomposition factors
    answer: >
      Decomposition factors are extra breakdown codes that some budget
      accounts ask for. When the budget account chosen on a PR has
      decomposition switched on, the PR form shows one dropdown per factor
      the account has (at most 3), and every one must be filled before the
      PR can be submitted; a draft can be saved without them. Accounts
      without decomposition show none.
    enforced_in: "budget-api app/crud/factor.py MAX_FACTORS_PER_ACCOUNT, BudgetAccount.decomposition_enabled; epms/src/pages/pr/PrCreatePage.tsx (accountFactors missing → refuse submit)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_decomposition_factors_are_required_on_submit_only"
  - id: pr_list_filters
    asked_as:
      - 请购单列表能按哪些条件筛选？
      - what can I filter the PR list by
    answer: >
      The PR list has a search box (PR number, title, vendor, budget code)
      and filters for Status, Department, Requester, Type and Prepaid.
      Someone who is only a Requester sees only their own PRs: the
      Department and Requester filters are not shown and the list is titled
      My Purchase Requisitions.
    enforced_in: "epms/src/pages/pr/PrListPage.tsx"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_pr_list_filters"
  - id: copy_a_pr
    asked_as:
      - 怎么基于一张旧的请购单快速建一张新的？
      - how do I copy a PR
    answer: >
      Select the old PR on the PR list and click Copy. A new PR form opens
      filled in from it — title ("Copy of …"), type, department (if still
      active), lines, currency, notes, delivery address, cost centre and
      budget account, and the vendor if it is still active. Dates, decomposition factors, attachments and the
      Service/Project Owner are not copied.
    enforced_in: "epms/src/pages/pr/PrListPage.tsx (Copy → /pr/new?copyFrom=); PrCreatePage.tsx copyFrom prefill"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_a_pr_is_copied_from_the_list"
  - id: approved_pr_pdf
    asked_as:
      - 批准后的请购单 PDF 在哪里？
      - where is the approved PR PDF
    answer: >
      When a PR is fully approved its PDF is generated automatically and put
      on the PR's Attachments tab. On an approved PR that tab also has
      Regenerate PDF, which rebuilds it.
    enforced_in: "epms-api app/api/v1/pr.py _generate_pr_pdf_background on approved; app/api/v1/pr_attachments.py regenerate-pdf (_PDF_STATUSES)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_the_pr_pdf_is_made_on_approval"
  - id: negative_total_is_never_over_budget
    topic: over_budget
    also_in: [budget]
    asked_as:
      - 总额是负数的请购单会被判定为超预算吗？
      - is a PR with a negative total over budget
    answer: >
      No. A PR whose total is zero or negative is never over budget.
    enforced_in: "epms-api app/crud/pr.py compute_budget_check (amount <= 0 → not over)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_a_zero_or_negative_pr_is_never_over_budget"
  - id: budget_service_unreachable
    topic: over_budget
    also_in: [budget]
    asked_as:
      - 如果预算服务连不上会怎样？
      - what happens if the budget service is down
    answer: >
      The PR is not held up. If the Budget service cannot be reached, the
      over-budget check treats the PR as within budget, and the check that
      the budget account exists in the budget catalogue is skipped when a PR,
      PO or agreement is saved (a code the service does know to be wrong is
      still refused).
    enforced_in: "epms-api app/crud/pr.py compute_budget_check (get_balance None → within budget); app/services/budget_client.py ensure_known_budget_code (unreachable → accepted unchecked)"
    provenance: pinned
    test:
      - "tests/test_assistant_iss_batch1.py::test_budget_unreachable_is_treated_as_within_budget"
      - "tests/test_rule_registry.py::test_an_unreachable_budget_service_skips_the_catalogue_check"
  - id: refused_submit_keeps_one_draft
    also_in: [agreement]
    asked_as:
      - 新建请购单点提交被拒绝了，会生成草稿吗？
      - 提交失败后为什么多了一张草稿？
      - what happens if Submit for Approval is refused on a new PR or agreement
    answer: >
      On New PR and New Agreement, Submit for Approval first saves the
      document and then submits it. If the submission is refused — for
      example the department has no active Department Manager, or a
      milestone agreement has no stage — the document stays saved as a
      draft and you are taken to it with the reason shown: a PR opens on
      its edit page, an agreement on its page. Fix what the message says and
      submit that draft; clicking Submit again does not create another one.
      If the PR is refused while you are already editing a draft, the reason
      is shown next to the Submit button.
    enforced_in: "epms/src/pages/pr/PrCreatePage.tsx onSubmit and agreements/AgreementCreatePage.tsx handleSubmit (rememberSubmitFailure → replaceTab to the draft); pr/PrEditPage.tsx and agreements/AgreementDetailPage.tsx show it (epms/src/lib/submitFailure.ts)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_a_refused_submit_takes_the_user_to_the_saved_draft"
      - "epms/src/lib/submitFailure.test.ts"
  - id: who_sees_which_prs
    also_in: [gr]
    asked_as:
      - 为什么我能看到别人的请购单？
      - 付款员（Payment Officer）能看到所有请购单吗？
      - why can I see other people's PRs
    answer: >
      A Requester sees the PRs they raised and the goods receipts on them
      (plus any document they hold an open approval task on, or a PR they are
      the Service/Project Owner of). Department, GM/OPM, Director and
      Supervisor roles add their own departments or reports. A role outside
      that set (Procurement, AP, Finance, CFO, Auditor and so on) shows every
      PR or every goods receipt only if that role itself has View PR or View
      GR in Access Control. So a Requester who also holds Payment Officer,
      which has neither, still sees only their own PRs and goods receipts,
      while seeing every PO, invoice and payment application.
    enforced_in: "epms-api app/core/access_scope.py build_scope / _wide_view_keys (pr_subq, gr_po_subq), scoped_department_ids"
    provenance: pinned
    test:
      - "tests/test_scope_wide_role_view_keys.py::test_requester_plus_payment_officer_sees_only_own_prs_and_grs"
      - "tests/test_scope_wide_role_view_keys.py::test_requester_plus_role_holding_view_pr_still_sees_everything"
  - id: currencies_on_a_pr_or_po
    also_in: [po]
    asked_as:
      - 新建请购单 / PO 时为什么选不到某个币种？
      - which currencies can I choose on a PR or PO
    answer: >
      The Currency list on New / Edit PR, New / Edit PO and New Agreement
      offers exactly the currencies enabled in Portal → Admin → Currency
      Settings — any of them, not only CAD, USD, EUR and CNY. To use another
      currency, ask an administrator to enable it there. A PR or PO already
      saved in a currency that has since been disabled keeps it on its edit
      page.
    enforced_in: "epms/src/lib/currencies.ts enabledCurrencyOptions (company_config.enabled_currencies, names from custom_currencies); used by pages/pr/PrCreatePage.tsx, PrEditPage.tsx, pages/po/PoCreatePage.tsx, PoEditPage.tsx, pages/agreements/AgreementCreatePage.tsx"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_currency_lists_follow_currency_settings"
      - "epms/src/lib/currencies.test.ts"

# The conclusion a question must get, placed by code (app/services/rule_verdicts.py).
verdicts:
  # ISS-0025 retest (23/10, twice): "超预算模式改了以后，已经提交、正在审批中的
  # 请购单会受影响吗？" → "不会".
  - id: mode_change_reaches_in_flight_prs
    rule: over_budget_mode_change_in_flight
    asks:
      - [超预算模式, 超预算审批模式, 超预算的模式, 超预算的审批模式, 预算模式, over-budget mode,
         over budget mode, over-budget approval mode, budget config]
      - [改, 变, 换, 切换, 调整, 修改, change, changed, changing, switch, switched]
      - [审批中, 在审批, 正在审批, 已提交, 已经提交, 提交了, 进行中, 在途, in flight, in-flight,
         in approval, already submitted, submitted, pending, in review]
    unless: [还要走, 还需要走, 还要经过, 还用走, 还会走, still go through, still need the]
    says:
      en: >
        Yes, but only ever to make it lighter. A looser mode skips the
        over-budget steps an in-flight PR has not yet passed (they are recorded
        as Auto-skipped and the PR moves on to its next approver); a stricter
        mode never adds steps to a PR already submitted; Hard block does not
        cancel steps already waiting and only refuses new submissions and
        resubmissions.
      zh: >
        会，但只会变轻。改成更宽松的模式（例如改成 Allow，或从 Finance Manager + GM/OPM 改成
        Finance Manager only）后，审批中的请购单还没走到的超预算审批步骤会被自动跳过（记为
        Auto-skipped），单子转到下一个审批人；改成更严格的模式，不会给已经提交的请购单加步骤；
        改成 Hard block 也不会取消已经在等待的超预算步骤，只拒绝新的提交和重新提交。
    test:
      - "approval-api/tests/test_over_budget_mode_frozen.py::test_loosening_to_allow_moves_the_fm_task_on"
      - "approval-api/tests/test_over_budget_mode_frozen.py::test_tightening_never_adds_steps_to_a_submitted_pr"
      - "approval-api/tests/test_over_budget_mode_frozen.py::test_hard_block_does_not_waive_in_flight_steps"
  # ISS-0025 follow-up: "改成 Allow 以后…还要走超预算审批步骤吗？" first said
  # no, then that in-flight PRs keep the current chain.
  - id: allow_mode_skips_pending_over_budget_steps
    rule: over_budget_mode_change_in_flight
    asks:
      - [allow, 允许, 宽松, 放宽, looser, fm_only, finance manager only]
      - [改, 变, 换, 切换, 调整, 修改, change, changed, changing, switch, switched, set to]
      - [还要走, 还需要走, 还要经过, 还用走, 还会走, 还要, still go through, still need, still have to]
      - [超预算, over-budget, over budget, finance manager, 财务经理]
    says:
      en: >
        No. A PR in approval that has not yet passed an over-budget step the
        new mode no longer requires skips it: the step is recorded as
        Auto-skipped and the PR moves on to its next approver. Approvals
        already given stand, and PRs submitted afterwards get the new mode in
        full.
      zh: >
        不用。审批中的请购单，只要还没走到新模式不再要求的超预算审批步骤，这一步就会被自动跳过
        （记为 Auto-skipped），单子转到下一个审批人；已经给出的审批不变。之后新提交的请购单按新模式走。
    test:
      - "approval-api/tests/test_over_budget_mode_frozen.py::test_loosening_to_allow_moves_the_fm_task_on"
      - "approval-api/tests/test_over_budget_mode_frozen.py::test_fm_gm_opm_to_fm_only_waives_the_pending_gm_step_on_approve"
  # ISS-0055 point 2: "Service/Project Owner 可以不填吗？可以选其他部门的人吗？"
  # → "不是必填" / "只能选本部门" / "没有相关规则".
  - id: owner_is_required_and_anyone
    rule: service_project_owner
    asks:
      - [service/project owner, service owner, project owner, owner, 负责人, 服务负责人, 项目负责人]
      - [不填, 必填, 留空, 空着, 不选, 可以空, 为空, required, optional, mandatory, empty, blank,
         其他部门, 别的部门, 外部门, 跨部门, other department, another department, other departments,
         选谁, 谁都, 任何人, anyone]
    unless: [协议, agreement]
    says:
      en: >
        For Service (type 4) and Project-Related (type 6) PRs the
        Service/Project Owner is required and can never be empty: it defaults
        to the requester, and any active user may be chosen instead,
        including someone from another department.
      zh: >
        服务类（类型 4）和项目类（类型 6）请购单的 Service/Project Owner 是必填的，不能为空：默认是申请人本人，
        也可以改选任何在职用户，包括其他部门的人。
    test:
      - "tests/test_assistant_asst2_d.py::test_the_owner_is_any_active_user_and_never_empty"
  # ISS-0029 point 3 (three times): "项目类请购单提交前必须填哪些内容？" never
  # named the Owner. The document guide answers the rest; this is added under it.
  - id: service_and_project_prs_name_an_owner
    rule: service_project_owner
    route: keep
    place: last
    asks:
      - [项目类, 项目相关, 服务类, 服务型, 类型 4, 类型 6, 类型四, 类型六, project pr, project-related,
         service pr, project request, service request, type 4, type 6]
      - [必须填, 必填, 要填, 需要填, 填哪些, 填什么, 必须有, 要求, required, must fill, mandatory,
         need to fill, fill in, before submit, 提交前]
    unless: [owner, 负责人]
    says:
      en: >
        Service (type 4) and Project-Related (type 6) PRs also need a
        Service/Project Owner — it defaults to you, can be changed to any
        active user, and can never be left empty.
      zh: >
        另外，服务类（类型 4）和项目类（类型 6）请购单还必须有 Service/Project Owner：默认是你本人，
        可以改成任何在职用户，不能留空。
    test:
      - "tests/test_assistant_asst2_d.py::test_the_owner_is_any_active_user_and_never_empty"
