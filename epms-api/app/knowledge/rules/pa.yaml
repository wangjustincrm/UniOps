area: pa
label: Payment applications and payment
covers: >
  What can go on one payment application, prepayments, PA tax, who executes the payment, self-payment, vendor credits, remittance advice.
rules:
  - id: rejected_pa_is_cancelled
    asked_as:
      - what status does a rejected payment application have
      - 被拒绝的付款申请是什么状态
      - are there rejected PAs
    answer: >
      A rejected payment application gets status Cancelled, not Rejected — the
      approval engine sets cancelled for every PA rejection. So filtering PAs by
      Rejected finds nothing; to find rejected ones, look for Cancelled PAs whose
      history has a Reject. (Purchase requests and orders, by contrast, do get
      status Rejected.)
    enforced_in: "approval-api app/crud/engine.py execute_action reject: cancelled for pa / pa_dir (pinned by approval-api tests/test_engine_multiholder_approve.py)"
    provenance: pinned
    test:
      - "approval-api/tests/test_engine_multiholder_approve.py::test_reject_allowed_for_authorized_holder"
  - id: pa_numbering
    asked_as:
      - how are PA numbers generated
    answer: >
      PA-YYYYMMDD-NNNN: the date it was created, then a 4-digit sequence that
      restarts each day. The date is the UTC date at creation, not the plant's: a document created after 20:00 Toronto time (19:00 in winter) carries the next day's date.
    enforced_in: "epms-api app/crud/pa.py _next_number"
    provenance: pinned
    test:
      - "tests/test_assistant_iss_round2.py::test_numbers_have_the_formats_the_guide_states"
  # ISS-0065 point 8: this card used to say Direct PAs were discontinued.
  # Only OA's PA-DIR is (OA.md §15); the Direct PA moved to EPMS (EPMS.md
  # §3.22, v2.33) and production creates them.
  - id: direct_pa
    asked_as:
      - what is a direct payment application
      - can I raise a direct PA
      - 直接付款申请怎么走
      - 直接付款申请现在还能建吗
    answer: >
      Yes, in EPMS. An invoice with no purchase order and no agreement behind
      it is paid by a Direct PA: on the invoice, Match → Direct PA (whoever may
      match the invoice); then Payment Applications → Create Direct PA (for
      holders of Create / Edit PAs) takes one or more such invoices of the
      same vendor and currency, falling due within {window} days of each
      other, and it cannot be submitted without the department, cost center,
      budget account and a reason. It is approved on the "PA (Direct)"
      workflow (Portal → Admin → Approval Workflows) and paid like any other
      PA. OA's own Direct Payment Application (PA-DIR) is retired: OA refuses
      a new one, and its old ones can still be opened, approved and paid.
    provenance: derived
    derive: pa_invoice_window
    enforced_in: "epms-api app/api/v1/pa.py create_direct_pa (POST /pa/direct, epms.pa.write) -> app/crud/pa.py create_direct (one vendor, one currency, due window) and the submit gate; app/api/v1/invoices.py Match → Direct PA; approval-api pa_dir chain; expense-api app/api/v1/pa.py DIRECT_PA_RETIRED (OA create returns 410 Gone)"
    test:
      - "tests/test_direct_pa.py::test_create_direct_pa_from_two_invoices"
      - "tests/test_direct_pa.py::test_create_direct_pa_refusals"
      - "tests/test_direct_pa.py::test_invoices_due_far_apart_need_separate_direct_pas"
      - "tests/test_direct_pa.py::test_submit_gate_needs_every_dimension"
      - "expense-api/tests/test_direct_pa_retired.py::test_creating_a_direct_pa_is_gone"
      - "expense-api/tests/test_direct_pa_retired.py::test_an_existing_direct_pa_can_still_be_acted_on"
  - id: paid_pa_is_processed
    asked_as:
      - how much was paid last week
      - which PAs have been paid
      - are the invoices on a paid PA marked paid
      - 上周付了多少钱
    answer: >
      A payment application that has been paid has status Processed — there is
      no Paid status on a PA. Its payment date is the date Finance recorded when
      executing the payment. Paying it marks the invoices on it Paid, or
      Partially Paid for a prepayment — for a prepayment's invoices Partially
      Paid is the correct status, not a missing payment. A PA in status
      Approved is fully approved and still waiting to be paid.
    enforced_in: "finance-api app/crud/payment_execute.py (pa.status = processed, paid_at = payment date; invoices paid / partially_paid for a prepayment); epms-api app/models/invoice.py Invoice.pa_payment_shown (the same rule, for the Assistant), said with the count per PA kind under every answer that uses it (app/services/answer_facts.py _paid_pa_invoices, counted over the invoices the query matched; with none on a prepayment PA, a narrator sentence blaming Partially Paid is taken out)"
    provenance: pinned
    test:
      - "finance-api/tests/test_payment_execute.py::test_execute_pa_po_marks_invoices_paid"
      - "tests/test_assistant_iss_batch6.py::test_pa_payment_shown_is_the_rule_payment_writes"
      - "tests/test_assistant_asst2_b.py::test_paid_pa_invoices_always_carry_the_partially_paid_rule"
      - "tests/test_assistant_asst2_g.py::test_partially_paid_is_not_blamed_when_none_is_a_prepayment"
  - id: prepayment_cap
    also_in: [vendor]
    asked_as:
      - 供应商 Raise The Standard 可以预付吗？
      - can this vendor be prepaid
      - how much can we prepay this vendor
      - what is the maximum prepayment percentage
      - 供应商最多能预付百分之几
    answer: >
      A prepayment can be at most the vendor's Max Prepayment % (on the vendor
      record) when one is set, otherwise the system cap in Admin Panel →
      Prepayment Config — and never more than that system cap in either case.
      A cap of 0 means the vendor cannot be prepaid. When an order is prepaid
      in stages, the cap applies to all its prepayments added together. The cap is not on
      agreements or POs. The vendor's own setting is readable as
      vendor.max_prepayment_pct; the system cap is only in Admin Panel →
      Prepayment Config. Whether a vendor can be prepaid is decided by these
      caps alone — never by the Prepaid flag on its past PRs or POs, which
      the payment application does not read.
    enforced_in: "epms-api app/api/v1/pa.py _assert_prepayment_cap, on create_pa and when a draft's % is edited in update_pa (effective_cap = vendor.max_prepayment_pct else Prepayment Config; second check against the system cap; cumulative over the PO's live prepayments via prior_prepayment_pct); the cap that applies to a vendor is said under a vendor answer by app/services/answer_facts.py _prepayment_cap (app/core/prepayment_cap.py effective_cap), first, with \"cannot be prepaid / no policy / must be set first\" taken out when the cap is above 0; the rule question with no vendor gets the verdict no_vendor_cap_takes_the_system_cap (rule_facts.prepayment_system_cap)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_prepayment_cap_reads_the_vendor_then_the_system"
      - "tests/test_assistant_asst2_b.py::test_a_vendor_with_no_cap_of_its_own_gets_the_system_cap"
      - "tests/test_assistant_asst2_g.py::test_a_vendor_answer_loses_no_policy_and_must_set_first"
  - id: vendor_credit_netting
    asked_as:
      - how are vendor credits used when we pay
      - how much is actually paid on a PA after credits
      - 贷项在付款时怎么抵扣
    # Round 2 follow-up 11-11 (ISS-0056): said by code under "PA-… 扣掉贷项后实际付多少？"
    # (app/services/fact_replies.py _pa_credits), so it is written in both
    # languages here.
    says:
      en: >
        Vendor credits are not entered on the payment application; they are
        netted when the payment is executed. At that moment every Available
        credit of the same vendor and the same currency is applied
        automatically, oldest credit date first, until the payment amount is
        covered; the person paying can untick credits in the payment dialog,
        which shows Gross, Vendor credits applied and Net. A credit that is
        used up becomes Exhausted; one partly used keeps the rest for the next
        payment. Credits still pending review, void, or in another currency
        are never applied.
      zh: >
        贷项不录在付款申请（PA）上，而是在执行付款时抵扣：那一刻，同一供应商、同一币种的所有
        可用（Available）贷项按贷项日期从早到晚自动抵扣，直到抵满付款金额为止；付款人可以在付款
        对话框里取消勾选某些贷项，对话框显示 Gross（总额）、Vendor credits applied（抵扣的贷项）
        和 Net（实付）。用完的贷项变为 Exhausted，部分使用的保留余额下次再扣。待审核、已作废或
        其他币种的贷项永远不会被抵扣。
    answer: >
      Vendor credits are not entered on the payment application; they are
      netted when the payment is executed. At that moment every Available
      credit of the same vendor and the same currency is applied automatically,
      oldest credit date first, until the payment amount is covered; the person
      paying can untick credits in the payment dialog, which shows Gross,
      Vendor credits applied and Net. A credit that is used up becomes
      Exhausted; one partly used keeps the rest for the next payment. Credits
      still pending review, void, or in another currency are never applied.
      The PA keeps its gross amount; the net paid and the credits applied are
      on the payment record, and the remittance advice lists each credit note.
    enforced_in: "finance-api app/crud/vendor_credit.py select_credits_for_payment (AVAILABLE, same vendor and currency, ORDER BY credit_date, created_at); app/crud/payment_execute.py (net = base - credit_applied on the PaymentRecord); pinned by finance-api tests/test_vendor_credit_netting.py. Said with the vendor's available credits for an unpaid PA by epms-api app/services/fact_replies.py _pa_credits"
    provenance: pinned
    test:
      - "finance-api/tests/test_vendor_credit_netting.py::test_fifo_takes_oldest_first_and_stops_at_base"
      - "finance-api/tests/test_vendor_credit_netting.py::test_payment_is_reduced_by_available_credit"
      - "tests/test_assistant_asst2_h.py::test_an_unpaid_pa_after_credits_says_netted_at_payment_and_lists_them"

  # ── Added 2026-10-21 (issue review batch 3) ───────────────────────────────
  - id: what_can_go_on_one_pa
    asked_as:
      - 一张 PA 能付多张 PO 吗？
      - 为什么这几张发票不能放在同一张 PA 里？
      - can one PA pay several POs
    answer: >
      A regular payment application can pay several POs and several
      invoices, as long as all the POs are with the same vendor and in the
      same currency (departments may differ — it is then approved as a
      cross-department payment). Prepayment, settlement and balance PAs are
      always for exactly one PO. The usual reasons invoices cannot go on one
      PA: they belong to POs of different vendors or currencies; an invoice
      is not on one of the PA's POs; their due dates are more than {window}
      days apart; a PO has no three-way matched invoice and no authorised
      receipt override; or an invoice is already on another payment
      application that is not cancelled or rejected (the form does not offer
      it and the server refuses it). Agreement PAs follow the agreement's own rules and have no
      due-date window. Give me the invoice or PO numbers and I can look at
      their data.
    provenance: derived
    derive: pa_invoice_window
    enforced_in: "epms-api app/api/v1/pa.py _assert_pos_coherent, _assert_invoices_belong_to_pos, PA_INVOICE_DUE_WINDOW_DAYS, receipt gate (po_has_three_way_matched_invoice / pa_override_receipt); epms/src/pages/pa/PaCreatePage.tsx (claimed invoices hidden)"
    test:
      - "tests/test_pa_multi_po.py::test_mixed_vendors_refused"
      - "tests/test_pa_multi_po.py::test_mixed_currencies_refused"
      - "tests/test_pa_multi_po.py::test_multi_po_prepayment_refused"
      - "tests/test_pa_multi_po.py::test_invoice_from_an_unlisted_po_refused"
      - "tests/test_pa_multi_po.py::test_receipt_gate_checks_every_po"
      - "tests/test_pa_multi_po.py::test_mixed_departments_allowed"
      - "tests/test_rule_registry.py::test_pa_window_is_the_routes"
  # ISS-0010 follow-up: one answer said "agreement payments need no receipt
  # check", which contradicts PRD AGR-061 and the code below.
  - id: agreement_pa_gates
    also_in: [agreement, invoice]
    asked_as:
      - 采购协议的付款需要收货检查吗？
      - what is checked before an agreement can be paid
      - why can I not raise a PA on this agreement
    answer: >
      A payment application against an agreement has no goods-receipt check
      and no receipt override — but it is not unchecked: the checks are on its
      invoices. It must list at least one invoice; each must be matched to
      that agreement and cleared for payment (Matched, or Approved after AP
      review — not Pending Review, Exception or Unmatched); the agreement must
      be active or still in its grace window; and only a Regular PA can be
      raised. Recurring agreement: each invoice must be linked to a billing
      period whose service the department has confirmed. House account: each
      invoice must have its agreement receipts attached, or be settled
      explicitly without receipt evidence, with a reason; on New PA an
      invoice with neither is shown greyed out ("No receipt evidence yet")
      and cannot be ticked. Milestone: no confirmation check. The same checks
      run again whenever the PA's invoices are changed.
    enforced_in: "epms-api app/api/v1/pa.py create_pa agreement branch + _validate_agreement_pa_invoices (_PAYABLE_INVOICE_STATUSES matched/approved; recurring schedule_id + accepted_at; house_account receipt_ids or legacy_settlement); app/schemas/invoice.py SettleWithoutReceiptRequest (reason required); epms/src/pages/pa/PaCreatePage.tsx lacksReceiptEvidence; PRD EPMS AGR-061"
    provenance: pinned
    test:
      - "tests/test_agreement_pa.py::test_agreement_pa_skips_the_goods_receipt_gate"
      - "tests/test_agreement_pa.py::test_agreement_pa_requires_at_least_one_invoice"
      - "tests/test_agreement_pa.py::test_agreement_pa_refused_for_invoice_still_in_match_review"
      - "tests/test_agreement_pa.py::test_agreement_pa_refused_when_agreement_not_admissible"
      - "tests/test_agreement_pa.py::test_agreement_pa_rejects_non_regular_pa_type"
      - "tests/test_agreement_pa.py::test_recurring_pa_payable_after_manual_period_assignment"
      - "tests/test_agreement_pa.py::test_milestone_pa_not_gated_by_confirmation"
      - "tests/test_agreement_pa.py::test_patch_pa_rejects_swapping_in_an_unconfirmed_invoice"
      - "tests/test_receipt_pa_gate.py::test_house_account_pa_refused_when_invoice_has_neither_receipts_nor_legacy"
      - "tests/test_receipt_pa_gate.py::test_house_account_pa_allowed_for_a_legacy_settled_invoice"
      - "tests/test_invoice_receipts.py::test_settle_without_receipt_requires_a_reason"
      - "tests/test_assistant_iss_batch6.py::test_no_rule_says_agreement_payments_are_unchecked"
  - id: open_prepayment_blocks_a_regular_pa
    asked_as:
      - 有未结清的预付 PA 时，还能建普通 PA 吗？
      - can I create a regular PA while a prepayment is open
    answer: >
      No. While a PO has a prepayment PA that is not cancelled, rejected or
      processed (paid), a regular PA cannot be created on that PO — the
      system refuses and names the open prepayment PA. Settlement and
      balance PAs are exempt. A PO may be prepaid in several stages (each its
      own prepayment PA, the cap counting them together), but no further
      prepayment is accepted once the PO has a settlement or balance PA.
    enforced_in: "epms-api app/api/v1/pa.py create_pa (PP-008 regular branch; PP-004 prepayment branch)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_an_open_prepayment_blocks_a_regular_pa"
  # ISS-0133 (rule question 8): the administrator answered B — the amount is
  # calculated from the %; the question put it as "% × PO amount".
  - id: prepayment_amount
    asked_as:
      - 预付 PA 的金额是怎么算的？
      - 预付比例有什么用？
      - how is the prepayment amount calculated
    answer: >
      A prepayment PA's pre-tax amount is calculated, not typed: Prepayment %
      × the whole PO's pre-tax total (30% of a PO of 400.00 pre-tax is
      120.00). Changing the % on a draft recalculates it. Tax is pre-filled
      with the same share of the PO's tax (15.60 of 52.00 here) and can be
      changed, and shipping or other charges can be added, as on any PA.
      Invoices are optional on a prepayment; linking one does not change the
      amount. With no line-matched invoice its single line reads
      "Prepayment N% of PO-…".
    enforced_in: "epms-api app/api/v1/pa.py _prepayment_amounts, on create_pa and update_pa (server recomputes whatever the client sent); epms/src/pages/pa/PaCreatePage.tsx, PaEditPage.tsx (pre-tax read-only)"
    provenance: pinned
    test:
      - "tests/test_pa.py::test_prepayment_amount_follows_the_pct"
  - id: pa_tax
    asked_as:
      - PA 上的运费要交税吗？
      - 没有发票时 PA 的税额是怎么算的？
      - is freight on a PA taxed
    answer: >
      PA tax is on the lines only. Shipping/freight and other charges are
      added after tax and are never taxed — a charge that is taxable has to
      be entered as a line. When invoices are linked, the PA's tax is filled
      with the invoices' own tax. With no invoice, the form fills tax as the
      pre-tax amount × the PO's tax rate (the agreement's on an agreement
      PA), for CAD only — 13% is used only for an agreement that has no rate
      recorded; in another currency the tax is left blank. Once you type in
      the tax field it is no longer filled for you. A prepayment's tax is
      pre-filled with the prepayment's share of the PO's tax instead.
    enforced_in: "epms-api app/admin/recompute.py recompute_pa_header_only ('shipping and other charges are never taxed'); app/crud/pa.py _compute_payment; epms/src/pages/pa/PaCreatePage.tsx tax prefill"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_pa_tax_is_on_the_lines_only"
  - id: who_executes_payment
    asked_as:
      - 谁可以执行付款？AP Clerk 可以吗？
      - who can execute a payment
    answer: >
      An approved PA is paid with Mark as Processed — on the PA page, or from
      Finance → Payments and payment batches — by a Payment Officer, Finance
      Manager or Finance BP (as main or additional role) or a System Admin
      (main role only). An AP Clerk cannot. Payment is refused while the PA
      is not approved or the accounting period is closed. This is not an
      approval step: it is not part of any approval chain.
    enforced_in: "finance-api app/crud/payment_execute.py _PAY_ROLES / _PAY_ROLES_ASSIGNED, _check_can_pay, _check_period_open, status approved"
    provenance: pinned
    test:
      - "finance-api/tests/test_payment_authority.py::test_ap_clerk_can_no_longer_execute_payments"
      - "finance-api/tests/test_payment_authority.py::test_payment_officer_works_as_an_additional_role"
      - "finance-api/tests/test_payment_authority.py::test_system_admin_as_additional_role_is_denied"
      - "finance-api/tests/test_payment_execute.py::test_execute_blocked_when_period_closed"
      - "finance-api/tests/test_payment_execute.py::test_execute_rejects_non_approved"
  - id: no_paying_your_own_pa
    asked_as:
      - 我自己建的 PA 可以自己执行付款吗？
      - can I pay a PA I created
    answer: >
      No, while the self-payment segregation-of-duties rule is enabled (it
      is by default): the person who created a PA cannot execute its
      payment, even after it is fully approved — someone else with payment
      authority has to. Whether you approved it is not what decides this.
    enforced_in: "finance-api app/crud/payment_execute.py _check_self_payment (SoD rule self_payment, seeded enabled)"
    provenance: pinned
    test:
      - "finance-api/tests/test_payment_execute.py::test_self_payment_blocked_for_pa_creator"
      - "finance-api/tests/test_payment_execute.py::test_self_payment_allowed_when_rule_disabled"
  - id: remittance_advice
    asked_as:
      - PA 的汇款通知发给供应商了吗？
      - was the remittance advice sent
      - 付款以后还有什么步骤？
    answer: >
      After a PA is paid, the next step is the remittance advice: an email
      to the vendor (one per payee) that Finance sends from the system —
      Finance → Payments, a payment batch or a selection of payments. An AP
      Clerk may send it as well as whoever paid. It is part of the payment
      process but is not sent automatically when paying, and a PA's approval
      history says nothing about it. Whether it was sent (and when, or whether
      it failed) is recorded on the Finance payment pages. Asked about one paid
      PA, the assistant reads that send record and says whether, when and to
      whom it was sent — for users with View Finance; others are told it needs
      Finance access.
    enforced_in: "finance-api app/api/v1/remittance.py (send routes; PRD EPMS REM-001); app/crud/payment_execute.py sends none; app/models/remittance.py payment_remittance_notifications (read for one PA by epms-api app/services/answer_facts.py payment_facts, View Finance only — not in the queryable ontology; answer_facts.say_payment puts it first and takes out a narrator's \"sent\" with no send record, or \"not sent\" over one)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_remittance_is_sent_by_hand_and_not_modelled"
      - "tests/test_assistant_asst2_c.py::test_the_flow_after_payment_is_the_remittance_advice"
      - "tests/test_assistant_asst2_b.py::test_a_paid_pa_says_account_and_remittance_from_finance_records"
      - "tests/test_assistant_asst2_g.py::test_remittance_is_not_said_sent_without_a_send_record"
      - "tests/test_assistant_asst2_g.py::test_no_account_goes_when_the_payment_record_names_one"
  - id: recording_a_manual_credit
    # Round 2 (ISS-0022 #3): refused once in three. Code answers it.
    said_when:
      - '(?:手工|手动|人工|\bmanual(?:ly)?\b).{0,8}(?:贷项|贷记|\bcredit)'
    says:
      en: >
        A manual vendor credit (recorded from the vendor's email rather than an
        uploaded credit note) needs the vendor, the vendor's credit-note
        reference number, the credit date, the amount (and tax, if any) and a
        note explaining its basis; the server refuses a manual credit without
        that note. The form also requires the vendor's email or document to be
        attached, and a manual credit with no attachment cannot be approved
        from its detail panel — both are rules of the screen, not checks the
        server makes. The same credit-note number cannot be recorded twice for
        one vendor (unless the earlier one was voided).
      zh: >
        手工贷项（根据供应商邮件录入，而不是上传贷项单）需要：供应商、供应商的贷项单参考号、
        贷项日期、金额（有税的话加上税额），以及一段说明依据的备注——没有备注服务器会拒绝。
        表单还要求附上供应商的邮件或文件，没有附件的手工贷项在详情面板里不能审批——这两条是
        页面上的限制，不是服务器的校验。同一供应商的同一个贷项单号不能重复录入（之前那条已作废的除外）。
    asked_as:
      - 录入手工贷项需要什么？
      - what do I need to record a manual credit
    answer: >
      A manual vendor credit (recorded from the vendor's email rather than an
      uploaded credit note) needs the vendor, the vendor's credit-note
      reference number, the credit date, the amount (and tax, if any) and a
      note explaining its basis; the server refuses a manual credit without
      that note. The form also requires the vendor's email or document to be
      attached, and a manual credit with no attachment cannot be approved
      from its detail panel — both are rules of the screen, not checks the
      server makes. The same credit-note number cannot be recorded twice for
      one vendor (unless the earlier one was voided).
    enforced_in: "finance-api app/schemas/vendor_credit.py _manual_needs_a_reason; app/crud/vendor_credit.py _find_duplicate; epms/src/pages/vendorcredits/ManualCreditModal.tsx (files required) and CreditDetailDrawer.tsx (needsEvidence)"
    provenance: pinned
    test:
      - "finance-api/tests/test_vendor_credit.py::test_post_manual_credit_requires_notes"
      - "finance-api/tests/test_vendor_credit.py::test_manual_credit_collides_with_an_uploaded_one_of_the_same_number"
      - "tests/test_rule_registry.py::test_a_manual_credit_needs_its_email_on_screen"

# The conclusion a question must get, placed by code (app/services/rule_verdicts.py).
verdicts:
  # ISS-0249: one answer opened "可以" and then said invoices of different
  # vendors cannot go on one PA.
  - id: one_pa_one_vendor
    rule: what_can_go_on_one_pa
    asks:
      - [不同供应商, 不同的供应商, 多个供应商, 几个供应商, 几家供应商, 多家供应商, 两个供应商,
         两家供应商, 不同厂商, 不一样的供应商, different vendors, different vendor,
         different suppliers, several vendors, multiple vendors, two vendors, more than one vendor]
      - [付款申请, pa, payment application, 一起付, 一起支付]
    says:
      en: >
        No. One payment application pays one vendor: all the POs on a PO-route
        PA must be with the same vendor and in the same currency, and so must
        the invoices on a Direct PA. Invoices from different vendors go on
        separate payment applications.
      zh: >
        不能。一张付款申请只付一个供应商：PO 路线的付款申请上所有 PO 必须是同一供应商、
        同一币种，Direct PA 上的发票也必须是同一供应商、同一币种。不同供应商的发票要分别建付款申请。
    test:
      - "tests/test_pa_multi_po.py::test_mixed_vendors_refused"
      - "tests/test_pa_multi_po.py::test_mixed_currencies_refused"
      - "tests/test_direct_pa.py::test_create_direct_pa_refusals"
  # ISS-0040 point 2: "为什么这几张发票不能放在同一张 PA 里？" was answered,
  # twice, only with "give me the invoice numbers". The common reasons come
  # first, then the offer to look. (The receipt-evidence wording is left to
  # what_can_go_on_one_pa and waits on the administrators.)
  - id: why_invoices_cannot_share_a_pa
    rule: what_can_go_on_one_pa
    derive: pa_invoice_window
    asks:
      - [为什么, 为何, 怎么, 什么原因, 原因, why, what stops, reason]
      - [发票, invoice, invoices]
      - [同一张, 同一个, 一张, 一起, 放在一起, 放进, 放到, same, one, together]
      - [付款申请, pa, payment application]
    says:
      en: >
        The usual reasons invoices cannot go on one payment application:
        (1) they belong to POs of different vendors or currencies;
        (2) an invoice is not on one of the PA's POs;
        (3) their due dates are more than {window} days apart (PO-route and
        Direct PAs; agreement PAs have no such window);
        (4) a PO has no three-way matched invoice and no authorised receipt
        override;
        (5) an invoice is already on another payment application that is not
        cancelled or rejected — the form does not offer it and the server
        refuses it.
        Give me the invoice or PO numbers and I will check which of these
        applies.
      zh: >
        发票不能放进同一张付款申请，常见原因有这几种：
        ① 发票所属的 PO 供应商或币种不同；
        ② 有发票不属于这张付款申请所选的 PO；
        ③ 发票的到期日相差超过 {window} 天（PO 路线和 Direct PA 都有这个限制，协议付款申请没有）；
        ④ 有 PO 还没有三单匹配的发票，也没有获授权的收货覆盖（override）；
        ⑤ 发票已经在另一张未取消、未拒绝的付款申请上——表单不会列出它，服务器也会拒绝。
        把发票号或 PO 号发给我，我可以帮你查具体是哪一条。
    test:
      - "tests/test_pa_multi_po.py::test_mixed_vendors_refused"
      - "tests/test_pa_multi_po.py::test_invoice_from_an_unlisted_po_refused"
      - "tests/test_pa_multi_po.py::test_receipt_gate_checks_every_po"
      - "tests/test_rule_registry.py::test_pa_window_is_the_routes"
      - "tests/test_rule_registry.py::test_one_invoice_one_pa_is_refused_by_the_server"
  # ISS-0065 point 8: "直接付款申请…现在还能建吗？" was answered "can be
  # created in draft" while the card said discontinued. The planner keeps the
  # route (the approval chain comes from the process route); the conclusion
  # is put in front of whatever it answers.
  - id: direct_pa_can_be_created
    rule: direct_pa
    route: keep
    asks:
      - [直接付款, 直接支付申请, direct pa, direct payment, pa-dir, pa dir]
      - [还能, 能建, 能不能, 可以建, 还可以, 能否, 可否, 是否可以, 是否还, 还有吗, 停用, 取消了吗,
         can i, can we, can it, still, create, raise, retired, discontinued, available]
    says:
      en: >
        Yes — in EPMS: Match → Direct PA on the invoice, then Payment
        Applications → Create Direct PA. Only OA's old Direct Payment
        Application (PA-DIR) is retired.
      zh: >
        可以，在 EPMS 里建：先在发票上点 Match → Direct PA，再到 Payment Applications →
        Create Direct PA 建单。停用的只是 OA 里原来的直接付款申请（PA-DIR）。
    test:
      - "tests/test_direct_pa.py::test_create_direct_pa_from_two_invoices"
      - "expense-api/tests/test_direct_pa_retired.py::test_creating_a_direct_pa_is_gone"
  # ISS-0066: "没有设置 Max Prepayment % 的供应商，能不能建预付款 PA？" opened
  # "不能", then said the Prepayment Config cap applies, and ended "需要先在供应商
  # 记录上设置". The conclusion follows the system cap, and the sentences that
  # say the opposite are taken out (derive returns them with the value).
  - id: no_vendor_cap_takes_the_system_cap
    rule: prepayment_cap
    derive: prepayment_system_cap
    asks:
      - [max prepayment, 预付上限, 预付比例, 预付款比例, 最大预付, 预付百分比, 预付款百分比,
         prepayment cap, prepayment percentage, prepayment %]
      - [没有设置, 没设置, 没设, 未设置, 不设置, 没有填, 没填, 未填, 为空, 是空的, 空着,
         not set, no max, without, has no, have no, empty, blank, unset]
      - [预付款 pa, 预付 pa, 建预付, 预付, 预付款, prepayment pa, prepay, prepaid, prepayment]
    unless: [在哪, 哪里设置, 怎么设置, 如何设置, where do, how do i set, how to set]
    says:
      en: >
        {yes_en} A vendor with no Max Prepayment % of its own takes the system
        cap in Admin Panel → Prepayment Config, currently {pct}% — {then_en}
      zh: >
        {yes_zh}供应商没有设置自己的 Max Prepayment % 时，适用 Admin Panel → Prepayment
        Config 的系统上限，目前为 {pct}%，{then_zh}
    test:
      - "tests/test_rule_registry.py::test_prepayment_cap_reads_the_vendor_then_the_system"
      - "tests/test_assistant_asst2_g.py::test_a_vendor_without_a_cap_can_be_prepaid_up_to_the_system_cap"
