area: reports
label: Reports
covers: >
  Which reports exist, what the Receiving Report counts, and what a report's From / To dates include.
rules:
  # ISS-0020, ISS-0035, ISS-0048: calendar words are read in code.
  - id: calendar_words_in_questions
    asked_as:
      - 你说的"本月"是从哪天到哪天？
      - does this month mean the last 30 days
      - 10/11 是 10 月 11 日还是 11 月 10 日？
    answer: >
      In a question to the Assistant, today, yesterday, this / last week,
      month, quarter and year are calendar periods in plant time (Toronto):
      weeks start on Monday, "this month" is the 1st to today and "this year"
      is 1 January to today — except on a date that can lie ahead (a due date,
      a needed-by date), where "this month" is the whole month. "The same
      period last year" (去年同期) is that period one year earlier. Only "the
      last 3 months", "past 30 days" and the like are rolling windows. A date
      with slashes is day first, as EPMS shows dates (10/11 = 10 November),
      and a day without a year is in the current year. Every answer over a
      period ends with the dates it used.
    enforced_in: "epms-api app/services/period_words.py enforce / explicit_days / stated, applied by app/api/v1/assistant_chat.py _period_from_the_words and _say_the_period; app/services/controlled_query.py calendar_range(whole=) for ontology fields marked scheduled"
    provenance: pinned
    test:
      - "tests/test_assistant_asst2_c.py::test_this_month_is_the_calendar_month_whatever_the_planner_wrote"
      - "tests/test_assistant_asst2_c.py::test_due_this_month_is_the_whole_month"
      - "tests/test_assistant_asst2_c.py::test_every_period_answer_ends_with_its_dates"
  - id: report_types
    asked_as:
      - 系统有哪些报表？
      - which reports are there
    answer: >
      Reports → Report Centre has {count} exports (CSV): {reports}. The
      Receiving Report is separate — open it from the Goods Receipts list.
      Budget figures in detail are on the Budget Dashboard.
    provenance: derived
    derive: report_types
    enforced_in: "epms-api app/api/v1/reports.py router; epms/src/pages/reports/ReportCentrePage.tsx"
    test:
      - "tests/test_rule_registry.py::test_report_types_are_the_routers"
  - id: report_date_range_includes_both_days
    asked_as:
      - 报表的结束日期包含当天吗？
      - does the To date include that day
      - why is my same-day report export empty
    answer: >
      Yes. In Reports → Report Centre, From and To are whole days at the plant
      (Toronto time) and both are included: From 27/10 To 27/10 exports every
      record created on 27/10. That is the same reading the Receiving Report
      gives its Arrival From / To.
    enforced_in: "epms-api app/crud/reports.py _in_range (all five date-filtered exports); app/crud/gr_report.py receiving_rows"
    provenance: pinned
    test:
      - "tests/test_reports.py::test_same_day_range_exports_that_days_records"
      - "tests/test_reports.py::test_range_days_are_plant_days"
