area: tasks
label: Tasks in the Task Inbox
covers: >
  Overdue and urgent tasks, closing a task, why a task reached you.
rules:
  # ISS-0030, ISS-0247, ISS-0248, ISS-0250: the next step, from the task table.
  - id: what_happens_next_in_a_purchase
    asked_as:
      - 发票已经匹配好了，下一步是什么？谁来做？
      - 我的请购单批准了，接下来会发生什么？我还要做什么？
      - 付款申请已经批完了，什么时候付款？谁来付？付完以后还有什么步骤？
      - PR-20261023-0002 现在到哪一步了？下一步该谁做什么？
    answer: >
      A purchase goes, in order: {steps}. Each step reaches whoever does it as
      a task in the Task Inbox, except the remittance advice, which is sent
      from Finance. For one document, the Assistant says where it stands from
      its document chain and the open tasks on those documents.
    provenance: derived
    derive: purchase_flow
    enforced_in: "epms-api app/services/next_step.py FLOW (route, general_answer, for_chain), used by app/api/v1/assistant_chat.py _chat / _answer_trace / _answer_flow; PRD EPMS §3.3.4, §3.7.1, GR-P-006, GR-P-008, REM-001"
    test:
      - "tests/test_assistant_asst2_c.py::test_every_step_is_a_task_the_system_raises"
      - "tests/test_assistant_asst2_c.py::test_after_matching_the_requester_creates_the_pa"
  # ISS-0131: open tabs re-read their data without F5.
  - id: open_tabs_refresh_themselves
    asked_as:
      - my tab still shows the old status after I did something in another tab
      - 怎么刷新页面又不关掉其他页签？
      - why does F5 close all my tabs
    answer: >
      List and detail tabs (dashboard, PR, PO, goods receipt, invoice, vendor
      credit, agreement, receipt, PA and freight lists and pages, and the
      vendor, project and parts lists) re-read their data when you switch back
      to them, and the Refresh button at the right of the tab bar re-reads the
      current tab at once (the Task Inbox has its own Refresh button). Other
      tabs stay open. A reload
      of the browser (F5) starts again from the pinned tabs only. New and edit
      forms are not refreshed, so what you have typed is kept. OA works the
      same way for its Task Inbox, Expense Claims and Travel Applications
      lists and claim pages (the Refresh button there covers the Task Inbox
      too); OA's new, edit and admin settings forms are not refreshed.
    enforced_in: "epms/src/components/layout/TabQueryScope.tsx (TabQueryScope, TabRefreshButton); epms/src/components/layout/AppLayout.tsx REFRESHABLE_ROUTES; oa/src/components/layout/TabQueryScope.tsx; oa/src/components/layout/AppLayout.tsx REFRESHABLE_ROUTES; PRD EPMS UI-TAB-003, UI-TAB-004, DSH-010"
    provenance: pinned
    test:
      - "epms/src/components/layout/TabQueryScope.test.ts"
  - id: tasks_have_no_due_date
    asked_as:
      - 我有哪些待办已经超时了？
      - which of my tasks are overdue
    answer: >
      Tasks in EPMS have no due date — no kind of task is created with one —
      so none can be overdue, and the dashboard's Overdue Tasks count is
      always 0. Urgent is a priority a task is created with (duplicate NC
      invoices, damaged goods and the like); it does not mean the task is
      late. What can be shown instead is the urgent tasks, or the ones that
      have been open the longest.
    enforced_in: "every Task(...) construction in epms-api leaves due_date unset (raw inserts in nc_purchase_sync/error_tasks.py too); app/crud/dashboard.py build_requester Overdue Tasks = due_date < today"
    provenance: not_built
    test:
      - "tests/test_rule_registry.py::test_no_task_is_created_with_a_due_date"
  - id: tasks_close_themselves
    asked_as:
      - 怎么把一个任务标记为完成？
      - how do I mark a task as done
    answer: >
      You cannot mark a task done by hand — the Task Inbox has no Mark Done
      (it was removed). A task closes by itself when the work it asks for is
      done: the document approved or returned, the receipt confirmed, the PA
      created, and so on. Open the task's document and do that. If that PA is
      later rejected (cancelled) and no other live PA covers the order, the
      Create Payment Application task comes back; a returned PA still counts.
    enforced_in: "epms/src/services/tasks.ts (no complete() on purpose); epms/src/pages/tasks/TaskInboxPage.tsx; epms-api app/api/v1/tasks.py complete refuses approval tasks; app/api/v1/pa.py pa_action → crud/pa.py reopen_create_pa_tasks_if_unpaid (live PAs only, crud/pa_links.py pa_is_live)"
    provenance: pinned
    test:
      - "tests/test_task_complete_rejects_approvals.py::test_complete_rejects_approval_tasks"
      - "tests/test_rule_registry.py::test_the_task_inbox_has_no_mark_done"
      - "tests/test_pa_cancel_reopens_create_pa.py::test_rejecting_the_only_pa_reopens_create_pa"
  # ISS-0131 follow-up: the groups' order is DSH-001's.
  - id: task_inbox_group_order
    asked_as:
      - in what order does the Task Inbox list tasks
      - 为什么 Task Inbox 里修改类任务排在最后？
    answer: >
      The Task Inbox groups tasks by type in a fixed order — approvals,
      payment and placing orders, creates, receiving, invoice, settlement,
      and revisions last — newest first within a group.
    enforced_in: "epms/src/pages/tasks/TaskInboxPage.tsx GROUP_ORDER; PRD EPMS DSH-001"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_task_inbox_groups_follow_dsh_001"
  # ISS-0011: the Assistant's total was the inbox's plus 6 VMS tasks.
  - id: what_the_epms_task_inbox_lists
    asked_as:
      - 为什么助手说的待办数和 Task Inbox 不一样？
      - are VMS tasks in the EPMS Task Inbox
      - 为什么 EPMS 的 Task Inbox 里看不到报销 / 出差审批？
    answer: >
      The EPMS Task Inbox lists only EPMS work: Purchase Requests, Purchase
      Orders, goods receipts, invoices, Payment Applications, Purchase
      Agreements, PO sign-offs and NC purchase-sync errors. Tasks of other
      modules — OA (expense, mileage and travel expense claims, travel
      applications, custom forms), Finance (budget plans, JV validation,
      duplicate NC invoices) and VMS — are worked in those modules; each has
      its own Task Inbox, and only Portal's home inbox gathers every module's
      tasks. The task counts given here are the EPMS Task Inbox's, worked out
      the same way; tasks of other modules are named separately and not
      counted in.
    enforced_in: "epms/src/lib/taskTypes.ts EPMS_INBOX_DOC_TYPES + isEpmsInboxTask (Task Inbox page, header bell, dashboard list); epms-api app/services/guide_view.py EPMS_INBOX_DOC_TYPES + split_epms_inbox, used by app/api/v1/assistant_chat.py _answer_whats_next"
    provenance: pinned
    test:
      - "tests/test_assistant_iss_batch6.py::test_task_counts_leave_out_what_the_epms_inbox_leaves_out"
      - "tests/test_assistant_iss_batch6.py::test_the_inbox_filter_is_the_frontends"
  # ISS-0131: finding a task among hundreds, and who closed a done one.
  - id: finding_a_task_and_who_closed_it
    asked_as:
      - how do I find a task in the Task Inbox
      - 已完成的任务是谁关掉的？
      - why does a completed task not say who closed it
    answer: >
      The Task Inbox has a search box (document number, vendor or title) and
      a task-type filter, and each group can be collapsed; a group longer than
      20 shows its first 20 with "Show all". An approval card names its step
      (e.g. "Step 1/2: Department Manager review"), so the steps of one
      document can be told apart. The Completed tab lists only today's
      completed tasks, and each says when it was closed, and by whom when
      that was recorded. Approval tasks are closed by the approval engine,
      which does not record a closer on the task, so they show only the time;
      who approved, returned or rejected is in the document's approval
      history.
    enforced_in: "epms/src/pages/tasks/TaskInboxPage.tsx (search, type filter, GROUP_PREVIEW, approval step, Closed … [by …]); epms-api app/api/v1/tasks.py list_tasks completed_by_name; approval-api app/crud/engine.py closes tasks without completed_by"
    provenance: pinned
    test:
      - "tests/test_task_inbox_completed_by.py::test_completed_tasks_name_who_closed_them"
