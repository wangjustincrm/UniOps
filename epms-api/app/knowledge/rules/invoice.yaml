area: invoice
label: Invoices and matching
covers: >
  Invoice numbers, matching against POs, the match tolerance, duplicate invoice numbers, due dates, freight lines, unmatching, courier invoices.
rules:
  - id: matching_compares_amounts_not_received_quantity
    asked_as:
      - does three-way match compare received quantities
      - 三单匹配会比较收货数量吗
      - can an invoice be matched before the goods are received
    answer: >
      No. Matching compares AMOUNTS, not received quantities. For each PO line
      the system adds up what every matched invoice has billed for it (before
      tax) and compares that with the line's value. Billing less is allowed —
      a line can be invoiced in several parts. Only billing MORE than the line's
      value by more than the configured tolerance puts the invoice in
      exception. Goods receipts are not compared at all, so an invoice can be
      Matched while nothing has been received yet. Receipts that exist are
      linked to the invoice for reference.
      Receiving matters at the NEXT step, payment: a payment application for a
      PO (other than a prepayment) can only be created once that PO has a
      matched invoice AND some evidence of receipt — a goods receipt, or a
      received quantity on its lines. That checks that something was received,
      still not that the quantities agree. Without it the PA is refused unless a
      user with the "Override Receipt on PA" permission overrides it with a
      reason. A matched invoice with no receipt yet is why a "Confirm Goods
      Receipt" task appears. Agreement payments have no goods-receipt check; a
      house account invoice needs its agreement receipts attached (or an
      explicit settlement without receipt evidence) instead.
    enforced_in: "epms-api app/crud/invoice.py match() (amount variance vs PoLineItem.line_total); app/api/v1/pa.py receipt gate + crud/po.py po_has_three_way_matched_invoice; PRD EPMS INV-3WM-006, PA-013"
    provenance: pinned
    test:
      - "tests/test_assistant_iss_round2.py::test_invoice_matches_with_nothing_received"
  - id: courier_invoices_are_matched_to_shipments
    asked_as:
      - where do I upload a UPS / FedEx / Purolator invoice
      - 快递发票在哪里上传
      - why can this invoice not be matched to a PO
    answer: >
      A courier invoice is uploaded on EPMS → Invoices → Upload Invoice like any
      invoice: when its vendor is a carrier's (Freight → Carriers) the form
      turns into the courier review by itself — there is no type or carrier to
      choose, and a carrier's invoice can only be a courier invoice. It is marked
      Freight in the invoice lists. It
      is never matched to a PO or an agreement: on its invoice page each charge
      is matched to a registered shipment's tracking number and cost center,
      and once finalised it is paid from Payment Applications → New Freight PA.
      Anyone who may upload invoices may upload it. It is matched by holders of
      the Match Courier Invoices permission, or by the person AP assigns it to
      from the Unmatched Queue (like any invoice — they get a "Match Invoice"
      task and need no Freight permission); other invoice readers see it
      read-only. Only the freight manager raises the Freight PA.
    enforced_in: "epms-api app/api/v1/freight.py (create / match / finalize on epms.freight.manage, read-only GET for invoice readers); app/api/v1/invoices.py _refuse_freight; PRD EPMS §3.21"
    provenance: pinned
    test:
      - "tests/test_freight.py::test_generic_invoice_endpoints_refuse_freight_invoices"
      - "tests/test_freight.py::test_ups_sample_auto_matches"
  - id: invoice_internal_number
    asked_as:
      - how are invoice numbers generated
    answer: >
      The vendor's own invoice number is kept as typed. EPMS also gives every
      invoice an internal reference INV-YYYY-NNNN: the year it was entered, then
      the next free number in that year.
    enforced_in: "epms-api app/crud/invoice.py _next_ref"
    provenance: pinned
    test:
      - "tests/test_assistant_iss_round2.py::test_numbers_have_the_formats_the_guide_states"

  # ── Added 2026-10-21 (issue review batch 3) ───────────────────────────────
  - id: match_tolerance
    asked_as:
      - 发票匹配的容差是多少？在哪里改？
      - what is the invoice match tolerance
    answer: >
      An invoice that bills more than its PO line still matches when the
      cumulative over-billing is within {pct}% — the company setting for the
      match tolerance (5% unless changed). It cannot be changed in any
      screen. Billing less than the PO line always passes (partial
      invoicing); over-billing beyond the tolerance puts the invoice in
      Exception.
    provenance: derived
    derive: invoice_match_tolerance
    enforced_in: "epms-api app/crud/invoice.py _match_tolerance_pct / within_tolerance / match(); app/models/config.py invoice_match_tolerance_pct server_default 5; app/schemas/config.py ConfigUpdate has no such field"
    test:
      - "tests/test_match_tolerance.py::test_variance_above_tolerance_blocks"
      - "tests/test_rule_registry.py::test_match_tolerance_is_read_and_not_editable"
  - id: duplicate_invoice_number
    asked_as:
      - 同一个供应商的同一个发票号能上传两次吗？
      - can the same invoice number be uploaded twice
    answer: >
      No — the upload form refuses an invoice when one with the same vendor
      and the same vendor invoice number (ignoring upper/lower case) already
      exists ("Duplicate invoice — … already exists in the system"). The
      check is made by the form against the invoices you can see; the server
      itself does not refuse a duplicate. Vendor credit notes are refused by
      the server when that vendor already has a credit with the same
      credit-note number that has not been voided.
    enforced_in: "epms/src/pages/invoices/InvoiceListPage.tsx duplicate check; epms-api app/api/v1/invoices.py create has none; finance-api app/crud/vendor_credit.py _find_duplicate (409)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_duplicate_invoice_numbers_are_caught_by_the_form_only"
  - id: invoice_due_date
    asked_as:
      - 发票的到期日是怎么算的？
      - how is an invoice's due date calculated
    answer: >
      When an invoice is uploaded its due date is: the due date read off the
      invoice itself, if it shows one; otherwise, when the invoice states
      NET n terms, the invoice date + n days; and if the field is still
      empty at upload, the invoice date + 30 days. The uploader can also
      type or change it. The system does not record which of these gave a
      particular invoice its due date, so for one invoice only the two dates
      can be compared — not which rule produced them.
    enforced_in: "epms/src/pages/invoices/InvoiceListPage.tsx (dueDate / paymentTermsNetDays / +30 on submit); epms-api app/models/invoice.py has no due-date source column"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_invoice_due_date_rules_are_the_forms"
  - id: freight_lines_on_an_invoice
    asked_as:
      - 发票上的运费行怎么处理？
      - how are freight lines on an invoice handled
    answer: >
      When matching, a freight, shipping or similar line can be marked as a
      Non-PO fee (right-click the line → Mark as other fee). That line is not
      allocated to any PO line and is left out of the PO match and the
      variance, but it still counts toward the invoice total and is paid
      with the invoice: it becomes a line of the payment application. A
      courier's own invoice is different — see
      courier_invoices_are_matched_to_shipments.
    enforced_in: "epms-api app/schemas/invoice.py non_po_fee; app/crud/invoice.py match (excluded from allocation, counted in the balance); app/crud/pa_lines.py (fee lines become PA lines)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_non_po_fee_lines_are_paid_but_not_matched"
  - id: unmatching_an_invoice
    asked_as:
      - 这张发票能取消匹配吗？
      - can this invoice be unmatched
    answer: >
      Unmatch is refused once the invoice has entered payment (status
      approved or paid), and while any payment application that is not
      cancelled still includes it — the message names that PA, which has to
      be cancelled first. An invoice matched to an agreement cannot be
      unmatched from a PO. A reason is required.
    enforced_in: "epms-api app/crud/invoice.py gr_unlink_blocker / _invoice_referenced_by_active_pa; app/api/v1/invoices.py _guard_unmatch"
    provenance: pinned
    test:
      - "tests/test_invoice_unmatch.py::test_unmatch_is_refused_while_an_active_pa_references_the_invoice"
      - "tests/test_invoice_unmatch.py::test_unmatch_refused_once_the_invoice_has_entered_payment"
      - "tests/test_invoice_unmatch.py::test_unmatch_po_refused_on_the_agreement_route"
      - "tests/test_invoice_unmatch.py::test_unmatch_requires_a_reason"
  - id: one_invoice_one_pa
    also_in: [pa]
    asked_as:
      - 同一张发票能被两张 PA 付款吗？
      - can one invoice be paid by two PAs
    answer: >
      No, in practice: the payment application form does not offer an
      invoice that is already on another payment application that is not
      cancelled or rejected, so each invoice is paid by one PA. This is the
      form's rule — the server does not itself refuse it.
    enforced_in: "epms/src/pages/pa/PaCreatePage.tsx (claimed invoices filtered); epms-api app/crud/po.py payable_invoice_po_ids; app/api/v1/pa.py create has no claim check"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_claimed_invoices_are_hidden_by_the_form_only"
