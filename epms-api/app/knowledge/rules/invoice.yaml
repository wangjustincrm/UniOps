area: invoice
label: Invoices and matching
covers: >
  Invoice numbers, deleting invoices, matching against POs, the match tolerance, duplicate invoice numbers, due dates, freight lines, unmatching, courier invoices, linking freight / customs invoices to raw-material POs.
rules:
  - id: matching_compares_amounts_not_received_quantity
    asked_as:
      - does three-way match compare received quantities
      - 三单匹配会比较收货数量吗
      - can an invoice be matched before the goods are received
    answer: >
      No. Matching compares AMOUNTS, not received quantities. For each PO line
      the system adds up what every matched invoice has billed for it (before
      tax) and compares that with the line's value. Billing less is allowed —
      a line can be invoiced in several parts. Only billing MORE than the line's
      value by more than the configured tolerance puts the invoice in
      exception. Goods receipts are not compared at all, so an invoice can be
      Matched while nothing has been received yet. Receipts that exist are
      linked to the invoice for reference.
      Receiving matters at the NEXT step, payment, and only there: a payment
      application on a PO (any type except a prepayment) is refused unless
      every PO on it has a matched invoice AND some evidence of receipt — a
      goods receipt that is not cancelled or rejected, or a received quantity
      above zero on one of its lines (orders migrated from the old PMS have
      quantities but no goods receipt documents) — OR a user holding the
      "Override Receipt on PA" permission overrides the check and gives a
      reason. That checks that something was received, still not that the
      quantities agree. A matched invoice with no receipt yet is why a
      "Confirm Goods Receipt" task appears. Agreement payments have no
      goods-receipt check and no override, but they have their own: a house
      account invoice needs its agreement receipts attached, or to be settled
      explicitly without receipt evidence with a reason; a recurring
      agreement's invoice needs its billing period's service confirmed.
    enforced_in: "epms-api app/crud/invoice.py match() (amount variance vs PoLineItem.line_total); app/api/v1/pa.py create_pa receipt gate (po_has_three_way_matched_invoice -> core/po_facts.three_way_matched + core/receipt_evidence; receipt_override + pa_override_receipt + reason) and _validate_agreement_pa_invoices; PRD EPMS INV-3WM-006, PA-013, AGR-061 (PRD names only a linked goods receipt — the code also accepts a received quantity on a PO line)"
    provenance: pinned
    test:
      - "tests/test_assistant_iss_round2.py::test_invoice_matches_with_nothing_received"
      - "tests/test_assistant_iss_batch6.py::test_pa_receipt_evidence_is_a_gr_or_a_received_quantity"
      - "tests/test_assistant_iss_batch6.py::test_pa_without_receipt_needs_the_override_and_a_reason"
      - "tests/test_pa_multi_po.py::test_receipt_override_covers_the_ungated_po"
      - "tests/test_receipt_pa_gate.py::test_house_account_pa_refused_when_invoice_has_neither_receipts_nor_legacy"
      - "tests/test_agreement_pa.py::test_recurring_pa_payable_after_manual_period_assignment"
  # ISS-0013: "哪些发票已经逾期未付？" was refused as AP data.
  - id: overdue_invoices
    asked_as:
      - 哪些发票已经逾期未付？
      - which invoices are overdue
    answer: >
      An invoice is overdue when its due date is before today (the plant's
      date) and its status is anything but Paid — the Invoices page's Overdue
      filter, and the red "N d overdue" on its Due Date column. It is the
      same in this answer: the list or count of overdue invoices is read with
      that filter, and the full list is in Export to Excel.
    enforced_in: "epms-api app/models/invoice.py Invoice.overdue (used by app/crud/invoice.py get_all overdue=true and by the ontology field invoice.overdue)"
    provenance: pinned
    test:
      - "tests/test_invoice_due_sorting.py::test_overdue_filter_keeps_only_unpaid_past_due_invoices"
      - "tests/test_invoice_due_sorting.py::test_due_today_is_not_yet_overdue"
      - "tests/test_assistant_iss_batch6.py::test_overdue_is_the_invoice_pages_filter"
  - id: courier_invoices_are_matched_to_shipments
    asked_as:
      - where do I upload a UPS / FedEx / Purolator invoice
      - 快递发票在哪里上传
      - why can this invoice not be matched to a PO
    answer: >
      A courier invoice is uploaded on EPMS → Invoices → Upload Invoice like any
      invoice: when its vendor is a carrier's (Freight → Carriers) the form
      turns into the courier review by itself — there is no type or carrier to
      choose, and a carrier's invoice can only be a courier invoice. It is marked
      Freight in the invoice lists. It
      is never matched to a PO or an agreement: on its invoice page each charge
      is matched to a registered shipment's tracking number and cost center,
      and once finalised it is paid from Payment Applications → New Freight PA.
      Anyone who may upload invoices may upload it. It is matched by holders of
      the Match Courier Invoices permission, or by the person AP assigns it to
      from the Unmatched Queue (like any invoice — they get a "Match Invoice"
      task and need no Freight permission); other invoice readers see it
      read-only. Only the freight manager raises the Freight PA.
    enforced_in: "epms-api app/api/v1/freight.py (create / match / finalize on epms.freight.manage, read-only GET for invoice readers); app/api/v1/invoices.py _refuse_freight; PRD EPMS §3.21"
    provenance: pinned
    test:
      - "tests/test_freight.py::test_generic_invoice_endpoints_refuse_freight_invoices"
      - "tests/test_freight.py::test_ups_sample_auto_matches"
  - id: invoice_internal_number
    asked_as:
      - how are invoice numbers generated
    answer: >
      The vendor's own invoice number is kept as typed. EPMS also gives every
      invoice an internal reference INV-YYYY-NNNN: the year it was entered, then
      the next number never used in that year. A reference is never given out
      twice, even after its invoice is deleted.
    enforced_in: "epms-api app/crud/invoice.py _next_ref → crud/_numbering.py next_number_never_reused (table document_counters, migration id02); PRD EPMS INV-005"
    provenance: pinned
    test:
      - "tests/test_assistant_iss_round2.py::test_numbers_have_the_formats_the_guide_states"
      - "tests/test_invoice_delete_voids_finance.py::test_deleting_the_newest_invoice_does_not_free_its_number"
  - id: invoice_delete_and_finance
    asked_as:
      - what happens in Finance when an invoice is deleted
      - why can't I delete this invoice, it says Finance could not void
    answer: >
      Deleting an invoice — from the Invoices page, Freight or Data Maintenance,
      including inside a PO, PR or agreement delete — also voids its record in
      Finance Accounts Payable in the same step: one never posted is removed,
      one posted at match is voided and its accrual reversed. If Finance cannot
      confirm, nothing is deleted and the message names the invoice; try again
      later. An invoice already in payment cannot be deleted at all.
    enforced_in: "epms-api app/services/finance_sync.py void_deleted_invoices + before_commit guard; api/v1/invoices.py, api/v1/freight.py, api/v1/admin.py delete endpoints; finance-api crud/ap_invoice.py void_for_deleted_source; PRD EPMS INV-DEL-001…003, FINANCE FIN-AP-03"
    provenance: pinned
    test:
      - "tests/test_invoice_delete_voids_finance.py::test_invoices_page_delete_voids_in_finance"
      - "tests/test_invoice_delete_voids_finance.py::test_invoices_page_delete_is_refused_when_finance_cannot_void"

  # ── Added 2026-10-21 (issue review batch 3) ───────────────────────────────
  - id: match_tolerance
    asked_as:
      - 发票匹配的容差是多少？在哪里改？
      - what is the invoice match tolerance
    answer: >
      An invoice that bills more than its PO line still matches when the
      cumulative over-billing is within {pct}% — the company setting for the
      match tolerance (5% unless changed). It cannot be changed in any
      screen. Billing less than the PO line always passes (partial
      invoicing); over-billing beyond the tolerance puts the invoice in
      Exception.
    provenance: derived
    derive: invoice_match_tolerance
    enforced_in: "epms-api app/crud/invoice.py _match_tolerance_pct / within_tolerance / match(); app/models/config.py invoice_match_tolerance_pct server_default 5; app/schemas/config.py ConfigUpdate has no such field"
    test:
      - "tests/test_match_tolerance.py::test_variance_above_tolerance_blocks"
      - "tests/test_rule_registry.py::test_match_tolerance_is_read_and_not_editable"
  - id: duplicate_invoice_number
    asked_as:
      - 同一个供应商的同一个发票号能上传两次吗？
      - can the same invoice number be uploaded twice
      - why can't I upload this invoice, it says duplicate
      - the vendor uses the same invoice number every month
    answer: >
      No. An invoice from the same vendor with the same vendor invoice number
      is refused when one is already in EPMS — whatever its status, and even
      if you cannot open it; the message names it (reference and status). The
      server refuses it, not just the form. Numbers are compared by letters and
      digits only, ignoring case, spaces, punctuation and leading zeros, so
      "INV-00123/A" and "inv 123a" are the same invoice, and so are "000001"
      and "1". A vendor record with the same name counts as the same vendor. A
      number with no letter or digit ("-", "0") is refused. There is no
      override: if the vendor really reuses a number for a different invoice,
      enter it with a suffix such as "000010-OCT". The same rule applies when
      an invoice's number is edited and to courier invoices. Vendor credit
      notes are refused when that vendor already has a credit with the same
      credit-note number that has not been voided.
    enforced_in: "epms-api app/crud/invoice_dedup.py (lookup) + unique index uq_invoices_vendor_invoice_key (migration id01); POST/PATCH /invoices, GET /invoices/duplicate-check, crud/freight.py create_invoice; finance-api app/crud/vendor_credit.py _find_duplicate (409); PRD EPMS INV-004…004f"
    provenance: pinned
    test:
      - "tests/test_invoice_dedup.py::test_requester_cannot_reupload_an_invoice_they_cannot_see"
      - "tests/test_invoice_dedup.py::test_a_suffix_lets_a_reused_number_in"
      - "tests/test_invoice_dedup.py::test_the_index_refuses_a_second_row_written_directly"
  - id: invoice_due_date
    asked_as:
      - 发票的到期日是怎么算的？
      - how is an invoice's due date calculated
    answer: >
      When an invoice is uploaded its due date is: the due date read off the
      invoice itself, if it shows one; otherwise, when the invoice states
      NET n terms, the invoice date + n days; and if the field is still
      empty at upload, the invoice date + 30 days. The uploader can also
      type or change it. The system does not record which of these gave a
      particular invoice its due date, so for one invoice only the two dates
      can be compared — not which rule produced them.
    enforced_in: "epms/src/pages/invoices/InvoiceListPage.tsx (dueDate / paymentTermsNetDays / +30 on submit); epms-api app/models/invoice.py has no due-date source column"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_invoice_due_date_rules_are_the_forms"
  - id: freight_lines_on_an_invoice
    asked_as:
      - 发票上的运费行怎么处理？
      - how are freight lines on an invoice handled
    answer: >
      When matching, a freight, shipping or similar line can be marked as a
      Non-PO fee (right-click the line → Mark as other fee). That line is not
      allocated to any PO line and is left out of the PO match and the
      variance, but it still counts toward the invoice total and is paid
      with the invoice: it becomes a line of the payment application. A
      courier's own invoice is different — see
      courier_invoices_are_matched_to_shipments. So is a separate freight or
      customs invoice from a forwarder or broker for a raw-material order —
      see linking_a_fee_invoice_to_a_raw_material_po.
    enforced_in: "epms-api app/schemas/invoice.py non_po_fee; app/crud/invoice.py match (excluded from allocation, counted in the balance); app/crud/pa_lines.py (fee lines become PA lines)"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_non_po_fee_lines_are_paid_but_not_matched"
  # ── Added 2026-10-23 (PO Fee Invoices) ───────────────────────────────────
  - id: linking_a_fee_invoice_to_a_raw_material_po
    also_in: [po]
    asked_as:
      - 运费发票 / 清关费发票怎么关联到原料 PO？
      - how do I link a freight or customs invoice to a raw-material PO
      - can a freight invoice be linked to a milk PO
      - 运费发票能关联 EPMS 自己的 PO 吗？
      - can a freight invoice be linked to a PO raised in EPMS
      - a customs invoice covers several POs, how do I record that
    answer: >
      A freight or customs-clearance invoice from a forwarder or broker is
      still paid by a Direct PA, to that forwarder or broker. Separately, on
      the invoice's page, Link to PO records which arrival of which order it
      belongs to — an order from NC (raw material, packaging or milk) or a PO
      raised in EPMS, any vendor's order, searched by PO number, vendor or
      arrival number, the most recent arrivals listed first. An NC order is
      offered only once it has an arrival, and its link always names one. An
      EPMS PO is offered once approved (not draft, in approval, returned,
      rejected or cancelled); if it has arrivals the link names one, if it has
      none yet it is linked to the whole PO, and every fee type can be used on
      it. A milk order with no
      Incoterms can only be linked as Other — set its Incoterms in Edit
      Details to link freight or customs to it. A fee linked as Other needs a
      note saying what it is (inspection, storage, …). A freight bill can
      be linked to several arrivals at once, across orders, when the carrier
      combined them; a customs invoice is linked line by line, each line to
      its own PO's arrival. Amounts are not compared or
      split, and linking does not change the invoice's match, status or
      payment. It can be done on an invoice that is matched for a Direct PA
      or not yet matched, by users who can match invoices.
    enforced_in: "epms-api app/crud/po_fee.py replace_for_invoice (LINKABLE_ROUTES, is_fee_linkable_po = any NC order or an approved EPMS PO, arrival required unless an EPMS PO has none, takes_fee_type = NC milk without Incoterms only 'other'; an 'other' link needs a note); search_candidate_pos (NC orders with an arrival + approved EPMS POs, filtered by fee_type); app/api/v1/invoices.py PUT /invoices/{id}/fee-links (epms.invoice.match); app/models/invoice_fee_link.py (not invoices.po_id)"
    provenance: pinned
    test:
      - "tests/test_po_fee.py::test_linking_never_touches_matching_or_payment"
      - "tests/test_po_fee.py::test_link_validation"
      - "tests/test_po_fee.py::test_milk_orders_take_fee_links_too"
      - "tests/test_po_fee.py::test_epms_raised_pos_take_fee_links"
      - "tests/test_po_fee.py::test_candidates_are_nc_orders_with_arrivals_and_approved_epms_pos"
      - "tests/test_po_fee.py::test_an_other_fee_needs_a_note"
      - "tests/test_po_fee.py::test_freight_per_arrival_and_customs_per_line_complete_the_po"
  - id: unmatching_an_invoice
    asked_as:
      - 这张发票能取消匹配吗？
      - can this invoice be unmatched
    answer: >
      Unmatch is refused once the invoice has entered payment (status
      approved or paid), and while any payment application that is not
      cancelled still includes it — the message names that PA, which has to
      be cancelled first. An invoice matched to an agreement cannot be
      unmatched from a PO. A reason is required.
    enforced_in: "epms-api app/crud/invoice.py gr_unlink_blocker / _invoice_referenced_by_active_pa; app/api/v1/invoices.py _guard_unmatch"
    provenance: pinned
    test:
      - "tests/test_invoice_unmatch.py::test_unmatch_is_refused_while_an_active_pa_references_the_invoice"
      - "tests/test_invoice_unmatch.py::test_unmatch_refused_once_the_invoice_has_entered_payment"
      - "tests/test_invoice_unmatch.py::test_unmatch_po_refused_on_the_agreement_route"
      - "tests/test_invoice_unmatch.py::test_unmatch_requires_a_reason"
  - id: one_invoice_one_pa
    also_in: [pa]
    asked_as:
      - 同一张发票能被两张 PA 付款吗？
      - can one invoice be paid by two PAs
    answer: >
      No, in practice: the payment application form does not offer an
      invoice that is already on another payment application that is not
      cancelled or rejected, so each invoice is paid by one PA. This is the
      form's rule — the server does not itself refuse it.
    enforced_in: "epms/src/pages/pa/PaCreatePage.tsx (claimed invoices filtered); epms-api app/crud/po.py payable_invoice_po_ids; app/api/v1/pa.py create has no claim check"
    provenance: pinned
    test:
      - "tests/test_rule_registry.py::test_claimed_invoices_are_hidden_by_the_form_only"
