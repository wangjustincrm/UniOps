# EPMS ontology fragment — the purchasing chain.
#
# This service owns these definitions because it owns the data. Other services
# will bring their own fragment; concepts that genuinely cross services (vendor,
# material, department) belong in a shared upper vocabulary, which does not
# exist yet and should stay small when it does.
#
# What a definition here buys you, and what it costs:
#
#   * `fields` is a whitelist. A column absent from it cannot be selected,
#     filtered on, grouped by, or even discovered — /assistant/schema does not
#     mention it. Adding one makes that column readable by anyone who can reach
#     the assistant, subject only to the row scope. That is a deliberate act.
#   * `label` is written for the planner, not for us. It is what an LLM reads
#     when deciding whether this field answers the question it was asked.
#   * `perm_key` + `scope` are the two access gates. They are names here and
#     resolve to real callables in app/core/ontology.py; a typo in either is a
#     startup error, not a silent hole.
#
# Every name in this file is validated against the ORM at import time — fields
# must exist on the model, metrics must reference a declared field, links must
# point at a declared entity through columns that are really there. A mistake
# here fails the process rather than surfacing as a confusing 422 later.

version: 1

entities:

  purchase_request:
    model: PurchaseRequest
    label: "Purchase Request (PR) — the requisition that starts a purchase.
      HEADER ONLY: requester, department, budget account, status and the total.
      What was actually asked for — descriptions, quantities, unit prices — is
      on `pr_line`"
    perm_key: view_pr
    scope: pr
    date_field: created_at
    amount_excludes:
      field: status
      values: [cancelled, rejected, draft]
      note: "Amounts leave out cancelled, rejected and draft requisitions (no status was asked about)"
    fields:
      number: {kind: text, doc_number: PR, label: "PR number"}
      title: {kind: text, label: "Title"}
      # The stored code and what it means. Duplicated today in two front-end
      # tables that have already drifted (PrEditPage says "Raw Mat./Pack.",
      # GrCreatePage says "Raw Materials / Packaging"); this is the backend's
      # copy and the one the assistant answers from.
      type:
        kind: int
        label: "Procurement type. Type 1 (Raw Materials / Packaging) cannot be
          chosen when creating a PR in EPMS — those orders come from NC; say so
          whenever the types are listed"
        value_labels:
          1: "Raw Materials / Packaging"
          2: "Consumables"
          3: "Spare Parts"
          4: "Service"
          5: "Fixed Asset"
          6: "Project"

      # Widened 2026-10-02: test_every_enum_value_in_the_database_is_declared
      # found values in the data the planner had never been told about.
      status:
        kind: enum
        label: "Status"
        values: [draft, submitted, in_review, approved, rejected, returned, cancelled]
      amount: {kind: money, label: "Amount"}
      currency: {kind: text, label: "Currency", enumerate: true}
      vendor_name: {kind: text, label: "Vendor name"}
      department_name: {kind: text, label: "Requesting department", enumerate: true}
      cost_center_name: {kind: text, label: "Cost centre", enumerate: true}
      budget_code: {kind: text, label: "Budget account code"}
      project_code: {kind: text, label: "Project code"}
      required_by: {kind: date, label: "Date the requester needs it by"}
      # Added 2026-10-18 (ISS-0004): shown on the PR page, asked about, and not
      # reachable — "服务完成日期是哪天？负责人是谁？" had no field to read.
      service_completion_date: {kind: date, label: "Service/Project expected completion date (service and project PRs)"}
      service_owner_name:
        kind: text
        label: "Service/Project Owner — who confirms the work is done. For a
          service or project PR with an owner set, that person; otherwise the
          requester"
      requester_full_name: {kind: text, label: "Requester — who raised the PR"}
      is_prepaid: {kind: bool, label: "Prepaid purchase"}
      over_budget: {kind: bool, label: "Exceeds its budget account"}
      submitted_at: {kind: datetime, label: "Submitted at"}
      # ISS-0060: approval time lives only in the approval history.
      approved_at:
        kind: datetime
        label: "When the PR was finally approved (its last approval), approved
          PRs only. PMS-imported PRs carry a reconstructed history"
      days_to_approve: {kind: money, label: "Days from submission to final approval (approved PRs with a submission time)"}
      created_at: {kind: datetime, label: "Created at"}
    metrics:
      amount: {fn: sum, field: amount, label: "Total requested amount", currency: currency}
      count: {fn: count, field: "*", label: "Number of PRs"}
      avg_amount: {fn: avg, field: amount, label: "Average PR amount", currency: currency}
      avg_days_to_approve: {fn: avg, field: days_to_approve, label: "Average days from submission to approval"}
    links:
      orders:
        target: purchase_order
        cardinality: one_to_many
        local: id
        remote: pr_id
        label: "Purchase orders raised from this requisition"
      receipts:
        target: goods_receipt
        cardinality: one_to_many
        local: id
        remote: pr_id
        label: "Goods receipts recorded against this requisition"
      lines:
        target: pr_line
        cardinality: one_to_many
        local: id
        remote: pr_id
        label: "What was asked for — the line items"

  purchase_order:
    model: PurchaseOrder
    label: "Purchase Order (PO) — the order placed with a vendor. HEADER ONLY:
      vendor, dates, status and the total. It does NOT carry what was ordered —
      for line items, descriptions, quantities or unit prices, query `po_line`
      instead and reach these fields across its `order` link"
    perm_key: view_po
    scope: po
    # placed_at reads like the right answer — it is when the order actually went
    # to the vendor — and it is wrong here. It is only set when the order was
    # sent FROM EPMS; orders mirrored in from NC were placed in NC and have it
    # NULL. On the production snapshot that is 6569 of 6755 rows, so using it as
    # the default axis silently drops 97% of purchasing from every "last N
    # months" question. Measured 2026-09-13: last 3 months returns 650 orders by
    # created_at against 186 by placed_at.
    #
    # ── created_at is NOT the order date for anything before 2026 ─────────────
    # This block used to claim it was "a real business date rather than a
    # mirroring timestamp". Measured 2026-09-15, that is false for most of the
    # history. Comparing the year in each PO number (which encodes YYMM) against
    # created_at:
    #
    #     numbers saying 2023   986 orders    0.0% have created_at in 2023
    #     numbers saying 2024  1874 orders    5.9%
    #     numbers saying 2025  2163 orders   47.3%
    #     numbers saying 2026  1633 orders  100.0%
    #
    # The earliest created_at in the whole table is 2024-01-03, so NOTHING is
    # dated 2023 even though 986 orders were raised then. The PMS migration
    # stamped its own run date: 320 orders share created_at 2024-07-17 and 190
    # share 2024-11-25, which are import batches, not days of heavy purchasing.
    #
    # It stays the date axis because it is the only column populated on every
    # row — placed_at is set on 186 of 6755 — but a period filter over it means
    # "imported or raised in", and for a question about 2023 or 2024 that is a
    # different question from the one asked.
    #
    # There is no better column to switch to. The order's real date survives
    # only inside its NUMBER, which encodes YYMM, and exposing that would mean
    # attaching a computed column to the PurchaseOrder model every other query
    # in this service also uses — too much blast radius for one field. Until a
    # real order_date column is backfilled, the assistant is told to say what
    # the axis means rather than pretend it means something else.
    date_field: created_at
    amount_excludes:
      field: status
      values: [cancelled, rejected, draft]
      note: "Amounts leave out cancelled, rejected and draft purchase orders (no status was asked about)"
    fields:
      number: {kind: text, doc_number: PO, label: "PO number"}
      title: {kind: text, label: "Title"}
      # The stored code and what it means. Duplicated today in two front-end
      # tables that have already drifted (PrEditPage says "Raw Mat./Pack.",
      # GrCreatePage says "Raw Materials / Packaging"); this is the backend's
      # copy and the one the assistant answers from.
      #
      # Type 1 shows up here and never on a PR: raw material and packaging is
      # bought in NC and mirrored in, so it has no EPMS requisition behind it.
      # A count of type 1 requests is legitimately zero — which is a fact about
      # how buying works, not a gap in the data.
      type:
        kind: int
        label: "Procurement type"
        value_labels:
          1: "Raw Materials / Packaging"
          2: "Consumables"
          3: "Spare Parts"
          4: "Service"
          5: "Fixed Asset"
          6: "Project"

      # The list used to be the six statuses of the EPMS approval flow. Orders
      # mirrored from NC — which is nearly all of type 1 — carry four more, and
      # the planner, told those six were the ONLY values, had no way to name
      # them: "exclude milk orders" could not be expressed, so it was not, and
      # the answer was built over milk lines. Measured on production 2026-10-02
      # (type 1: 159 nc_milk, 143 issued, 123 closed, 2 nc_pending, ...).
      # test_every_enum_value_in_the_database_is_declared keeps this in step.
      #
      # value_labels rather than bare values because two of these are not
      # self-explanatory and one of them IS the answer to a question people ask:
      # "milk type" is not a field anywhere, it is status nc_milk.
      status:
        kind: enum
        label: "Status"
        values: [draft, submitted, in_review, approved, rejected, returned,
                 issued, partially_received, fully_received, closed, cancelled,
                 nc_pending, nc_milk]
        value_labels:
          draft: "Draft"
          submitted: "Submitted"
          in_review: "In review"
          approved: "Approved"
          rejected: "Rejected"
          returned: "Returned to its creator for changes — not rejected"
          issued: "Issued to the vendor and still open. Every open NC raw-material/packaging order sits here whatever has arrived — how much is received is on the lines (po_line.outstanding_qty), not in this status"
          partially_received: "Partially received"
          fully_received: "Fully received"
          closed: "Closed"
          cancelled: "Cancelled"
          nc_pending: "Not yet approved in NC — of any trade type, milk included; a milk order only becomes nc_milk once NC approves it"
          nc_milk: "Milk order (\"Milk type\") — an NC order of any trade type other than raw material/packaging; raw cow/goat milk, skim, evaporated milk. Received and stocked in NC by hand, so its received quantities here are not kept up to date"
      total: {kind: money, label: "Total including tax"}
      subtotal: {kind: money, label: "Total before tax"}
      tax_amount: {kind: money, label: "Tax amount"}
      currency: {kind: text, label: "Currency", enumerate: true}
      vendor_name: {kind: text, label: "Vendor name"}
      budget_code: {kind: text, label: "Budget account code"}
      pr_number: {kind: text, doc_number: PR, label: "Originating PR number"}
      expected_delivery: {kind: date, label: "Expected delivery date"}
      placed_at: {kind: datetime, label: "Date the order was placed with the vendor"}
      # ISS-0045: how the order went out was recorded all along, but not here,
      # so the answer was "EPMS has no record of it".
      place_order_method:
        kind: enum
        label: "How the order was placed"
        values: [email, online, nc]
        value_labels:
          email: "Emailed to the vendor from EPMS"
          online: "Placed online, confirmed in EPMS"
          nc: "Ordered in NC (mirrored PO)"
      place_order_email_to: {kind: text, label: "Who the order email was sent to (email orders). Sending is recorded, delivery is not confirmed"}
      place_order_reference: {kind: text, label: "Reference recorded when placing the order (portal order ID; the NC number for NC orders)"}
      # Derived from the code that acts on them (core.po_facts, crud.pa_links);
      # ISS-0036 / ISS-0060.
      three_way_matched:
        kind: bool
        label: "Whether the PO is three-way matched: a matched invoice and
          something received against it — the test a payment application
          needs (INV-3WM-006)"
      invoiced: {kind: bool, label: "Whether the PO has any invoice that is not cancelled"}
      has_pa:
        kind: bool
        label: "Whether any payment application pays this PO (any status, as the
          Create Payment Application task counts). \"No PA yet\" is has_pa =
          false"
      is_prepaid: {kind: bool, label: "Prepaid order"}
      source: {kind: text, label: "Origin system (NC mirror or created here)", enumerate: true}
      created_at: {kind: datetime, label: "Created at"}
    metrics:
      amount: {fn: sum, field: total, label: "Total ordered amount including tax", currency: currency}
      subtotal: {fn: sum, field: subtotal, label: "Total ordered amount before tax", currency: currency}
      count: {fn: count, field: "*", label: "Number of POs"}
      avg_amount: {fn: avg, field: total, label: "Average PO value", currency: currency}
      # ISS-0054: "how many vendors have orders" is a distinct count, not the
      # number of order rows.
      vendor_count: {fn: count_distinct, field: vendor_name, label: "Number of different vendors on these POs"}
    links:
      originating_pr:
        target: purchase_request
        cardinality: many_to_one
        local: pr_id
        remote: id
        label: "The requisition this order came from"
      receipts:
        target: goods_receipt
        cardinality: one_to_many
        local: id
        remote: po_id
        label: "Goods receipts recorded against this order"
      invoices:
        target: invoice
        cardinality: one_to_many
        local: id
        remote: po_id
        label: "Invoices billed against this order"
      payments:
        target: payment_application
        cardinality: one_to_many
        local: id
        remote: po_id
        label: "Payment applications raised against this order"
      lines:
        target: po_line
        cardinality: one_to_many
        local: id
        remote: po_id
        label: "What was actually ordered — the line items"

  # ── Line items ──────────────────────────────────────────────────────────────
  #
  # Added 2026-09-15. Asked for a vendor's orders "including LineItem", the
  # assistant returned the headers and told the requester to "request a query of
  # purchase_order_line_item" — an entity it had invented. Asked for exactly
  # that, it correctly answered that no such entity exists. It had sent someone
  # on a round trip to a table it made up, which is worse than declining.
  #
  # Neither line entity carries a scope of its own. A line is exactly as visible
  # as the document it belongs to, and giving it independent rules would be a
  # second opinion about who may see an order — two answers that drift. Both
  # scope through the parent's subquery, the way goods_receipt already does.
  po_line:
    model: PoLineItem
    label: "Purchase Order line — one thing that was ordered, with its quantity
      and price. This is the entity for \"what was ON the order\"; reach the
      vendor, date and status through `order`"
    perm_key: view_po
    scope: po_line
    # Lines have no date of their own. Anchoring a period on the order's date
    # is what makes \"what did we buy from them since 2023\" work — without
    # this the only date reachable is the header's, one hop away, and a period
    # filter would be silently dropped.
    date_field: order.created_at
    amount_excludes:
      field: order.status
      values: [cancelled, rejected, draft]
      note: "Amounts leave out lines of cancelled, rejected and draft purchase orders (no status was asked about)"
    fields:
      po_id: {kind: uuid, internal: true}
      description: {kind: text, label: "Description"}
      material_id: {kind: text, label: "Material ID"}
      supplier_item_id: {kind: text, label: "Supplier item ID"}
      qty: {kind: money, label: "Quantity ordered"}
      unit: {kind: text, label: "Unit"}
      # NUMERIC(15,5) in the database, not (15,2): NC quotes to five decimals
      # and rounding to cents put 319 of 4,944 production lines out by 43,256
      # in total. Reported at full precision for the same reason.
      unit_price: {kind: money, label: "Unit price"}
      line_total: {kind: money, label: "Line total"}
      # How much of this line has actually arrived. The gap between this and qty
      # is what is still outstanding, per line rather than per order.
      received_qty: {kind: money, label: "Quantity received so far"}
      # Computed on the model (hybrid properties), not stored. They are here
      # because the query language compares a field to a literal and nothing
      # else: "not fully received" is received_qty < qty, which cannot be said
      # without them. The planner wrote exactly that — value "qty" — and was
      # rejected twice ("I could not build a valid query").
      outstanding_qty:
        kind: money
        label: "Quantity still to receive (qty - received_qty). Greater than 0
          means NOT fully received; 0 or less means fully received"
      outstanding_pct:
        kind: money
        label: "Percent of the ordered quantity still to receive, 0-100. Use
          for share-of-order rules: \"at least 10% still outstanding\" is
          outstanding_pct gte 10"
      sample: {kind: text, label: "Sample required"}
      planned_arrival_date: {kind: date, label: "Planned arrival (NC orders only)"}
    metrics:
      count: {fn: count, field: "*", label: "Lines"}
      qty: {fn: sum, field: qty, label: "Quantity"}
      value: {fn: sum, field: line_total, label: "Line value", currency: order.currency}
    links:
      order:
        target: purchase_order
        cardinality: many_to_one
        local: po_id
        remote: id
        label: "The order this line is on"

  pr_line:
    model: PrLineItem
    label: "Purchase Request line — one thing that was asked for, with its
      quantity and price. Reach the requester, department and status through
      `request`"
    perm_key: view_pr
    scope: pr_line
    date_field: request.created_at
    amount_excludes:
      field: request.status
      values: [cancelled, rejected, draft]
      note: "Amounts leave out lines of cancelled, rejected and draft requisitions (no status was asked about)"
    fields:
      pr_id: {kind: uuid, internal: true}
      description: {kind: text, label: "Description"}
      material_id: {kind: text, label: "Material ID"}
      supplier_item_id: {kind: text, label: "Supplier item ID"}
      qty: {kind: money, label: "Quantity requested"}
      unit: {kind: text, label: "Unit"}
      unit_price: {kind: money, label: "Unit price"}
      line_total: {kind: money, label: "Line total"}
      notes: {kind: text, label: "Line notes"}
    metrics:
      count: {fn: count, field: "*", label: "Lines"}
      qty: {fn: sum, field: qty, label: "Quantity"}
      value: {fn: sum, field: line_total, label: "Line value", currency: request.currency}
    links:
      request:
        target: purchase_request
        cardinality: many_to_one
        local: pr_id
        remote: id
        label: "The requisition this line is on"

  goods_receipt:
    model: GoodsReceipt
    label: "Goods Receipt (GR) — proof that goods or services were received"
    perm_key: view_gr
    # GRs are scoped through their PO, not by a subquery of their own: if you can
    # see the order you can see what arrived against it.
    scope: gr
    # received_at is the honest axis for a receipt — when the goods arrived beats
    # when the row was written. The column is nullable in the schema but set on
    # every row in practice (0 of 948 null on the production snapshot,
    # 2026-09-13), so the exemption is taken knowingly rather than by default.
    # Re-check this if receipts ever start being created without a date.
    date_field: received_at
    date_field_nullable_ok: true
    fields:
      number: {kind: text, doc_number: GR, label: "GR number"}
      title: {kind: text, label: "Title"}
      # Widened 2026-10-02: test_every_enum_value_in_the_database_is_declared
      # found values in the data the planner had never been told about.
      status:
        kind: enum
        label: "Status"
        values: [pending_ack, acknowledged, collection_pending, collected,
                 confirmed, cancelled]
      po_number: {kind: text, doc_number: PO, label: "PO number"}
      pr_number: {kind: text, doc_number: PR, label: "PR number"}
      vendor_name: {kind: text, label: "Vendor name"}
      gr_type:
        kind: enum
        label: "Receipt type. \"Goods\" means physical; a service confirmation
          is not a receipt of goods"
        values: [physical, service]
        value_labels:
          physical: "Goods received (physical)"
          service: "Service confirmation"
      # ISS-0058: "received more than 30 days ago with no invoice" was rebuilt
      # from joins each time (1 / 116 / 48, all wrong). Both facts derived.
      po_invoiced:
        kind: bool
        label: "Whether the receipt's PO has any invoice that is not cancelled
          (on its header or by line allocation). \"Not invoiced yet\" is
          po_invoiced = false"
      days_since_received: {kind: int, label: "Days since it was received (plant-local dates)"}
      currency: {kind: text, label: "Currency", enumerate: true}
      storage_location: {kind: text, label: "Storage location"}
      received_by: {kind: text, label: "Received by"}
      received_at: {kind: datetime, label: "Received at"}
      created_at: {kind: datetime, label: "Created at"}
    metrics:
      count: {fn: count, field: "*", label: "Number of goods receipts"}
    links:
      order:
        target: purchase_order
        cardinality: many_to_one
        local: po_id
        remote: id
        label: "The order these goods were received against"
      requisition:
        target: purchase_request
        cardinality: many_to_one
        local: pr_id
        remote: id
        label: "The requisition upstream of this receipt"
      invoices:
        target: invoice
        cardinality: one_to_many
        local: id
        remote: gr_id
        label: "Invoices matched to this receipt"
      lines:
        target: gr_line
        cardinality: one_to_many
        local: id
        remote: gr_id
        label: "The lines of this receipt, with the quantities received"

  invoice:
    model: Invoice
    label: "Invoice — what the vendor billed, matched against the PO and receipt"
    perm_key: view_invoice
    # The widest scope of the five: an invoice reaches people through its PO, its
    # allocation lines (one invoice can be split across several POs), whoever
    # uploaded it, whoever has an open task on it, and whoever matched it.
    scope: invoice
    date_field: invoice_date
    amount_excludes:
      field: status
      values: [cancelled]
      note: "Amounts leave out cancelled invoices (no status was asked about)"
    fields:
      internal_ref: {kind: text, doc_number: INV, label: "EPMS invoice number shown on the Invoices list, INV-YYYY-NNNN (e.g. INV-2026-0631). An INV- number is ALWAYS this field — the vendor's own number is vendor_invoice_number"}
      vendor_invoice_number: {kind: text, label: "Vendor's own invoice number"}
      vendor_name: {kind: text, label: "Vendor name"}
      # Widened 2026-10-02: test_every_enum_value_in_the_database_is_declared
      # found values in the data the planner had never been told about.
      status:
        kind: enum
        label: "Matching status"
        values: [unmatched, match_review, matched, exception, paid, cancelled]
      amount: {kind: money, label: "Amount before tax"}
      tax_amount: {kind: money, label: "Tax amount"}
      total_amount: {kind: money, label: "Total including tax"}
      currency: {kind: text, label: "Currency", enumerate: true}
      invoice_date: {kind: date, label: "Invoice date"}
      due_date: {kind: date, label: "Payment due date"}
      po_number: {kind: text, doc_number: PO, label: "PO number this invoice bills against"}
      gr_number:
        kind: text
        label: "Goods receipt number linked to the invoice. Empty does NOT mean
          not received — agreement invoices never have one. For received or not,
          use po_receipt_recorded"
      agreement_number: {kind: text, doc_number: AGR, label: "Agreement number, for agreement billing"}
      # Added 2026-10-19 (ISS-0013).
      billed_against:
        kind: enum
        label: "What the invoice is billed against: purchase_order, agreement, or
          freight (a courier invoice, matched to shipments — never to a PO or
          agreement); none = not matched to a PO or agreement yet"
        values: [purchase_order, agreement, freight, none]
      po_receipt_recorded:
        kind: bool
        label: "PO-route invoices only: whether the PO has any receipt evidence
          (a goods receipt, or a received quantity on its lines) — the same rule
          the payment receipt check uses. Empty for agreement invoices, which are
          backed by agreement receipts and are never 'not received'. \"Matched but
          not received\" is status = matched AND billed_against = purchase_order
          AND po_receipt_recorded = false"
      uploaded_by_name: {kind: text, label: "Who uploaded it"}
      # ISS-0016 / ISS-0036: the match result is stored on the invoice; without
      # these "does the invoice exceed the PO" was answered from the PO alone.
      matched_at: {kind: datetime, label: "When it was matched"}
      matched_by_name: {kind: text, label: "Who matched it"}
      po_total: {kind: money, label: "PO total at the time of matching"}
      matched_reference_total: {kind: money, label: "Pre-tax PO amount the invoice was matched against (the selected PO lines, or the whole PO)"}
      variance:
        kind: money
        label: "Invoice pre-tax amount (Non-PO fee lines excluded) minus the PO
          amount it was matched against. Positive = invoiced more than the PO;
          negative = less (allowed). Each PO line is checked against the match
          tolerance; over it, the invoice goes to exception"
      variance_pct: {kind: money, label: "variance as a percent of the matched PO amount"}
      exception_reason: {kind: text, label: "Why matching put it in exception"}
      # ISS-0059: the PA an invoice is on (not cancelled), and its status.
      pa_number: {kind: text, doc_number: PA, label: "The payment application this invoice is on (not cancelled); empty = on none"}
      pa_status:
        kind: enum
        label: "Status of that payment application (processed = paid)"
        values: [draft, submitted, in_review, approved, rejected, returned, processed, paid]
      created_at: {kind: datetime, label: "Uploaded at — when the invoice entered EPMS (the Invoices list's Upload Date); not the vendor's invoice date"}
    metrics:
      total: {fn: sum, field: total_amount, label: "Total invoiced including tax", currency: currency}
      pre_tax: {fn: sum, field: amount, label: "Total invoiced before tax", currency: currency}
      count: {fn: count, field: "*", label: "Number of invoices"}
      avg_total: {fn: avg, field: total_amount, label: "Average invoice value", currency: currency}
    links:
      allocations:
        target: invoice_allocation
        cardinality: one_to_many
        local: id
        remote: invoice_id
        label: "How the invoice is spread over PO lines, with each line's difference"
      order:
        target: purchase_order
        cardinality: many_to_one
        local: po_id
        remote: id
        label: "The order this invoice bills against (its primary one — an invoice may be allocated across several)"
      receipt:
        target: goods_receipt
        cardinality: many_to_one
        local: gr_id
        remote: id
        label: "The goods receipt this invoice was matched to"

  payment_application:
    model: PaymentApplication
    label: "Payment Application (PA) — the request to actually pay a vendor"
    perm_key: view_pa
    # Also carries an ownership filter, not just visibility: OA's Direct PAs have
    # both po_id and agreement_id NULL and are not EPMS's rows at all.
    scope: pa
    date_field: created_at
    amount_excludes:
      field: status
      values: [cancelled, rejected, draft]
      note: "Amounts leave out cancelled (incl. rejected) and draft payment applications (no status was asked about)"
    fields:
      pa_number: {kind: text, doc_number: PA, label: "PA number"}
      title: {kind: text, label: "Title"}
      # Widened 2026-10-02: test_every_enum_value_in_the_database_is_declared
      # found values in the data the planner had never been told about.
      status:
        kind: enum
        label: "Status. A REJECTED payment application has status cancelled —
          the approval engine never writes rejected for a PA. To find rejected
          PAs, look for cancelled ones; filtering on rejected finds none. A PAID
          payment application has status processed, never paid"
        values: [draft, submitted, in_review, approved, rejected, returned,
                 processed, cancelled, paid]
        # ISS-0072 / ISS-0059 / ISS-0042: with bare values the planner matched
        # "paid" to the legacy value `paid` and "waiting for payment" to
        # in_review, and every payment question came back empty or wrong.
        value_labels:
          draft: "Draft — not submitted yet"
          submitted: "Submitted — waiting for its first approver"
          in_review: "In approval — still being approved, not payable yet"
          approved: "Approved and awaiting payment — fully approved, the payment has not been made yet. \"Waiting to be paid\" means this"
          rejected: "Legacy value from imported history; a PA rejected today is cancelled"
          returned: "Returned to its creator for changes"
          processed: "Paid — the payment was made in Finance (paid_on is the payment date). \"Paid\" and \"how much was paid\" mean this status"
          cancelled: "Cancelled — includes every PA an approver rejected"
          paid: "Legacy value from imported history, never written now. A paid PA is processed; use paid only together with processed"
      pa_type:
        kind: enum
        label: "Payment type"
        values: [regular, prepayment, settlement, balance]
      vendor_name: {kind: text, label: "Vendor name"}
      po_number: {kind: text, doc_number: PO, label: "PO number being paid"}
      agreement_number: {kind: text, doc_number: AGR, label: "Agreement number, for agreement payments"}
      subtotal: {kind: money, label: "Amount before tax"}
      tax_amount: {kind: money, label: "Tax amount"}
      payment_amount: {kind: money, label: "Amount to be paid"}
      currency: {kind: text, label: "Currency", enumerate: true}
      created_at: {kind: datetime, label: "Created at"}
      submitted_at: {kind: datetime, label: "When it was submitted for approval"}
      approved_at: {kind: datetime, label: "When it was fully approved"}
      paid_on:
        kind: date
        label: "Payment date — the date Finance recorded the payment (status
          processed). \"Paid last week\" and \"when was it paid\" filter or read
          this, never created_at"
    metrics:
      amount: {fn: sum, field: payment_amount, label: "Total requested for payment", currency: currency}
      count: {fn: count, field: "*", label: "Number of payment applications"}
      avg_amount: {fn: avg, field: payment_amount, label: "Average payment value", currency: currency}
    links:
      order:
        target: purchase_order
        cardinality: many_to_one
        local: po_id
        remote: id
        label: "The order being paid (its primary one — a PA can settle several)"
      agreement:
        target: purchase_agreement
        cardinality: many_to_one
        local: agreement_id
        remote: id
        label: "The purchase agreement this PA pays against, for agreement payments"
      payments:
        target: payment_record
        cardinality: one_to_many
        local: id
        remote: pa_id
        label: "The payment(s) Finance executed for this PA — date, account, net
          paid. Needs View Finance"

  # Added 2026-10-16 (ISS-0002): the Agreement detail page showed validity, NTE
  # and consumed, and the Assistant said none of it existed — one answer even
  # claimed the system does not store agreement terms.
  purchase_agreement:
    model: PurchaseAgreement
    label: "Purchase Agreement (AGR) — a standing arrangement with a vendor that
      purchases or payments are made against: its validity window, its spending
      ceiling (Not to Exceed, NTE) and how much of it has been used"
    perm_key: epms.agreement.read
    scope: agreement
    date_field: created_at
    amount_excludes:
      field: status
      values: [cancelled, rejected, draft]
      note: "Amounts leave out cancelled, rejected and draft agreements (no status was asked about)"
    fields:
      number: {kind: text, doc_number: AGR, label: "Agreement number, e.g. AGR-202608-0007"}
      title: {kind: text, label: "Title"}
      agreement_type:
        kind: enum
        label: "Kind of agreement"
        values: [house_account, recurring, milestone]
        value_labels:
          house_account: "House account — open account the department buys against as needed"
          recurring: "Recurring — a service billed on a schedule"
          milestone: "Milestone — paid in agreed stages"
      vendor_name: {kind: text, label: "Vendor name"}
      contract_no: {kind: text, label: "Vendor's contract number"}
      # Nothing in the system ever moves an agreement to `expired` or `closed`
      # (crud/agreement.py): one past its end date still reads `active`.
      status:
        kind: enum
        label: "Status. `active` means approved, NOT that it is still in force —
          an agreement past valid_to keeps status active. Whether it is in force
          is valid_from/valid_to (or days_until_expiry)"
        values: [draft, submitted, in_review, returned, rejected, active,
                 expired, closed, cancelled]
      valid_from: {kind: date, label: "Valid from (first day of the agreement)"}
      valid_to: {kind: date, label: "Valid to (last day of the agreement)"}
      days_until_expiry:
        kind: int
        label: "Days from today until valid_to; negative once it has passed.
          \"Expires within 30 days\" is days_until_expiry between 0 and 30.
          Grace days are not included"
      grace_days: {kind: int, label: "Grace days after valid_to during which invoices are still accepted"}
      not_to_exceed:
        kind: money
        label: "Spending ceiling (Not to Exceed, NTE). EMPTY means the agreement
          has no ceiling — say \"no ceiling\", never \"0\""
      consumed_amount: {kind: money, label: "Amount consumed against the agreement so far"}
      remaining_amount:
        kind: money
        label: "NTE still available (not_to_exceed - consumed_amount). Empty
          when there is no ceiling, which means unlimited, not none left"
      currency: {kind: text, label: "Currency", enumerate: true}
      budget_code: {kind: text, label: "Budget account the agreement is charged to"}
      created_at: {kind: datetime, label: "Created at"}
    metrics:
      count: {fn: count, field: "*", label: "Number of agreements"}
      consumed: {fn: sum, field: consumed_amount, label: "Total consumed", currency: currency}

  # ── Added 2026-10-21 (issue review batch 2) ────────────────────────────────
  # ISS-0031: "how much was received" was answered "GRs have no quantity" —
  # the quantities are on the lines, which were not modelled.
  gr_line:
    model: GrLineItem
    label: "Goods Receipt line — what was received on one receipt, per PO line:
      quantity, condition. Reach the receipt (number, date, PO) through
      `receipt`"
    perm_key: view_gr
    scope: gr_line
    date_field: receipt.received_at
    date_field_nullable_ok: true
    fields:
      gr_id: {kind: uuid, internal: true}
      po_line_id: {kind: uuid, internal: true}
      description: {kind: text, label: "Description"}
      material_id: {kind: text, label: "Material ID"}
      qty_ordered: {kind: money, label: "Quantity ordered on the PO line"}
      qty_received: {kind: money, label: "Quantity received as entered on the receipt"}
      actual_qty: {kind: money, label: "Corrected actual quantity, when one was entered"}
      qty_counted:
        kind: money
        label: "Quantity this line adds to the PO line's received quantity
          (actual_qty if entered, otherwise qty_received). Use this for \"how
          much was received\""
      unit: {kind: text, label: "Unit"}
      condition:
        kind: enum
        label: "Condition on arrival"
        values: [good, discrepancy, damaged]
      discrepancy_notes: {kind: text, label: "Notes on a damaged or short line"}
    metrics:
      count: {fn: count, field: "*", label: "Receipt lines"}
      qty: {fn: sum, field: qty_counted, label: "Quantity received"}
    links:
      receipt:
        target: goods_receipt
        cardinality: many_to_one
        local: gr_id
        remote: id
        label: "The receipt this line is on"
      po_line:
        target: po_line
        cardinality: many_to_one
        local: po_line_id
        remote: id
        label: "The PO line this receives against"

  # ISS-0054: the only vendor master in the schema was Finance's
  # business_partner (view_finance, vendors and customers), so counting vendors
  # gave 773, 593 or 7,067. This is the Vendors page: suppliers only, readable
  # by anyone signed in, as that page is.
  vendor:
    model: Vendor
    label: "Vendor — the Vendor Master (EPMS → Vendors): one row per supplier.
      \"How many vendors\" counts these"
    perm_key: signed_in
    scope: vendor
    date_field: created_at
    fields:
      code: {kind: text, label: "POID — the vendor code used in PO numbers"}
      erp_id: {kind: text, label: "NC supplier code (ERP ID)"}
      name: {kind: text, label: "Vendor name"}
      category: {kind: text, label: "Category", enumerate: true}
      payment_terms: {kind: text, label: "Payment terms", enumerate: true}
      max_prepayment_pct:
        kind: money
        label: "Max prepayment % set on the vendor. Empty = the system cap in
          Admin Panel → Prepayment Config applies"
      currency: {kind: text, label: "Default currency", enumerate: true}
      is_active: {kind: bool, label: "Active (inactive vendors cannot be used on new PRs or POs)"}
      contact_name: {kind: text, label: "Contact name"}
      contact_email: {kind: text, label: "Contact email"}
      phone: {kind: text, label: "Phone"}
      created_at: {kind: datetime, label: "Created at"}
    metrics:
      count: {fn: count, field: "*", label: "Number of vendors"}

  # ISS-0044: the Parts Catalog was not modelled; asked for a part by code the
  # answer was "not found", and by name it priced a different item from an old
  # PO line. Readable by anyone signed in, as the catalog page is.
  part:
    model: Part
    label: "Part — the Parts Catalog (EPMS → Parts Catalog): catalog code,
      name, supplier and catalog unit price. For what was actually paid on
      orders use po_line"
    perm_key: signed_in
    scope: permission_only
    date_field: created_at
    fields:
      code: {kind: text, label: "Catalog code"}
      category: {kind: text, label: "Category", enumerate: true}
      name: {kind: text, label: "Part name"}
      description: {kind: text, label: "Description"}
      supplier: {kind: text, label: "Supplier"}
      supplier_part_no: {kind: text, label: "Supplier part number"}
      supplier_item_id: {kind: text, label: "Supplier item ID (ASIN / SKU)"}
      unit_price: {kind: money, label: "Catalog unit price"}
      unit: {kind: text, label: "Unit"}
      is_active: {kind: bool, label: "Active in the catalog"}
      created_at: {kind: datetime, label: "Created at"}
    metrics:
      count: {fn: count, field: "*", label: "Number of parts"}

  # ── ISS-0021: questions that were answered from a look-alike entity ────────
  # Vendor credits were looked for on agreements, agreement receipts on goods
  # receipts, courier shipments on invoices, projects on agreements — and
  # each came back "none". These are the entities those pages read.

  # Owned by finance-api (same database), so declared as a table. The Vendor
  # Credits page is gated by View Invoices (PRD VC-004), and lists every credit.
  vendor_credit:
    table: vendor_credits
    label: "Vendor credit — money a vendor owes back (credit note, manual
      credit or import), netted against payments to that vendor. EPMS →
      Vendor Credits"
    perm_key: view_invoice
    scope: permission_only
    date_field: credit_date
    amount_excludes:
      field: status
      values: [void]
      note: "Amounts leave out void credits (no status was asked about)"
    fields:
      credit_number: {kind: text, label: "Credit number (VC-YYYYMMDD-NNNN)"}
      vendor_name: {kind: text, label: "Vendor name"}
      vendor_credit_number: {kind: text, label: "The vendor's own credit note / reference number"}
      credit_date: {kind: date, label: "Credit date"}
      currency: {kind: text, label: "Currency", enumerate: true}
      amount: {kind: money, label: "Amount before tax"}
      tax_amount: {kind: money, label: "Tax"}
      total_amount: {kind: money, label: "Total credit including tax"}
      applied_amount: {kind: money, label: "Already netted against payments"}
      remaining_amount: {kind: money, label: "Still available to net"}
      status:
        kind: enum
        label: "Status"
        values: [pending_review, available, exhausted, void]
        value_labels:
          pending_review: "Pending review"
          available: "Available — will be netted at the next payment to the vendor"
          exhausted: "Fully used"
          void: "Void (rejected or voided)"
      source:
        kind: enum
        label: "Where it came from"
        values: [upload, manual, qbo_import]
        value_labels:
          upload: "Credit note uploaded"
          manual: "Manual credit (vendor email)"
          qbo_import: "Imported from QuickBooks"
      uploaded_at: {kind: datetime, label: "Recorded at"}
    metrics:
      count: {fn: count, field: "*", label: "Number of credits"}
      total: {fn: sum, field: total_amount, label: "Total credit", currency: currency}
      remaining: {fn: sum, field: remaining_amount, label: "Still available", currency: currency}

  agreement_receipt:
    model: AgreementReceipt
    label: "Agreement receipt — a slip, delivery note or service sign-off
      recorded against a purchase agreement (EPMS → Agreement Receipts). Not a
      goods receipt"
    perm_key: epms.agreement.read
    scope: agreement_receipt
    date_field: receipt_date
    fields:
      agreement_id: {kind: uuid, internal: true}
      receipt_type:
        kind: enum
        label: "Kind of receipt"
        values: [counter_slip, delivery, service]
        value_labels:
          counter_slip: "Counter slip"
          delivery: "Delivery note"
          service: "Service sign-off"
      receipt_date: {kind: date, label: "Receipt date"}
      receipt_ref: {kind: text, label: "Reference on the receipt"}
      vendor_name: {kind: text, label: "Merchant on the receipt (may differ from the agreement's vendor)"}
      amount: {kind: money, label: "Amount before tax"}
      tax_amount: {kind: money, label: "Tax"}
      total_amount: {kind: money, label: "Total"}
      status:
        kind: enum
        label: "Status"
        values: [pending_ap_review, open, reconciled, voided, rejected]
        value_labels:
          pending_ap_review: "Waiting for AP review (entered with a missing-receipt reason)"
          open: "Open — not attached to an invoice yet"
          reconciled: "Attached to an invoice"
          voided: "Removed"
          rejected: "Rejected by AP"
      missing_receipt_reason: {kind: text, label: "Why there is no physical receipt"}
      created_at: {kind: datetime, label: "Recorded at"}
    metrics:
      count: {fn: count, field: "*", label: "Number of receipts"}
      total: {fn: sum, field: total_amount, label: "Total", currency: agreement.currency}
    links:
      agreement:
        target: purchase_agreement
        cardinality: many_to_one
        local: agreement_id
        remote: id
        label: "The agreement the receipt is recorded against"

  # ── Added 2026-10-21 (issue review batch 3) ────────────────────────────────
  # ISS-0022 #1: "协议 AGR-202609-0003 这个月的服务确认了吗？" was refused as
  # "not something the data holds" while the agreement's Payment Schedule
  # showed the period confirmed by name and date.
  agreement_period:
    model: AgreementPaymentSchedule
    label: "Agreement billing period — one row of a purchase agreement's
      Payment Schedule: the period (e.g. 2026-10), its expected date and
      amount, its status, the invoice that settled it, and who confirmed the
      service and when. \"Was this month's service confirmed?\" is
      accepted_at / confirmed_by_name on the period of that agreement"
    perm_key: epms.agreement.read
    scope: agreement_period
    date_field: expected_date
    # Set on every billing period (106 of 106 in the reference data); only a
    # milestone row has none, and milestones are not built yet (Phase 1C).
    date_field_nullable_ok: true
    fields:
      agreement_id: {kind: uuid, internal: true}
      invoice_id: {kind: uuid, internal: true}
      schedule_type:
        kind: enum
        label: "Period (recurring billing) or milestone"
        values: [period, milestone]
        value_labels:
          period: "Billing period of a recurring agreement"
          milestone: "Milestone of a milestone agreement"
      sequence: {kind: int, label: "Position in the schedule (1 = first)"}
      period_label: {kind: text, label: "The period, as YYYY-MM (e.g. 2026-10)"}
      expected_date: {kind: date, label: "Date the period's invoice is expected"}
      expected_amount: {kind: money, label: "Amount expected for the period"}
      status:
        kind: enum
        label: "Status of the period"
        values: [pending, received, overdue, waived]
        value_labels:
          pending: "Pending — no invoice for it yet"
          received: "Received — its invoice has arrived"
          overdue: "Overdue — no invoice although the expected date has passed"
          waived: "Waived — nothing is due for this period"
      confirmed_by_name:
        kind: text
        label: "Who confirmed the service for this period (the agreement
          owner's Confirm Service Period). Empty = not confirmed"
      accepted_at:
        kind: datetime
        label: "When the service for the period was confirmed. Empty = not
          confirmed"
    metrics:
      count: {fn: count, field: "*", label: "Number of periods"}
    links:
      agreement:
        target: purchase_agreement
        cardinality: many_to_one
        local: agreement_id
        remote: id
        label: "The agreement the period belongs to (agreement.number = AGR-…)"
      invoice:
        target: invoice
        cardinality: many_to_one
        local: invoice_id
        remote: id
        label: "The invoice matched to the period (invoice.internal_ref = INV-…)"

  freight_shipment:
    model: FreightShipment
    label: "Courier shipment — a waybill registered in Freight → Shipments.
      Courier invoices are matched to these"
    perm_key: [epms.freight.register, epms.freight.manage]
    scope: freight_shipment
    date_field: created_at
    fields:
      carrier_id: {kind: uuid, internal: true}
      tracking_no: {kind: text, label: "Tracking number"}
      direction:
        kind: enum
        label: "Direction"
        values: [outbound, inbound]
      ship_date: {kind: date, label: "Ship date (filled from the invoice once billed)"}
      status:
        kind: enum
        label: "Status"
        values: [pending, billed, void]
        value_labels:
          pending: "Not billed yet"
          billed: "Billed on a courier invoice"
          void: "Void"
      source:
        kind: enum
        label: "How it was recorded"
        values: [registered, from_invoice]
        value_labels:
          registered: "Registered at ship time"
          from_invoice: "Added while matching an invoice"
      note: {kind: text, label: "Note"}
      created_by_name: {kind: text, label: "Registered by"}
      created_at: {kind: datetime, label: "Registered at"}
    metrics:
      count: {fn: count, field: "*", label: "Number of shipments"}
    links:
      carrier:
        target: freight_carrier
        cardinality: many_to_one
        local: carrier_id
        remote: id
        label: "The carrier"

  freight_carrier:
    model: FreightCarrier
    label: "Courier carrier (Freight → Carriers), e.g. FedEx, Purolator, UPS"
    perm_key: [invoice_upload, epms.freight.register, epms.freight.manage, epms.freight.admin]
    scope: permission_only
    date_field: created_at
    fields:
      code: {kind: text, label: "Carrier code"}
      name: {kind: text, label: "Carrier name"}
      is_active: {kind: bool, label: "Active"}
      created_at: {kind: datetime, label: "Created at"}
    metrics:
      count: {fn: count, field: "*", label: "Number of carriers"}

  # Projects (Master Data → Projects); readable by anyone signed in, as
  # GET /projects is.
  project:
    model: Project
    label: "Project — the Projects list (Master Data → Projects): code, name,
      budget, dates and status"
    perm_key: signed_in
    scope: permission_only
    date_field: created_at
    fields:
      code: {kind: text, label: "Project code"}
      name: {kind: text, label: "Project name"}
      description: {kind: text, label: "Description"}
      status: {kind: text, label: "Status", enumerate: true}
      budget: {kind: money, label: "Project budget"}
      currency: {kind: text, label: "Currency", enumerate: true}
      start_date: {kind: date, label: "Start date"}
      end_date: {kind: date, label: "End date"}
      owner_dept: {kind: text, label: "Owning department"}
      manager_name: {kind: text, label: "Project manager"}
      created_at: {kind: datetime, label: "Created at"}
    metrics:
      count: {fn: count, field: "*", label: "Number of projects"}
      budget: {fn: sum, field: budget, label: "Total project budget", currency: currency}

  # ISS-0016: "is the invoice over the PO, by how much" is decided per PO line
  # (INV-3WM-001); the per-line result is stored here and was not available.
  invoice_allocation:
    model: InvoicePoAllocation
    label: "Invoice allocation — one invoice line's amount placed on one PO
      line (or on the PO header), with that PO line's match result"
    perm_key: view_invoice
    scope: invoice_allocation
    date_field: invoice.invoice_date
    fields:
      invoice_id: {kind: uuid, internal: true}
      po_id: {kind: uuid, internal: true}
      po_line_id: {kind: uuid, internal: true}
      allocated_amount: {kind: money, label: "Amount of this invoice placed on the PO line, before tax"}
      allocated_tax: {kind: money, label: "Tax on that amount"}
      allocated_total: {kind: money, label: "Amount including tax"}
      variance:
        kind: money
        label: "The PO line's difference: everything ALL invoices have placed
          on this PO line (before tax) minus the line's pre-tax value. Below 0
          = not fully invoiced yet (allowed); above 0 = invoiced more than
          ordered, an exception when beyond the match tolerance. No PO line =
          compared with the PO's pre-tax total"
      variance_pct: {kind: money, label: "variance as a percent of the PO line's pre-tax value"}
      note: {kind: text, label: "Note"}
    metrics:
      count: {fn: count, field: "*", label: "Allocation lines"}
      allocated: {fn: sum, field: allocated_amount, label: "Allocated before tax", currency: invoice.currency}
    links:
      invoice:
        target: invoice
        cardinality: many_to_one
        local: invoice_id
        remote: id
        label: "The invoice"
      order:
        target: purchase_order
        cardinality: many_to_one
        local: po_id
        remote: id
        label: "The PO"
      po_line:
        target: po_line
        cardinality: many_to_one
        local: po_line_id
        remote: id
        label: "The PO line (empty = placed on the PO header)"

